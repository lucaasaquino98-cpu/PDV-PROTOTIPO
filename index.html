<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDV Fácil · Frente de Caixa</title>
<style>
:root{--bg:#f1f3f6;--sf:#fff;--tx:#14181f;--mu:#6b7280;--bd:#e3e6eb;--pr:#0f766e;--prt:#fff;--ok:#16a34a;--wa:#b45309;--ba:#dc2626;--okb:#dcfce7;--wab:#fef3c7;--bab:#fee2e2;--nv:#0b1220;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0f14;--sf:#171b22;--tx:#eef0f3;--mu:#98a1b0;--bd:#262c36;--pr:#2dd4bf;--prt:#042f2a;--ok:#4ade80;--wa:#fbbf24;--ba:#f87171;--okb:#12301d;--wab:#3a2c0b;--bab:#3b1515;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0f14;--sf:#171b22;--tx:#eef0f3;--mu:#98a1b0;--bd:#262c36;--pr:#2dd4bf;--prt:#042f2a;--ok:#4ade80;--wa:#fbbf24;--ba:#f87171;--okb:#12301d;--wab:#3a2c0b;--bab:#3b1515;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;height:100%}
nav{width:236px;background:var(--nv);color:#94a3b8;padding:18px 12px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;overflow:hidden;transition:width .25s ease,padding .25s ease,opacity .2s}
body.nav-off nav{width:0;padding-left:0;padding-right:0;opacity:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;color:#fff;font-weight:700;font-size:16px;white-space:nowrap}
.brand i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#14b8a6,#0ea5e9);display:grid;place-items:center;font-style:normal;color:#04201c}
nav .lb{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;color:#475569}
nav button{all:unset;cursor:pointer;padding:11px 12px;border-radius:10px;font-weight:500;display:flex;gap:12px;align-items:center;white-space:nowrap;transition:background .15s,color .15s}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button.on{background:#14b8a6;color:#04201c;font-weight:700}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sp{flex:1}
.usr{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);white-space:nowrap;color:#fff}
.usr b{width:34px;height:34px;border-radius:50%;background:#0ea5e9;display:grid;place-items:center;color:#04201c}
.usr small{display:block;color:#64748b}
main{flex:1;overflow:auto;padding:18px;min-width:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:20px;margin:0;flex:1;min-width:120px}
h3{margin:0 0 10px;font-size:14px}
select,input{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.p{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.btn.ic{padding:8px 10px;display:inline-grid;place-items:center}
.btn.g{width:100%;padding:12px;margin-top:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.sg{display:inline-flex;background:var(--bd);border-radius:10px;padding:3px}
.sg button{all:unset;cursor:pointer;padding:7px 16px;border-radius:8px;font-weight:600;color:var(--mu)}
.sg button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.mesa{cursor:pointer;min-height:104px;position:relative;background:var(--okb);border:2px solid var(--ok);transition:transform .12s}
.mesa:hover{transform:translateY(-2px)}
.mesa.o{background:var(--bab);border-color:var(--ba);animation:pulse 1.5s infinite}
.mesa.i{background:var(--wab);border:2px dashed var(--wa);cursor:not-allowed}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.55)}70%{box-shadow:0 0 0 14px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
@media (prefers-reduced-motion:reduce){.mesa.o{animation:none}}
.mesa b{font-size:17px;display:block;margin-bottom:4px}
.mesa .x{all:unset;cursor:pointer;position:absolute;top:8px;right:10px;font-size:18px;opacity:.55}
.mesa .x:hover{opacity:1}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--ok);color:#fff}
.tag.o{background:var(--ba)}.tag.i{background:var(--wa);color:#fff}
.mesa small{display:block;margin-top:8px;color:var(--mu)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi small{color:var(--mu);display:block}.kpi b{font-size:20px}
.pos{display:grid;grid-template-columns:1fr 340px;gap:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:99px;padding:5px 12px}
.chip.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.prod{cursor:pointer;font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:left;min-height:70px}
.prod:hover{border-color:var(--pr)}.prod b{display:block;font-size:13px}.prod span{color:var(--mu)}
.it{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.it div{flex:1}.q{display:flex;align-items:center;gap:6px}
.q button{width:26px;height:26px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
.row{display:flex;justify-content:space-between;padding:4px 0}
.tot{font-size:22px;font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-weight:600;font-size:12px}
.wrap{overflow-x:auto}
.in{color:var(--ok)}.out{color:var(--ba)}
.bar{height:10px;border-radius:5px;background:var(--pr);margin-top:4px}
.frm{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.frm input,.frm select{flex:1;min-width:110px}
.emp{text-align:center;padding:28px 12px;color:var(--mu)}
.hint{color:var(--mu);font-size:12px;margin:0 0 12px}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.mod .card{width:100%;max-width:380px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.pay .chip{border-radius:10px;padding:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;display:none}
@media (max-width:760px){
.app{flex-direction:column-reverse}
nav{width:auto;flex-direction:row;padding:6px;justify-content:space-around;gap:0;transition:none}
body.nav-off nav{display:none}
nav .brand,nav .sp,nav .usr,nav .lb{display:none}
nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px}
main{padding:12px}.pos{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="toast"></div>
<script>
const SEG={
rest:{nome:'Restaurante',prods:[['Prato executivo','Pratos',32],['Filé à parmegiana','Pratos',48],['Salada Caesar','Entradas',26],['Refrigerante','Bebidas',7],['Suco natural','Bebidas',10],['Pudim','Sobremesas',14]]},
bar:{nome:'Bar',prods:[['Chopp 300ml','Chopp',9],['Caipirinha','Drinks',18],['Gin tônica','Drinks',24],['Cerveja long neck','Cervejas',12],['Porção de fritas','Porções',32]]},
lanch:{nome:'Lanchonete',prods:[['X-Burger','Lanches',22],['X-Bacon','Lanches',27],['Hot dog','Lanches',15],['Pastel','Salgados',9],['Milk shake','Bebidas',16]]},
varejo:{nome:'Varejo / Loja',prods:[['Camiseta básica','Roupas',49.9],['Calça jeans','Roupas',119.9],['Boné','Acessórios',39.9],['Fone de ouvido','Eletrônicos',69.9]]}
};
const mk=()=>({items:[],aberta:false,inv:false,hora:'',nome:''});
const S={seg:'rest',taxa:true,prods:[],pid:0,nm:12,mesas:{},cmds:{},cn:0,mov:[{t:'08:00',desc:'Abertura de caixa',tipo:'in',val:200,forma:'Dinheiro',cat:'Suprimento'}],clientes:[]};
for(let i=1;i<=S.nm;i++)S.mesas[i]=mk();
let view='mesas',mode='m',cur=null,cat='Todos',pay=null,tab='prod';
const $=s=>document.querySelector(s);
const R=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hm=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const P=id=>S.prods.find(p=>p.id==id)||{nome:'(removido)',preco:0};
const tot=m=>m.items.reduce((a,i)=>a+i.q*P(i.id).preco,0);
const G=()=>cur.k=='m'?S.mesas[cur.id]:S.cmds[cur.id];
const lbl=()=>cur.k=='m'?'Mesa '+cur.id:'Comanda '+cur.id+(G().nome?' · '+G().nome:'');
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2400)}
function go(v){view=v;cur=null;pay=null;render()}
function tgl(){document.body.classList.toggle('nav-off')}
const IC={
mesas:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
caixa:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/>',
cad:'<path d="M4 7l8-4 8 4-8 4-8-4zM4 12l8 4 8-4M4 17l8 4 8-4"/>',
fin:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
menu:'<path d="M4 6h16M4 12h16M4 18h16"/>'};
const ic=k=>`<svg viewBox="0 0 24 24">${IC[k]}</svg>`;
function nav(){
 const a=view=='pos'?'mesas':view;
 const it=[['mesas','Atendimento'],['caixa','Caixa'],['cad','Cadastros'],['fin','Financeiro']];
 $('#nav').innerHTML=`<div class="brand"><i>P</i>PDV Fácil</div><div class="lb">Menu</div>`+it.map(([k,l])=>`<button class="${a==k?'on':''}" onclick="go('${k}')">${ic(k)}${l}</button>`).join('')+`<div class="sp"></div><div class="usr"><b>D</b><div>Diretoria<small>Caixa aberto</small></div></div>`;
}
function head(t,extra=''){return `<div class="top"><button class="btn ic" onclick="tgl()" aria-label="Mostrar ou ocultar menu">${ic('menu')}</button><h1>${t}</h1>${extra}<select onchange="S.seg=this.value" aria-label="Segmento">${Object.entries(SEG).map(([k,v])=>`<option value="${k}" ${k==S.seg?'selected':''}>${v.nome}</option>`).join('')}</select></div>`}
function kp(a){return `<div class="kpis">${a.map(([l,v])=>`<div class="card kpi"><small>${l}</small><b>${v}</b></div>`).join('')}</div>`}
function vSalao(){
 const ms=Object.entries(S.mesas),cs=Object.entries(S.cmds);
 const oc=ms.filter(([,m])=>m.aberta).length,iv=ms.filter(([,m])=>m.inv).length;
 const aberto=[...ms,...cs].reduce((a,[,m])=>a+tot(m),0);
 const sg=`<div class="sg"><button class="${mode=='m'?'on':''}" onclick="mode='m';render()">Mesas</button><button class="${mode=='c'?'on':''}" onclick="mode='c';render()">Comandas (${cs.length})</button></div>`;
 let b;
 if(mode=='m'){
  b=kp([['Livres',ms.length-oc-iv],['Ocupadas',oc],['Inválidas',iv],['Em aberto',R(aberto)]])+
  `<div class="top" style="margin-bottom:6px"><p class="hint" style="flex:1;margin:0">Toque numa mesa livre para atender. Use ⊘ para marcar ou reativar uma mesa inválida.</p><button class="btn" onclick="addMesa()">+ Mesa</button><button class="btn" onclick="delMesa()">− Mesa</button></div>
  <div class="grid">${ms.map(([n,m])=>{const k=m.aberta?'o':m.inv?'i':'';return `<div class="card mesa ${k}" role="button" onclick="open_('m',${n})"><b>Mesa ${n}</b><span class="tag ${k}">${m.aberta?'Ocupada':m.inv?'Inválida':'Livre'}</span><small>${m.aberta?R(tot(m))+' · desde '+m.hora:m.inv?'Fora de uso':'Disponível'}</small>${m.aberta?'':`<button class="x" onclick="event.stopPropagation();inv(${n})" aria-label="Alternar inválida">⊘</button>`}</div>`}).join('')}</div>`;
 }else{
  b=kp([['Comandas abertas',cs.length],['Em aberto',R(aberto)]])+
  `<div class="card" style="margin-bottom:14px"><div class="frm" style="margin:0"><input id="cnm" placeholder="Nome do cliente (opcional)"><button class="btn p" onclick="novaCmd()">+ Nova comanda</button></div></div>
  ${cs.length?`<div class="grid">${cs.map(([n,m])=>`<div class="card mesa o" role="button" onclick="open_('c',${n})"><b>Comanda ${n}</b><span class="tag o">Aberta</span><small>${m.nome?m.nome+' · ':''}${R(tot(m))} · ${m.hora}</small></div>`).join('')}</div>`:'<div class="card emp">Nenhuma comanda aberta. Crie a primeira acima.</div>'}`;
 }
 return head('Atendimento',sg)+b;
}
function addMesa(){S.nm++;S.mesas[S.nm]=mk();render()}
function delMesa(){const m=S.mesas[S.nm];if(!m)return;if(m.aberta)return toast('A última mesa está ocupada');delete S.mesas[S.nm];S.nm--;render()}
function inv(n){const m=S.mesas[n];m.inv=!m.inv;render()}
function novaCmd(){S.cn++;S.cmds[S.cn]={items:[],aberta:true,inv:false,hora:hm(),nome:$('#cnm').value.trim()};cur={k:'c',id:S.cn};view='pos';cat='Todos';render()}
function open_(k,id){if(k=='m'&&S.mesas[id].inv)return toast('Mesa inválida. Toque em ⊘ para reativar');cur={k,id};view='pos';cat='Todos';render()}
function vPos(){
 const m=G(),cats=['Todos',...new Set(S.prods.map(p=>p.cat))],ps=S.prods.filter(p=>cat=='Todos'||p.cat==cat);
 const sub=tot(m),tx=S.taxa?sub*.1:0;
 const left=S.prods.length?`<div class="chips">${cats.map(c=>`<button class="chip ${c==cat?'on':''}" onclick="cat='${c}';render()">${c}</button>`).join('')}</div><div class="grid">${ps.map(p=>`<button class="prod" onclick="add(${p.id})"><b>${p.nome}</b><span>${R(p.preco)}</span></button>`).join('')}</div>`:`<div class="card emp">Nenhum produto cadastrado ainda.<br><br><button class="btn p" onclick="go('cad')">Ir para Cadastros</button></div>`;
 const act=!m.aberta?`<button class="btn p g" onclick="ocupar()">Ocupar mesa</button>`:(!m.items.length?`<button class="btn g" onclick="liberar()">${cur.k=='m'?'Liberar mesa':'Cancelar comanda'}</button>`:`<button class="btn g" onclick="liberar()">Cancelar compra e liberar ${cur.k=='m'?'mesa':'comanda'}</button>`);
 return `<div class="top"><button class="btn" onclick="go('mesas')">← Voltar</button><h1>${lbl()}</h1><span class="tag ${m.aberta?'o':''}">${m.aberta?'Ocupada desde '+m.hora:'Livre'}</span></div>
 <div class="pos"><div>${left}</div>
 <div class="card" style="align-self:start"><h3>Comanda</h3>${m.items.length?m.items.map(i=>`<div class="it"><div><b>${P(i.id).nome}</b><br><small style="color:var(--mu)">${R(P(i.id).preco)}</small></div><div class="q"><button onclick="chg(${i.id},-1)">−</button>${i.q}<button onclick="chg(${i.id},1)">+</button></div><b>${R(P(i.id).preco*i.q)}</b></div>`).join(''):'<p style="color:var(--mu)">Toque nos produtos para lançar.</p>'}
 <div class="row" style="margin-top:10px"><span>Subtotal</span><span>${R(sub)}</span></div>
 <label class="row"><span><input type="checkbox" ${S.taxa?'checked':''} onchange="S.taxa=this.checked;render()"> Serviço 10%</span><span>${R(tx)}</span></label>
 <div class="row tot"><span>Total</span><span>${R(sub+tx)}</span></div>
 ${act}<button class="btn g" ${m.items.length?'':'disabled'} onclick="toast('Pedido enviado à cozinha')">Enviar para cozinha</button>
 <button class="btn p g" ${m.items.length?'':'disabled'} onclick="pay='Pix';render()">Fechar conta</button></div></div>`
}
function ocupar(){const m=G();m.aberta=true;m.hora=hm();render()}
function liberar(){const k=cur.k;if(k=='m')S.mesas[cur.id]=mk();else delete S.cmds[cur.id];toast(k=='m'?'Mesa liberada':'Comanda cancelada');go('mesas')}
function add(id){const m=G();if(!m.aberta){m.aberta=true;m.hora=hm()}const i=m.items.find(x=>x.id==id);i?i.q++:m.items.push({id,q:1});render()}
function chg(id,d){const m=G(),i=m.items.find(x=>x.id==id);i.q+=d;if(i.q<1)m.items=m.items.filter(x=>x!=i);if(!m.items.length&&cur.k=='m'){S.mesas[cur.id]=mk();toast('Mesa liberada')}render()}
function vPay(){
 const v=tot(G())*(S.taxa?1.1:1);
 return `<div class="mod"><div class="card"><h3>Fechar ${lbl()}</h3><div class="tot">${R(v)}</div><div class="pay">${['Pix','Cartão','Dinheiro','Vale'].map(f=>`<button class="chip ${pay==f?'on':''}" onclick="pay='${f}';render()">${f}</button>`).join('')}</div>
 <button class="btn p g" onclick="fechar()">Confirmar pagamento</button><button class="btn g" onclick="pay=null;render()">Cancelar</button></div></div>`
}
function fechar(){
 const v=tot(G())*(S.taxa?1.1:1);
 S.mov.push({t:hm(),desc:lbl(),tipo:'in',val:v,forma:pay,cat:'Vendas'});
 if(cur.k=='m')S.mesas[cur.id]=mk();else delete S.cmds[cur.id];
 pay=null;toast('Pagamento registrado');go('mesas');
}
const sum=f=>S.mov.filter(f).reduce((a,x)=>a+x.val,0);
function frm(fields,fn,label){return `<div class="frm">${fields}<button class="btn p" onclick="${fn}">${label}</button></div>`}
function tbl(a){return `<div class="wrap"><table><tr><th>Hora</th><th>Descrição</th><th>Forma</th><th>Valor</th></tr>${a.map(x=>`<tr><td>${x.t}</td><td>${x.desc}<br><small style="color:var(--mu)">${x.cat}</small></td><td>${x.forma}</td><td class="${x.tipo}">${x.tipo=='in'?'+':'−'} ${R(x.val)}</td></tr>`).join('')}</table></div>`}
function vCaixa(){
 const din=sum(x=>x.forma=='Dinheiro'&&x.tipo=='in')-sum(x=>x.forma=='Dinheiro'&&x.tipo=='out');
 const n=S.mov.filter(x=>x.cat=='Vendas').length,ven=sum(x=>x.cat=='Vendas');
 return head('Caixa')+kp([['Status','Aberto'],['Vendas do turno',R(ven)],['Dinheiro em caixa',R(din)],['Ticket médio',R(ven/Math.max(1,n))]])+
 `<div class="card"><h3>Movimentações</h3>${tbl(S.mov.slice().reverse())}${frm(`<input id="cd" placeholder="Descrição"><input id="cv" type="number" step="0.01" placeholder="Valor"><select id="ct"><option value="out">Sangria</option><option value="in">Suprimento</option></select>`,'caixaAdd()','Lançar')}</div>`
}
function caixaAdd(){const v=parseFloat($('#cv').value),t=$('#ct').value;if(!v)return toast('Informe o valor');S.mov.push({t:hm(),desc:$('#cd').value||(t=='out'?'Sangria':'Suprimento'),tipo:t,val:v,forma:'Dinheiro',cat:t=='out'?'Sangria':'Suprimento'});render()}
function vCad(){
 let body;
 if(tab=='prod'){
  body=`<div class="wrap"><table><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th></th></tr>${S.prods.map(p=>`<tr><td>${p.nome}</td><td>${p.cat}</td><td>${R(p.preco)}</td><td><button class="btn" onclick="delP(${p.id})">Excluir</button></td></tr>`).join('')}</table></div>${S.prods.length?'':`<div class="emp">Nenhum produto ainda. Cadastre abaixo ou <button class="btn" onclick="loadEx()">carregar exemplos de ${SEG[S.seg].nome}</button></div>`}`+
  frm(`<input id="pn" placeholder="Nome do produto"><input id="pc" placeholder="Categoria"><input id="pp" type="number" step="0.01" placeholder="Preço">`,'addProd()','Adicionar');
 }else{
  body=`<div class="wrap"><table><tr><th>Nome</th><th>Telefone</th></tr>${S.clientes.map(c=>`<tr><td>${c.nome}</td><td>${c.tel}</td></tr>`).join('')}</table></div>${S.clientes.length?'':'<div class="emp">Nenhum cliente cadastrado.</div>'}`+frm(`<input id="kn" placeholder="Nome"><input id="kt" placeholder="Telefone">`,'addCli()','Adicionar');
 }
 return head('Cadastros')+`<div class="chips"><button class="chip ${tab=='prod'?'on':''}" onclick="tab='prod';render()">Produtos (${S.prods.length})</button><button class="chip ${tab=='cli'?'on':''}" onclick="tab='cli';render()">Clientes (${S.clientes.length})</button></div><div class="card">${body}</div>`
}
function addProd(){const n=$('#pn').value.trim(),p=parseFloat($('#pp').value);if(!n||!p)return toast('Preencha nome e preço');S.prods.push({id:++S.pid,nome:n,cat:$('#pc').value.trim()||'Geral',preco:p});render()}
function delP(id){const used=[...Object.values(S.mesas),...Object.values(S.cmds)].some(o=>o.items.some(i=>i.id==id));if(used)return toast('Produto em uso em um atendimento aberto');S.prods=S.prods.filter(p=>p.id!=id);render()}
function loadEx(){SEG[S.seg].prods.forEach(p=>S.prods.push({id:++S.pid,nome:p[0],cat:p[1],preco:p[2]}));render()}
function addCli(){const n=$('#kn').value.trim();if(!n)return toast('Informe o nome');S.clientes.push({nome:n,tel:$('#kt').value||'—'});render()}
function vFin(){
 const rec=sum(x=>x.cat=='Vendas'),des=sum(x=>x.tipo=='out'&&x.cat!='Sangria');
 const fm=['Pix','Cartão','Dinheiro','Vale'].map(f=>[f,sum(x=>x.cat=='Vendas'&&x.forma==f)]),mx=Math.max(1,...fm.map(x=>x[1]));
 return head('Financeiro')+kp([['Receitas',R(rec)],['Despesas',R(des)],['Resultado',R(rec-des)]])+
 `<div class="pos" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><h3>Vendas por forma de pagamento</h3>${fm.map(([f,v])=>`<div style="margin-bottom:10px"><div class="row"><span>${f}</span><b>${R(v)}</b></div><div class="bar" style="width:${v/mx*100}%"></div></div>`).join('')}</div>
 <div class="card"><h3>Lançar despesa</h3><div class="frm"><input id="fd" placeholder="Descrição"><input id="fv" type="number" step="0.01" placeholder="Valor"><select id="fc2"><option>Insumos</option><option>Pessoal</option><option>Aluguel</option><option>Contas</option><option>Outros</option></select><button class="btn p" onclick="addDes()">Lançar</button></div></div></div>
 <div class="card" style="margin-top:14px"><h3>Lançamentos</h3>${tbl(S.mov.slice().reverse())}</div>`
}
function addDes(){const v=parseFloat($('#fv').value);if(!v)return toast('Informe o valor');S.mov.push({t:hm(),desc:$('#fd').value||'Despesa',tipo:'out',val:v,forma:'Banco',cat:$('#fc2').value});render()}
function render(){
 nav();
 $('#main').innerHTML=({mesas:vSalao,pos:vPos,caixa:vCaixa,cad:vCad,fin:vFin})[view]()+(pay&&cur?vPay():'');
}
render();
</script>
</body>
</html>
