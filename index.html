.jcc{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.jcc span{background:var(--jb);color:var(--jc);border:1.5px solid var(--jc);border-radius:10px;padding:8px 12px;font-weight:700}
.jcc i{font-style:normal;color:var(--mu);font-weight:700}
.jm p{color:var(--mu);margin:0}

<style>
/* A faixa só é mostrada na prévia offline do arquivo baixado. */
.local-preview-banner{display:none;margin:0 0 12px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--mu);font-size:12px}
.local-preview-banner strong{color:var(--pr)}
</style>
<style>
/* ===== Cozinha (KDS) e avisos no salão ===== */
nav button{position:relative}
.nb{margin-left:auto;background:var(--ok);color:#04201c;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;line-height:1.5}
.kbtn{position:relative}
.kbtn .nb{position:absolute;top:-7px;right:-7px;margin:0;--pc:var(--ok);animation:pk 1.4s infinite}
@media (max-width:760px){nav .nb{position:absolute;top:0;right:14%;margin:0}}
@keyframes pk{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pc) 55%,transparent)}70%{box-shadow:0 0 0 14px color-mix(in srgb,var(--pc) 0%,transparent)}100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pc) 0%,transparent)}}
.s-n{--pc:var(--jc);--pb:var(--jb)}
.s-p{--pc:var(--wa);--pb:var(--wab)}
.s-r{--pc:var(--ok);--pb:var(--okb)}
.s-l{--pc:var(--ba);--pb:var(--bab)}
.s-d{--pc:var(--bd);--pb:transparent}
/* selos de status nas mesas e comandas */
.kst-w{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.kst{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--pc);color:var(--tc);white-space:nowrap}
.kst.s-d{color:var(--mu)}
.kst svg{width:12px;height:12px;stroke-width:3}
.mesa.rd{border-color:var(--ok);--pc:var(--ok);animation:pk 1.2s infinite}
.mesa.rd.ghost{animation:none}
.mesa .ent{position:absolute;top:8px;right:10px;padding:6px 12px;font-size:12px;background:var(--ok);border-color:var(--ok);color:var(--tc)}
/* andamento do pedido dentro da comanda */
.kp{margin-top:12px;border-top:1px solid var(--bd);padding-top:10px}
.kp h3{margin:0 0 8px}
.kp-r{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--pc);background:var(--pb);margin-bottom:6px}
.kp-r>div{flex:1;min-width:0}
.kp-r small{display:block;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* tela da cozinha */
body.kds nav{display:none}
body.kds main{padding:0}
/* ===== Login e cadastro (painel deslizante) ===== */
.auth-page{position:fixed;inset:0;z-index:80;overflow:auto;display:grid;place-items:center;padding:clamp(12px,3vw,34px);color:#172b3a;color-scheme:light;font-family:inherit;background:radial-gradient(ellipse at 12% 12%,rgba(20,184,166,.18),transparent 45%),radial-gradient(ellipse at 92% 100%,rgba(15,118,110,.12),transparent 50%),#f1f5f7}
.auth-shell{width:min(1080px,100%);min-height:min(690px,calc(100vh - 60px));display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid #e3e9ec;border-radius:24px;overflow:hidden;box-shadow:0 24px 80px rgba(11,18,32,.18);position:relative}
.auth-info{grid-column:1;grid-row:1;position:relative;overflow:hidden;background:linear-gradient(145deg,#0b1220 0%,#0c3b3d 55%,#0f766e 120%);color:#fff;padding:clamp(28px,4vw,54px);display:flex;min-width:0;transform:translateX(0);transition:transform .82s cubic-bezier(.22,1,.36,1);will-change:transform;z-index:2}
.auth-info-inner{position:relative;z-index:2;display:flex;flex-direction:column;width:100%}
.auth-logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;letter-spacing:-.02em}
.auth-logo span{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#14b8a6,#0f766e);color:#fff;font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:900;box-shadow:0 8px 22px rgba(20,184,166,.35)}
.auth-info-copy{margin:auto 0;padding:42px 0;max-width:420px}
.auth-kicker{font-size:10.5px;letter-spacing:.16em;font-weight:850;color:#2dd4bf;text-transform:uppercase}
.auth-info h1{font-size:clamp(30px,3.4vw,43px);line-height:1.08;letter-spacing:-.04em;margin:14px 0 16px;min-width:0;color:#fff}
.auth-info p{font-size:15px;line-height:1.7;color:rgba(255,255,255,.78);max-width:390px;margin:0}
.auth-benefits{display:grid;gap:14px;margin-top:28px}
.auth-benefits>div{display:flex;align-items:center;gap:11px;color:rgba(255,255,255,.92);font-size:13.5px}
.auth-benefits i{font-style:normal;width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:50%;background:rgba(45,212,191,.16);border:1px solid rgba(45,212,191,.3);color:#5eead4;font-weight:900;font-size:12px}
.auth-foot{font-size:11px;color:rgba(255,255,255,.55);margin-top:auto}.auth-foot span{padding:0 5px}
.auth-orb{position:absolute;border:1px solid rgba(255,255,255,.12);border-radius:50%;pointer-events:none}
.auth-orb.one{width:380px;height:380px;right:-190px;top:-170px;box-shadow:0 0 0 38px rgba(255,255,255,.035),0 0 0 78px rgba(255,255,255,.025)}
.auth-orb.two{width:250px;height:250px;right:-115px;bottom:-145px;background:rgba(45,212,191,.07)}
.auth-form-wrap{grid-column:2;grid-row:1;display:grid;place-items:center;padding:clamp(24px,5vw,62px);min-width:0;background:#fff;transform:translateX(0);transition:transform .82s cubic-bezier(.22,1,.36,1);will-change:transform;z-index:1}
.auth-form{width:min(100%,370px)}
.auth-form-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.auth-form .auth-kicker{color:#0f766e}
.auth-secure{font-size:10.5px;color:#16845b;font-weight:700}
.auth-form h2{font-size:30px;letter-spacing:-.04em;margin:20px 0 5px;color:#0b1220}
.auth-sub{font-size:13.5px;color:#64748b;margin:0 0 24px}
.auth-label{display:block;font-size:12px;font-weight:750;margin:14px 0 6px;color:#1e293b}
.auth-input{display:block;box-sizing:border-box;width:100%;min-height:48px;padding:12px 14px;border:1px solid #dfe7ec;border-radius:10px;background:#f4f7f8;color:#172b3a;font:inherit;font-size:14px;transition:border .2s,box-shadow .2s,background .2s}
.auth-input::placeholder{color:#94a3b8}
.auth-input:focus{outline:0;background:#fff;border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.16)}
.auth-message{min-height:22px;margin:10px 0 4px;font-size:12.5px;color:#b91c1c;line-height:1.5}
.auth-message.success{color:#16845b}
.auth-submit{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;border:0;border-radius:10px;background:linear-gradient(135deg,#14b8a6,#0f766e);color:#fff;font:inherit;font-size:14.5px;font-weight:800;cursor:pointer;box-shadow:0 10px 22px rgba(15,118,110,.3);transition:transform .2s,filter .2s}
.auth-submit:hover{filter:brightness(1.06);transform:translateY(-1px)}
.auth-submit:disabled{opacity:.65;cursor:wait;transform:none}
.auth-submit span{font-size:20px}
.auth-switch{text-align:center;font-size:12.5px;color:#64748b;margin-top:22px}
.auth-switch button{border:0;background:none;color:#0f766e;font:inherit;font-weight:850;cursor:pointer;padding:4px}
.auth-switch button:hover{text-decoration:underline}
.auth-shell.is-signup .auth-info{transform:translateX(100%)}
.auth-shell.is-signup .auth-form-wrap{transform:translateX(-100%)}
.auth-anim{animation:authIn .55s ease both}
.auth-anim.fr{animation-name:authInRight}
.auth-anim.fl{animation-name:authInLeft}
@keyframes authIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes authInRight{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes authInLeft{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@media(max-width:760px){
 .auth-page{padding:0;display:block;background:#fff}
 .auth-shell,.auth-shell.is-signup{min-height:100dvh;border:0;border-radius:0;box-shadow:none;display:flex;flex-direction:column}
 .auth-info{min-height:210px;padding:22px 24px 24px;transform:none!important;transition:none}
 .auth-info-copy{padding:24px 0 8px;margin:0}
 .auth-info h1{font-size:26px;margin:9px 0}
 .auth-info p{font-size:12.5px}
 .auth-benefits,.auth-foot{display:none}
 .auth-form-wrap{padding:26px 24px 40px;transform:none!important;transition:none}
 .auth-form h2{font-size:26px;margin-top:14px}
}
@media (prefers-reduced-motion:reduce){.auth-info,.auth-form-wrap{transition:none}.auth-anim{animation:none}}

.auth-shell{background:#000;border:1px solid rgba(255,255,255,.09);box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(20,184,166,.08),0 0 80px -20px rgba(20,184,166,.35)}
.auth-info{background:linear-gradient(145deg,rgba(11,18,32,.94) 0%,rgba(12,59,61,.90) 58%,rgba(15,118,110,.88) 125%)}
.auth-form-wrap{background:linear-gradient(160deg,#2b3036 0%,#171b1f 42%,#000 100%)}
.auth-form .auth-kicker{color:#2dd4bf}
.auth-secure{color:#4ade80}
.auth-form h2{color:#fff}
.auth-sub{color:#9aa7b4}
.auth-label{color:#e2e8f0}
.auth-input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);color:#fff}
.auth-input::placeholder{color:#6f7c89}
.auth-input:focus{background:rgba(255,255,255,.09);border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.22)}
.auth-input:-webkit-autofill,.auth-input:-webkit-autofill:focus{-webkit-text-fill-color:#fff;caret-color:#fff;-webkit-box-shadow:0 0 0 1000px #1c2126 inset;border-color:rgba(255,255,255,.13)}
.auth-message{color:#fca5a5}
.auth-message.success{color:#4ade80}
.auth-submit{box-shadow:0 10px 26px rgba(20,184,166,.28)}
.auth-switch{color:#9aa7b4}
.auth-switch button{color:#2dd4bf}
@media (min-width:1100px){.auth-shell{width:min(1000px,100%)}}
@media(max-width:760px){
 .auth-page{background:#000}
 .auth-info{background:linear-gradient(180deg,rgba(2,10,28,.55),rgba(2,10,28,.88)),var(--auth-img) 80% center/cover no-repeat}
 .auth-form-wrap{background:linear-gradient(180deg,#23282d 0%,#0b0d0f 55%,#000 100%)}
}

/* ===== Menu do botão direito (mesas e comandas) ===== */
.ctx{position:fixed;z-index:70;min-width:230px;max-width:300px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:6px;box-shadow:0 14px 44px rgba(0,0,0,.30),0 2px 8px rgba(0,0,0,.12);font-size:14px;animation:ctxin .12s ease}
@keyframes ctxin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.ctx-h{padding:8px 10px 6px;line-height:1.25}
.ctx-h b{display:block;font-size:14px}
.ctx-h small{color:var(--mu);font-size:12px}
.ctx-sep{height:1px;background:var(--bd);margin:5px 4px}
.ctx-w{position:relative}
.ctx-i{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;cursor:pointer;line-height:1.2;font-size:14px;color:var(--tx)}
.ctx-i svg{width:17px;height:17px;flex:none;color:var(--mu)}
.ctx-i .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx-i .r{color:var(--mu);font-size:12px;display:flex;align-items:center}
.ctx-i .r svg{width:15px;height:15px}
.ctx-i:hover,.ctx-i:focus-visible,.ctx-w.open>.ctx-i{background:color-mix(in srgb,var(--pr) 13%,var(--sf))}
.ctx-i.danger,.ctx-i.danger svg{color:var(--ba)}
.ctx-i.dis{opacity:.4;cursor:default;pointer-events:none}
.ctx-sub{position:absolute;left:calc(100% + 2px);top:-7px;display:none;max-height:min(320px,70vh);overflow:auto;min-width:200px}
.ctx-sub::before{content:"";position:absolute;left:-8px;top:0;bottom:0;width:8px}
.ctx-sub.flip{left:auto;right:calc(100% + 2px)}
.ctx-sub.flip::before{left:auto;right:-8px}
.ctx-w.open>.ctx-sub{display:block}
.ctxm{max-width:380px;padding:22px;border-radius:18px;animation:up .2s ease}
.ctxm h3{margin:0 0 6px;font-size:19px}
.ctxm p{margin:0;color:var(--mu);font-size:14px;line-height:1.5}
.ctxin{width:100%;margin-top:14px}
.btn.ctxd{background:var(--ba);border-color:var(--ba);color:#fff}

<script>

const SB={url:'https://vgivsogjhduyxqyibbxj.supabase.co',key:'sb_publishable_hZDgAKKicAV8vBjFn2UT4A_4mjr5Ge3',sdk:'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js',login:'index.html'};

const nfceFalta=()=>{const c=cfgGet(),e=c.empresa,f=c.fiscal,l=[];if(f.emissao!='sim')return['ligar a NFC-e em Configurações › Fiscal'];if(!cnpjOk(String(e.cnpj||'').replace(/\D/g,'')))l.push('CNPJ');if(!e.ie)l.push('Inscrição Estadual');if(!e.cscId||!e.cscToken)l.push('CSC');return l};

 const o=(id,k,t,sg,sub,dis)=>`<button class="pm-o dc ${sel==id?'on':''} ${dis?'off':''}" onclick="docSel('${id}')" ${dis?'aria-disabled="true"':''}><span class="ib">${sv(id=='nfce'?'rec':'ok',22)}</span><span class="dc-t"><b>${t}</b><small>${sg}</small><small>${sub}</small></span><span class="k">${k}</span><span class="ck">${sv('ok',11)}</span></button>`;
 return `<div class="mod" onclick="docAsk=null;render()"><div class="card pm" onclick="event.stopPropagation()" role="dialog" aria-label="Documento da venda">
 <div class="pm-h"><span class="bd">${sv('rec',22)}</span><div><h3>Documento da venda</h3><small>Escolha o que será emitido para esta venda</small></div><button class="pm-x" onclick="docAsk=null;render()" aria-label="Fechar">${sv('x',18)}</button></div>
 <div class="pm-sec">Tipo de documento</div>
 <div class="dc-list">${o('nfce','1','NFC-e','Nota Fiscal de Consumidor Eletrônica',ok?'Documento fiscal'+(cp?' · CPF na nota: '+cp:''):'Indisponível: falta '+fl.join(', '),!ok)}${o('comprovante','2','Comprovante de Venda','Documento sem valor fiscal','Registra a venda e baixa a mesa',false)}</div>
 <div class="pm-f"><button class="btn" onclick="docAsk=null;render()">Voltar</button><button class="btn p" onclick="docGo()">${sv('ok',18)}Confirmar · ${docLbl(sel)}</button></div></div></div>`}
const once=fn=>async(...a)=>{if(once.b)return;once.b=1;try{return await fn(...a)}finally{once.b=0}};
async function DBX(p){const {data,error}=await p;if(error)throw error;return data}

const cfg=patch=>DBX(sb.from('empresas').update(patch).eq('id',S.empId)).catch(dbErr);
const loadSdk=()=>new Promise((ok,no)=>{if(window.supabase)return ok();const t=document.createElement('script');t.src=SB.sdk;t.onload=ok;t.onerror=()=>no(new Error('Não foi possível carregar o Supabase'));document.head.appendChild(t)});
const dataHora=d=>{const x=new Date(d),h=x.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});return x.toDateString()==new Date().toDateString()?h:x.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+h};

const mP=r=>({id:r.id,nome:r.nome,cat:r.categoria,preco:+r.preco,cod:r.codigo,est:r.estoque});

const mM=r=>({id:r.id,t:dataHora(r.criado_em),at:r.criado_em,desc:r.descricao,tipo:r.tipo,val:+r.valor,forma:r.forma,cat:r.categoria,cpf:r.cpf,cid:r.cliente_id,gid:r.garcom_id,doc:r.documento||''});
const addMov=async m=>{const row={descricao:m.desc,tipo:m.tipo,valor:m.val,forma:m.forma,categoria:m.cat,cpf:m.cpf||'',cliente_id:m.cid||null,garcom_id:m.gid||null};
 if(m.doc){try{const r=await DBX(sb.from('movimentos').insert({...row,documento:m.doc}).select().single());docCol=true;return mM(r)}
  catch(e){if(!/documento|column|schema/i.test(String(e&&(e.message||e.details||''))))throw e;docCol=false;row.descricao+=' · '+docLbl(m.doc)}}
 return mM(await DBX(sb.from('movimentos').insert(row).select().single()))};
async function carregar(){
 const desde=new Date(Date.now()-90*864e5).toISOString();
 const [emp,pr,cl,ga,mv]=await Promise.all([
  DBX(sb.from('empresas').select('*').limit(1).maybeSingle()),
  DBX(sb.from('produtos').select('*').order('nome')),
  DBX(sb.from('clientes').select('*').order('nome')),
  DBX(sb.from('garcons').select('*').order('nome')),
  DBX(sb.from('movimentos').select('*').gte('criado_em',desde).order('criado_em',{ascending:false}).limit(1000))
 ]);
 if(!emp)throw new Error('Usuário sem empresa vinculada');
 S.empId=emp.id;S.seg=SEG[emp.segmento]?emp.segmento:'rest';S.taxa=emp.taxa_servico;S.nm=emp.qtd_mesas;
 S.mesas={};for(let i=1;i<=S.nm;i++)S.mesas[i]=mk();
 S.prods=pr.map(mP);S.clientes=cl.map(mC);S.garcons=ga.map(mG);S.mov=mv.reverse().map(mM);
}

/* ===== Mesas, comandas e carrinho em aberto: guardados no Supabase + cópia no navegador ===== */
let estUlt='',estTimer=null,estAt=0;
const estKey=()=>'pdvfacil.estado.'+S.empId;
const estSnap=()=>({mesas:S.mesas,cmds:S.cmds,cn:S.cn,cart:S.cart,dsc:S.dsc,dt:S.dt,acomp:S.acomp,aid:S.aid});
function estApply(d){
 const itens=it=>(Array.isArray(it)?it:[]).filter(i=>S.prods.some(p=>p.id==i.id)&&i.q>0);
 const mesas={};
 for(let i=1;i<=S.nm;i++){const sv=d.mesas&&d.mesas[i];mesas[i]=sv?Object.assign(mk(),sv,{items:itens(sv.items)}):mk()}
 S.mesas=mesas;S.cmds={};
 Object.keys(d.cmds||{}).forEach(k=>{const c=d.cmds[k];S.cmds[k]=Object.assign({items:[],aberta:true,inv:false,hora:'',nome:'',cpf:'',g:null},c,{items:itens(c.items)})});
 S.cn=Math.max(+d.cn||0,0,...Object.keys(S.cmds).map(Number));
 S.cart={items:itens(d.cart&&d.cart.items)};S.dsc=+d.dsc||0;S.dt=d.dt=='R'?'R':'%';
 if(Array.isArray(d.acomp)){S.acomp=d.acomp.filter(a=>a&&a.nome).map(a=>({id:+a.id||0,nome:String(a.nome)}));S.aid=Math.max(+d.aid||0,0,...S.acomp.map(a=>a.id))}
}
async function carregarEstado(){
 let remoto=null,local=null;
 try{const r=await DBX(sb.from('estado_pdv').select('dados').maybeSingle());remoto=r&&r.dados}catch(e){console.warn('estado_pdv:',e)}
 try{local=JSON.parse(localStorage.getItem(estKey())||'null')}catch(e){}
 const d=[remoto,local].filter(x=>x&&x.snap).sort((a,b)=>(b.at||0)-(a.at||0))[0];
 if(d){try{estApply(d.snap);estAt=d.at||0}catch(e){console.warn('estado ignorado:',e)}}
 estUlt=JSON.stringify(estSnap());
 if(d&&d===local&&(!remoto||(remoto.at||0)<(local.at||0)))estPush();
}
let _esT=0;
function estSalvarLazy(){if(_esT)return;_esT=setTimeout(()=>{_esT=0;const f=()=>estSalvar();window.requestIdleCallback?requestIdleCallback(f,{timeout:800}):f()},250)}
function estFlush(){if(_esT){clearTimeout(_esT);_esT=0}estSalvar()}
addEventListener('pagehide',()=>estFlush());
document.addEventListener('visibilitychange',()=>{if(document.hidden)estFlush()});
function estSalvar(){
 if(!S.empId)return;
 const j=JSON.stringify(estSnap());if(j==estUlt)return;
 estUlt=j;estAt=Date.now();
 try{localStorage.setItem(estKey(),'{"at":'+estAt+',"snap":'+j+'}')}catch(e){}
 clearTimeout(estTimer);estTimer=setTimeout(estPush,600);
}
async function estPush(){
 estTimer=null;
 try{await DBX(sb.from('estado_pdv').upsert({empresa_id:S.empId,dados:{at:estAt,snap:estSnap()},atualizado_em:new Date().toISOString()},{onConflict:'empresa_id'}))}
 catch(e){console.warn('estado_pdv:',e);if(!estPush.w){estPush.w=1;toast('Mesas salvas só neste computador. Falta rodar o SQL do estado.')}}
}

/* ===== Configurações · certificado digital A1 ===== */

const FORGE='https://cdn.jsdelivr.net/npm/node-forge@1.3.1/dist/forge.min.js';
const loadForge=()=>new Promise((ok,no)=>{if(window.forge)return ok();const t=document.createElement('script');t.src=FORGE;t.onload=ok;t.onerror=()=>no(new Error('Não foi possível carregar o leitor de certificados'));document.head.appendChild(t)});
async function carregarCert(){
 try{const r=await DBX(sb.from('certificados_info').select('*').maybeSingle());certOk=true;
  cert=r?{titular:r.titular,cnpj:r.cnpj,emissor:r.emissor,de:new Date(r.valido_de),ate:new Date(r.valido_ate),nome:r.arquivo_nome}:null}
 catch(e){cert=null;certOk=false;console.warn('certificados_info:',e)}
}
async function lerPfx(file,senha){
 await loadForge();
 const buf=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('Não foi possível ler o arquivo'));r.readAsArrayBuffer(file)});
 const u=new Uint8Array(buf);let bin='';for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
 const O=forge.pki.oids;let p12;
 try{p12=forge.pkcs12.pkcs12FromAsn1(forge.asn1.fromDer(bin),false,senha)}

 const bags=t=>p12.getBags({bagType:t})[t]||[];
 const certs=bags(O.certBag).map(b=>b.cert).filter(Boolean),keys=[...bags(O.pkcs8ShroudedKeyBag),...bags(O.keyBag)].map(b=>b.key).filter(Boolean);
 if(!certs.length)throw new Error('O arquivo não contém nenhum certificado.');
 if(!keys.length)throw new Error('O arquivo não tem a chave privada. Exporte de novo marcando "Sim, exportar a chave privada".');
 const par=c=>keys.some(k=>{try{return k.n&&c.publicKey.n&&k.n.compareTo(c.publicKey.n)==0}catch(e){return false}});
 const c=certs.find(par)||certs[0];
 const cn=(c.subject.getField('CN')||{}).value||'',m=cn.match(/(\d{14})/);
 const sha=forge.md.sha1.create();sha.update(forge.asn1.toDer(forge.pki.certificateToAsn1(c)).getBytes());
 return{titular:cn.replace(/:?\d{14}$/,'').trim()||cn||'(sem nome)',cnpj:m?m[1]:null,emissor:(c.issuer.getField('CN')||c.issuer.getField('O')||{}).value||'',de:c.validity.notBefore,ate:c.validity.notAfter,impressao:sha.digest().toHex(),pfx64:btoa(bin),nome:file.name};
}

function cnpjOk(c){if(c.length!=14||/^(\d)\1+$/.test(c))return false;const f=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return f(12)==+c[12]&&f(13)==+c[13]}

async function authSubmit(ev){
 ev.preventDefault();
 const su=authMode=='signup',b=$('#lgb'),m=$('#lgm'),email=$('#lge').value.trim(),senha=$('#lgs').value,nome=su?$('#lgn').value.trim():'';
 m.className='auth-message';m.textContent='';
 if(su&&!nome){m.textContent='Informe o seu nome.';return}
 if(!email||!senha){m.textContent='Informe o e-mail e a senha.';return}
 if(su){if(senha.length<6){m.textContent='A senha precisa ter pelo menos 6 caracteres.';return}
  if(senha!==$('#lgc').value){m.textContent='As senhas não são iguais.';return}}
 if(!sb){m.textContent='Sem conexão com o servidor. Verifique sua internet e tente novamente.';return}
 b.disabled=true;b.innerHTML=su?'Criando conta…':'Entrando…';
 try{
  if(su){const {data,error}=await sb.auth.signUp({email,password:senha,options:{data:{name:nome}}});if(error)throw error;
   if(data&&data.session){location.reload();return}
   b.disabled=false;b.innerHTML=authBtn();m.className='auth-message success';m.textContent='Conta criada! Enviamos um e-mail de confirmação. Confirme-o para entrar.';return}
  const {error}=await sb.auth.signInWithPassword({email,password:senha});if(error)throw error;location.reload()
 }catch(err){
  b.disabled=false;b.innerHTML=authBtn();const t=(err&&err.message)||String(err);
  m.textContent=/invalid login/i.test(t)?'E-mail ou senha incorretos.':/not confirmed/i.test(t)?'Confirme o e-mail antes de entrar.':/already|registered/i.test(t)?'Este e-mail já possui uma conta. Faça login.':/password/i.test(t)&&su?'Senha muito fraca. Use pelo menos 6 caracteres.':'Não foi possível concluir: '+t}}

const INTRO={el:document.getElementById('intro'),t0:performance.now(),done:false,hi:false,red:matchMedia('(prefers-reduced-motion:reduce)').matches};
setTimeout(()=>introEnd(true),15000);
function introStep(p,txt){const e=INTRO.el;if(!e)return;const b=e.querySelector('.in-bar i'),s=e.querySelector('.in-st');if(b)b.style.transform='scaleX('+p+')';if(s&&txt)s.textContent=txt}
function introHi(u){
 const e=INTRO.el;if(!e||INTRO.hi)return;INTRO.hi=true;
 const md=(u&&u.user_metadata)||{};
 let n=String(md.name||md.full_name||((u&&u.email)||'').split('@')[0]||'').trim().split(/[\s._\-+0-9]+/)[0];
 n=n?n[0].toUpperCase()+n.slice(1).toLowerCase():'';
 const h=new Date().getHours(),sd=(h<5||h>=18)?'Boa noite':h<12?'Bom dia':'Boa tarde';
 const el=e.querySelector('.in-hi');el.textContent=n?sd+', '+n:sd;
 const w=(e.classList.contains('quick')||INTRO.red)?0:Math.max(0,1150-(performance.now()-INTRO.t0));
 setTimeout(()=>el.classList.add('on'),w)}
function introEnd(fast){
 const e=INTRO.el;if(!e||INTRO.done)return;INTRO.done=true;
 if(fast){e.classList.add('fade');setTimeout(()=>e.remove(),420);return}
 introStep(1,'Tudo pronto');
 const min=INTRO.red?500:e.classList.contains('quick')?700:2400;
 setTimeout(()=>{
  try{sessionStorage.setItem('pdv.intro','1')}catch(x){}
  document.body.classList.add('enter');e.classList.add('out');
  setTimeout(()=>{e.remove();document.body.classList.remove('enter')},1400)
 },Math.max(0,min-(performance.now()-INTRO.t0)))}
async function boot(){
 // Prévia local: permite conferir as telas de Configurações ao abrir o HTML baixado, sem exigir login/Supabase.
 if(location.protocol==='file:'&&location.hash=='#login'){telaLogin();introEnd(true);return}
 if(location.protocol==='file:'){
  USER='Prévia local';
  view=location.hash=='#cozinha'?'coz':'cfg';kIniciar();
  document.title='PDV Fácil · Prévia das Configurações';
  const banner=document.getElementById('localPreviewBanner');
  if(banner)banner.style.display='block';
  render();introEnd(true);
  return;
 }
 $('#main').innerHTML='<div class="card emp">Carregando…</div>';
 try{
  await loadSdk();
  sb=window.supabase.createClient(SB.url,SB.key);
  const {data}=await sb.auth.getSession();
  if(!data.session){if(new URL(SB.login,location.href).pathname!==location.pathname)location.replace(SB.login);else{telaLogin();introEnd(true)}return}
  try{const {data:gu,error:ge}=await sb.auth.getUser();
   if((ge&&(ge.status===401||ge.status===403||ge.status===404||/does not exist|jwt|session/i.test(ge.message||'')))||(!ge&&gu&&!gu.user)){
    try{await sb.auth.signOut({scope:'local'})}catch(e){}
    irLogin();return}}catch(e){}
  USER=data.session.user.email||'';
  introHi(data.session.user);introStep(.3,'Carregando produtos e clientes…');
  sb.auth.onAuthStateChange(ev=>{if(ev=='SIGNED_OUT')irLogin()});
  await carregar();introStep(.6,'Preparando mesas e comandas…');
  await carregarConfig();
  await carregarEstado();introStep(.85,'Ajustando as configurações…');
  await carregarCert();
  applyAppearance();kIniciar();
 }catch(e){
  introEnd(true);
  $('#main').innerHTML='<div class="card emp">Não foi possível carregar os dados.<br><small>'+esc((e&&e.message)||e)+'</small><br><br><button class="btn p" onclick="location.reload()">Tentar de novo</button></div>';
  return;
 }
  if(location.hash=='#cozinha')view='coz';
 render();introEnd();
}

const KSQL=`-- Cozinha: pedidos compartilhados entre o salão e a tela da cozinha
do $$
declare t text;
begin
  select format_type(a.atttypid, a.atttypmod) into t
  from pg_attribute a
  where a.attrelid = 'public.empresas'::regclass and a.attname = 'id';
  execute format(
    'create table if not exists public.cozinha_pedidos (
       id text primary key,
       empresa_id %s not null references public.empresas(id) on delete cascade,
       dados jsonb not null,
       status text not null default ''novo'',
       atualizado_em timestamptz not null default now())', t);
end $$;

create index if not exists cozinha_pedidos_emp_idx
  on public.cozinha_pedidos (empresa_id, atualizado_em desc);

alter table public.cozinha_pedidos enable row level security;
drop policy if exists cozinha_pedidos_empresa on public.cozinha_pedidos;
create policy cozinha_pedidos_empresa on public.cozinha_pedidos
  for all to authenticated
  using (empresa_id in (select id from public.empresas))
  with check (empresa_id in (select id from public.empresas));
grant select, insert, update, delete on public.cozinha_pedidos to authenticated;
notify pgrst, 'reload schema';`;

 const n=L.filter(t=>t.st=='novo'),p=L.filter(t=>t.st=='prep'),d=L.filter(t=>t.st=='pronto');
 let h='';
 if(d.length)h+=`<span class="kst s-r">${sv('ok',12)}${d.length>1?d.length+' pedidos prontos':'Pedido pronto'} · retirar</span>`;
 if(p.length){const s=Math.min(...p.map(t=>t.t1||t.t0));h+=`<span class="kst s-p">${sv('flame',12)}Em preparo · <span data-since="${s}">${kMin(Date.now()-s)}</span></span>`}
 if(n.length)h+=`<span class="kst s-n">Na fila da cozinha</span>`;
 return `<div class="kst-w">${h}</div>`+(d.length?`<button class="btn ent" onclick="event.stopPropagation();kEntrega('${k}',${+r})">Entregue</button>`:'')}
function kStrip(){
 if(!cur)return'';
 const L=S.coz.filter(t=>t.k==cur.k&&+t.r==+cur.id&&!t.arq&&t.st!='cancelado').sort((a,b)=>a.t0-b.t0);if(!L.length)return'';
 const nm={novo:['s-n','Na fila'],prep:['s-p','Em preparo'],pronto:['s-r','Pronto'],entregue:['s-d','Entregue']};
 return `<div class="kp"><h3>Cozinha</h3>${L.map(t=>{const s=nm[t.st]||nm.novo;return `<div class="kp-r ${s[0]}"><div><b>${t.ad?'Adicional':'Pedido'} · ${kHm(t.t0)}</b><small>${t.it.map(i=>i.q+'× '+esc(i.n)+(([i.o,i.obs,i.observacao,i.comentario,i.observacao_cozinha,i.nota].find(v=>String(v??'').trim()))?' ('+esc([i.o,i.obs,i.observacao,i.comentario,i.observacao_cozinha,i.nota].find(v=>String(v??'').trim()))+')':'')).join(', ')}</small></div><span class="kst ${s[0]}">${s[1]}</span>${t.st=='pronto'?`<button class="btn" onclick="kEntrega('${cur.k}',${+cur.id})">Entregue</button>`:''}</div>`}).join('')}</div>`}

/* --- tela da cozinha --- */
function kCard(t){
 const n=t.it.reduce((a,i)=>a+i.q,0),cx=t.st=='cancelado',cls=kCls(t);
 const tag=cx?'Cancelado':kLate(t)?'Atrasado':({novo:'Novo',prep:'Em preparo',pronto:'Pronto'}[t.st]||'');
 const bt={novo:['Iniciar preparo','var(--wa)','flame'],prep:['Marcar pronto','var(--ok)','ok'],pronto:['Entregue ao garçom','var(--tx)','ok']}[t.st]||['Ok','var(--tx)','ok'];
 const li=t.it.map((i,x)=>{
  const observacao=String([i.o,i.obs,i.observacao,i.comentario,i.observacao_cozinha,i.nota].find(v=>String(v??'').trim())??'').trim();
  const mk=t.st=='prep'?`<button class="kt-ck ${i.ok?'on':''}" onclick="kItem('${t.id}',${x})" aria-pressed="${!!i.ok}" aria-label="Marcar ${esc(i.n)} como feito">${sv('ok',18)}</button>`:`<span class="kt-dot"><i></i></span>`;
  return `<li class="${i.ok&&t.st=='prep'?'ok':''}">${mk}<b>${i.q}×</b><div class="kt-n"><span class="kt-nm">${esc(i.n)}</span>${observacao?`<em class="kt-o">⚠ ${esc(observacao)}</em>`:''}</div></li>`}).join('');
 const f=cx?`<button class="btn kt-b" style="--bc:var(--ba)" onclick="kCiente('${t.id}')">${sv('ok',20)}Ciente, não preparar</button>`
  :`<button class="btn kt-b" style="--bc:${bt[1]}" onclick="kAv('${t.id}')">${sv(bt[2],20)}${bt[0]}</button>${t.st!='novo'?`<button class="btn kt-u" onclick="kVolta('${t.id}')" aria-label="Voltar uma etapa" title="Voltar uma etapa">${sv('back',20)}</button>`:''}`;
 const meta=cx?'A mesa foi liberada. Pode descartar o pedido.':`${t.g?'Garçom '+esc(t.g)+' · ':''}enviado às ${kHm(t.t0)} · ${n} ${n==1?'item':'itens'}${t.st=='pronto'?' · esperando retirada':''}${t.ad?' <span class="kt-ad">Adicional</span>':''}`;
 return `<article class="kt ${cls}" data-id="${t.id}"><div class="kt-h"><b class="kt-t">${esc(t.lb)}</b><span class="tag">${tag}</span>${cx?'':`<span class="kt-tm ${kWarn(t)&&!kLate(t)?'w':''}">${kClock(kAge(t))}</span>`}</div><div class="kt-m">${meta}</div><ul class="kt-i">${li}</ul><div class="kt-f">${f}</div></article>`}
function vCoz(){
 const hoje=ms=>new Date(ms).toDateString()==new Date().toDateString();
 const nv=S.coz.filter(t=>t.st=='novo'||(t.st=='cancelado'&&!t.ack)).sort((a,b)=>a.t0-b.t0),
  pp=S.coz.filter(t=>t.st=='prep').sort((a,b)=>a.t0-b.t0),
  pr=S.coz.filter(t=>t.st=='pronto').sort((a,b)=>a.t2-b.t2),
  en=S.coz.filter(t=>t.st=='entregue'&&hoje(t.t3||t.u)).sort((a,b)=>(b.t3||b.u)-(a.t3||a.u)).slice(0,40),
  fe=S.coz.filter(t=>(t.st=='pronto'||t.st=='entregue')&&t.t2&&hoje(t.t2)),
  med=fe.length?fe.reduce((a,t)=>a+(t.t2-t.t0),0)/fe.length:0,
  nn=nv.filter(t=>t.st=='novo').length;
 const col=(c,h,l,v)=>`<section class="kcol ${c}" aria-label="${h}"><h2 class="kcol-h"><span class="kcol-dot"></span>${h}<b>${l.length}</b></h2><div class="kcol-b">${l.length?l.map(kCard).join(''):`<div class="emp card" style="grid-column:1/-1">${v}</div>`}</div></section>`;
 const all=kFil=='todos';
 const body=kFil=='entregue'
  ?`<div class="khis">${en.length?en.map(t=>`<div class="khr"><div><b>${esc(t.lb)}</b><small>${t.it.map(i=>i.q+'× '+esc(i.n)+(([i.o,i.obs,i.observacao,i.comentario,i.observacao_cozinha,i.nota].find(v=>String(v??'').trim()))?' ('+esc([i.o,i.obs,i.observacao,i.comentario,i.observacao_cozinha,i.nota].find(v=>String(v??'').trim()))+')':'')).join(' · ')}</small><small>Ficou pronto em ${kDur((t.t2||t.t3)-t.t0)} · entregue às ${kHm(t.t3||t.u)}</small></div><button class="btn" onclick="kVolta('${t.id}')">Reabrir</button></div>`).join(''):'<div class="emp card">Nenhuma entrega registrada hoje.</div>'}</div>`
  :`<div class="kcols ${all?'':'one'}">${all||kFil=='novo'?col('s-n','Novos',nv,'Nenhum pedido novo.'):''}${all||kFil=='prep'?col('s-p','Em preparo',pp,'Nada no fogo agora.'):''}${all||kFil=='pronto'?col('s-r','Prontos para retirar',pr,'Nenhum prato esperando o garçom.'):''}</div>`;
 const fl=[['todos','Todos',null],['novo','Novos',nn],['prep','Em preparo',pp.length],['pronto','Prontos',pr.length],['entregue','Entregues',en.length]];
 const sy=kSync(),aud=K.som&&(!AC||AC.state!='running');
 const foot=`<details class="how kfoot"><summary>Usar a cozinha em outro aparelho</summary><ol><li>No aparelho da cozinha, abra o PDV e entre com a mesma conta.</li><li>Toque no ícone do chapéu de cozinheiro no topo, ou abra o endereço terminando em <code>#cozinha</code>.</li><li>${K.remoto===true?'A sincronização já está ativa: o que o salão enviar aparece aqui em poucos segundos.':'Para sincronizar entre aparelhos, rode o SQL abaixo uma vez no SQL Editor do Supabase.'}</li></ol>${K.remoto===true?'':`<pre>${esc(KSQL)}</pre><button class="btn" onclick="kCopySql()">${sv('copy',16)} Copiar SQL</button>`}</details>`;
 return `<div class="kd"><header class="kh"><div class="kh-r1"><div class="kh-brand"><i>${ic('cook')}</i><h1>Cozinha <small style="opacity:.6;font-size:11px;font-weight:600">v8</small></h1></div><span class="ksy ${sy[0]}" id="ksy"><i></i>${sy[1]}</span>${kAberta()?`<button class="kop on" onclick="kPedeFechar()" title="Clique para fechar a cozinha"><i></i>Cozinha aberta</button>`:`<span class="kop off"><i></i>Cozinha fechada</span>`}<span class="kaud" id="kaud" style="display:${aud?'':'none'}">Toque na tela para ativar o som</span><span class="sp"></span><span class="kclock" id="kclock">${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span><button class="kbn" onclick="kSom()" aria-pressed="${K.som}" title="${K.som?'Desligar':'Ligar'} o som dos avisos">${sv(K.som?'spk':'spkx',20)}<span class="kbl">Som</span></button><button class="kbn" onclick="kFull()" title="Tela cheia">${sv('full',20)}<span class="kbl">Tela cheia</span></button><button class="kbn" onclick="go('mesas')">${sv('back',20)}<span>Voltar ao sistema</span></button></div><div class="kh-r2"><div class="kcs"><div class="kc s-n"><b>${nn}</b><small>novos</small></div><div class="kc s-p"><b>${pp.length}</b><small>em preparo</small></div><div class="kc s-r"><b>${pr.length}</b><small>prontos</small></div><div class="kc s-t"><b>${med?kDur(med):'—'}</b><small>tempo médio hoje</small></div></div><div class="kfs" role="group" aria-label="Filtrar pedidos">${fl.map(([k,l,c])=>`<button class="kfi ${kFil==k?'on':''}" aria-pressed="${kFil==k}" onclick="kFil_('${k}')">${l}${c!=null?' · '+c:''}</button>`).join('')}</div></div></header>${body}${foot}</div>`}

/* --- tema (agora em Configurações > Aparência) --- */
function setTema(t){const r=document.documentElement;
 if(t=='auto'){delete r.dataset.theme;try{localStorage.removeItem('th')}catch(e){}}
 else{r.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}}
 applyAppearance();render()}
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(!document.documentElement.dataset.theme){applyAppearance();render()}})}catch(e){}

function render(){
 nav();document.body.classList.toggle('kds',view=='coz');if(view=='coz')kWake();else kWakeOff();
 const rv=view=='mesas'&&S.seg=='varejo';
 const pgs0=$('#pgs'),psy=pgs0?pgs0.scrollTop:0,hadMod=!!document.querySelector('#main .mod');
 document.documentElement.style.setProperty('--ph',-((Date.now()%1500)/1000)+'s');
 const localBanner=location.protocol==='file:'&&view!='coz'?document.getElementById('localPreviewBanner'):null;
 const localBannerHtml=localBanner?localBanner.outerHTML.replace('style="display: block;"','style="display:block"'):'';
 $('#main').innerHTML=localBannerHtml+(rv?vVenda()+(pay?vPayV():''):({mesas:vSalao,pos:vPos,caixa:vCaixa,cad:vCad,cli:vCli,fin:vFin,cfg:vCfg,coz:vCoz})[view]()+(pay&&cur?vPay():''))+(cm?vCliForm():'')+(cv?vCliVer():'')+(help?vHelp():'')+(jn?vJoin():'')+(ob?vObs():'')+(docAsk?vDoc():'');
 if(hadMod)document.querySelectorAll('#main .mod,#main .mod .card').forEach(e=>{e.style.animation='none'});
 if(rv||view=='pos'){cpfSt();hintQ()}
 if(rv){const tp=$('#tape');if(tp)tp.scrollTop=tp.scrollHeight;const g=$('#pgs');if(g)g.scrollTop=psy}
 if(cm)setTimeout(()=>{const e=$('#kn');e&&e.focus()});
 if(rv&&pay=='Dinheiro')setTimeout(()=>{const e=$('#rc');e&&e.focus()});
 if(ob&&!matchMedia('(pointer:coarse)').matches)setTimeout(()=>{const e=$(obMg?(obEd?'#ace':'#acn'):'#obt');e&&e.focus()});
 if((rv||view=='pos')&&!pay&&!help&&!cm&&!cv&&!jn&&!ob&&!matchMedia('(pointer:coarse)').matches)setTimeout(()=>{const e=$('#bq');e&&e.focus()});
 estSalvarLazy();
 kLockUpdate();
}
/* teclado virtual: o modal acompanha a área realmente visível */
(function(){const v=window.visualViewport;if(!v)return;const r=document.documentElement.style,f=()=>{r.setProperty('--vvh',v.height+'px');r.setProperty('--vvt',v.offsetTop+'px')};v.addEventListener('resize',f);v.addEventListener('scroll',f);f()})();
boot();

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
