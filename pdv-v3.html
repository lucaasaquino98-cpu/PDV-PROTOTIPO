<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

nav{width:236px;background:var(--nv);color:#94a3b8;padding:18px 12px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;overflow:hidden;transition:width .25s ease,padding .25s ease,opacity .2s}

nav .lb{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;color:#475569}

main{flex:1;overflow:auto;padding:18px;min-width:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:20px;margin:0;flex:1;min-width:120px}

.sg{display:inline-flex;background:var(--bd);border-radius:10px;padding:3px}

.mesa{cursor:pointer;min-height:104px;position:relative;background:var(--okb);border:2px solid var(--ok);transition:transform .12s}
.mesa:hover{transform:translateY(-2px)}
.mesa.o{background:var(--bab);border-color:var(--ba);animation:pulse 1.5s infinite}
.mesa.i{background:var(--wab);border:2px dashed var(--wa);cursor:not-allowed}

.mesa .x{all:unset;cursor:pointer;position:absolute;top:8px;right:10px;font-size:18px;opacity:.55}
.mesa .x:hover{opacity:1}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--ok);color:var(--tc)}

.chip.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.prod{cursor:pointer;font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:left;min-height:70px}
.prod:hover{border-color:var(--pr)}.prod b{display:block;font-size:13px}.prod span{color:var(--mu)}
.it{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.it div{flex:1}.q{display:flex;align-items:center;gap:6px}
.q button{width:26px;height:26px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
.row{display:flex;justify-content:space-between;padding:4px 0}
.tot{font-size:22px;font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd)}

.wrap{overflow-x:auto}
.in{color:var(--ok)}.out{color:var(--ba)}
.bar{height:10px;border-radius:5px;background:var(--pr);margin-top:4px}
.frm{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.frm input,.frm select{flex:1;min-width:110px}
.emp{text-align:center;padding:28px 12px;color:var(--mu)}
.hint{color:var(--mu);font-size:12px;margin:0 0 12px}

.mod .card{width:100%;max-width:380px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}

@media (max-width:760px){
.app{flex-direction:column-reverse}
nav{width:auto;flex-direction:row;padding:6px;justify-content:space-around;gap:0;transition:none}
body.nav-off nav{display:none}
nav .brand,nav .sp,nav .usr,nav .lb{display:none}
nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px}
main{padding:12px}.pos{grid-template-columns:1fr}
}
.srch{width:100%;margin-bottom:10px;font-size:16px;padding:12px}
.bd{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--wab);color:var(--wa);margin-top:4px}
.bd.z{background:var(--bab);color:var(--ba)}.bd.n{background:none;color:var(--mu);padding:0;font-weight:400}
.prod.z{opacity:.5}
input:focus-visible,select:focus-visible,.btn:focus-visible,.chip:focus-visible,.prod:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.kb{font:600 12px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:2px 8px}
.mod{backdrop-filter:blur(3px);animation:fi .15s}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes bl{50%{opacity:.3}}
.mod .card.pm{max-width:480px;padding:0;overflow:auto;max-height:100%;border-radius:20px;animation:up .2s ease}
.pm-h{display:flex;gap:12px;align-items:center;padding:18px 18px 14px}
.pm-h h3{margin:0;font-size:17px}.pm-h small{color:var(--mu)}
.pm-h .bd{width:42px;height:42px;border-radius:12px;background:var(--okb);color:var(--pr);display:grid;place-items:center;flex-shrink:0}
.pm-x{all:unset;cursor:pointer;margin-left:auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--mu)}
.pm-x:hover{background:var(--bg);color:var(--tx)}
.pm-sum{margin:0 18px;padding:16px 18px;border-radius:16px;background:linear-gradient(135deg,#0b1220,#134e4a);color:#fff}
.pm-sum small{color:#94a3b8}
.pm-big{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 8px}
.pm-ln{display:flex;justify-content:space-between;font-size:13px;color:#cbd5e1;padding:2px 0}
.pm-sec{padding:16px 18px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.pm-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px}
.pm-o{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--bd);border-radius:14px;background:var(--sf);color:var(--tx);font-weight:600;transition:border-color .15s,background .15s,transform .1s}
.pm-o:hover{border-color:var(--pr)}.pm-o:active{transform:scale(.98)}
.pm-o.on{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 10%,var(--sf))}
.pm-o .ib{width:40px;height:40px;border-radius:11px;background:var(--bg);display:grid;place-items:center;flex-shrink:0}
.pm-o.on .ib{background:var(--sf)}
.pm-o .k{position:absolute;top:6px;right:9px;font:600 10px ui-monospace,Menlo,Consolas,monospace;color:var(--mu)}
.pm-o .ck{position:absolute;bottom:7px;right:9px;width:16px;height:16px;border-radius:50%;background:var(--pr);color:var(--prt);display:none;place-items:center}
.pm-o.on .ck{display:grid}.ck svg{stroke-width:3.2}
.pm-box{margin:14px 18px 0;padding:16px;border-radius:14px;background:var(--bg);border:1px solid var(--bd)}
.pm-pix{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.qr{position:relative;width:168px;height:168px;background:#fff;border-radius:14px;padding:10px;border:1px solid var(--bd);flex-shrink:0}
.qrl{position:absolute;inset:0;margin:auto;width:40px;height:40px;background:#fff;border-radius:10px;display:grid;place-items:center}
.pm-pixi{flex:1;min-width:190px}.pm-pixi p{margin:6px 0 10px;color:var(--mu)}
.pm-pixh{display:flex;align-items:center;gap:8px;font-size:15px}
.pm-st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--wa);background:var(--wab);padding:3px 10px;border-radius:99px}
.pm-st i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:bl 1.2s infinite}
.pm-code{display:flex;gap:8px;align-items:center;margin:10px 0 6px}
.pm-code code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;color:var(--mu)}
.pm-code .btn{display:inline-flex;gap:6px;align-items:center;padding:7px 10px}
.pm-mq{display:flex;gap:16px;align-items:center}
.pm-cash input{width:100%;font-size:20px;font-weight:600;padding:10px 12px;margin-top:4px}
.pm-q{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pm-tr{display:flex;justify-content:space-between;align-items:center;font-size:16px}
.pm-f{display:flex;gap:10px;padding:16px 18px 18px}
.pm-f .btn{flex:1;padding:13px;border-radius:12px;display:inline-flex;gap:8px;justify-content:center;align-items:center}
.pm-f .btn.p{flex:1.7}
@media (prefers-reduced-motion:reduce){.mod,.mod .card.pm,.pm-st i{animation:none}}
.mesa{user-select:none;-webkit-user-select:none}.mesa[data-m]{cursor:grab}
.mesa.j{background:var(--jb);border-color:var(--jc);grid-column:span 2;min-height:150px}
.mesa.j b{font-size:22px}.mesa.j small{font-size:13px}
.tag.j{background:var(--jc);color:var(--jt)}
.mesa .sep{position:absolute;right:12px;bottom:12px;padding:5px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.mesa.dragging{opacity:.35}
.mesa.drop{outline:3px dashed var(--jc);outline-offset:3px;transform:scale(1.04)}
.mesa.ghost{position:fixed;z-index:30;pointer-events:none;margin:0;opacity:.93;transform:scale(1.04) rotate(-1.5deg);box-shadow:0 16px 32px rgba(0,0,0,.35);animation:none;cursor:grabbing}
.mod .card.jm{max-width:380px;text-align:center;padding:24px;border-radius:20px;animation:up .2s ease}
.jm .jbx{width:56px;height:56px;border-radius:16px;background:var(--jb);color:var(--jc);display:grid;place-items:center;margin:0 auto 12px}
.jm h3{font-size:18px;margin:0 0 12px}
.jcc{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.jcc span{background:var(--jb);color:var(--jc);border:1.5px solid var(--jc);border-radius:10px;padding:8px 12px;font-weight:700}
.jcc i{font-style:normal;color:var(--mu);font-weight:700}
.jm p{color:var(--mu);margin:0}
</style>

<body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="toast"></div>
<script>
const SEG={
rest:{nome:'Restaurante',prods:[['Prato executivo','Pratos',32],['Filé à parmegiana','Pratos',48],['Salada Caesar','Entradas',26],['Refrigerante','Bebidas',7],['Suco natural','Bebidas',10],['Pudim','Sobremesas',14]]},
bar:{nome:'Bar',prods:[['Chopp 300ml','Chopp',9],['Caipirinha','Drinks',18],['Gin tônica','Drinks',24],['Cerveja long neck','Cervejas',12],['Porção de fritas','Porções',32]]},
lanch:{nome:'Lanchonete',prods:[['X-Burger','Lanches',22],['X-Bacon','Lanches',27],['Hot dog','Lanches',15],['Pastel','Salgados',9],['Milk shake','Bebidas',16]]},
varejo:{nome:'Varejo / Loja',prods:[['Camiseta básica','Roupas',49.9,'7891000100011',24],['Calça jeans','Roupas',119.9,'7891000100028',3],['Meia (par)','Roupas',12.9,'7891000100035',40],['Boné','Acessórios',39.9,'7891000100042',12],['Fone de ouvido','Eletrônicos',69.9,'7891000100059',8],['Carregador USB-C','Eletrônicos',34.9,'7891000100066',0]]}
};
const mk=()=>({items:[],aberta:false,inv:false,hora:'',nome:'',cpf:'',g:null});
const S={seg:'rest',taxa:true,prods:[],pid:0,nm:12,mesas:{},cmds:{},cn:0,garcons:[],gid:0,mov:[{t:'08:00',desc:'Abertura de caixa',tipo:'in',val:200,forma:'Dinheiro',cat:'Suprimento'}],clientes:[{id:1,nome:'Maria Souza',tel:'(81) 99999-0000',cpf:'52998224725',email:'',obs:''}],kid:1,cart:{items:[]},dsc:0,dt:'%',cpf:''};
for(let i=1;i<=S.nm;i++)S.mesas[i]=mk();
let view='mesas',mode='m',cur=null,cat='Todos',pay=null,q='',help=false,cm=null,cv=null,cq='',ctab='prod';
const $=s=>document.querySelector(s);
const R=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hm=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const P=id=>S.prods.find(p=>p.id==id)||{nome:'(removido)',preco:0};
const tot=m=>m.items.reduce((a,i)=>a+i.q*P(i.id).preco,0);
const G=()=>cur.k=='m'?S.mesas[cur.id]:S.cmds[cur.id];
const lbl=()=>cur.k=='m'?(G().j?'Mesas '+G().j.join(' + '):'Mesa '+cur.id):'Comanda '+cur.id+(G().nome?' · '+G().nome:'');
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2400)}
function go(v){view=v;cur=null;pay=null;cm=null;cv=null;render()}
function tgl(){document.body.classList.toggle('nav-off')}
const IC={
mesas:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
caixa:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/>',
cad:'<path d="M4 7l8-4 8 4-8 4-8-4zM4 12l8 4 8-4M4 17l8 4 8-4"/>',
cli:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 010 6.4M18 14.4c2 .7 3.5 2.5 3.5 5.6"/>',
fin:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>'};
const ic=k=>`<svg viewBox="0 0 24 24">${IC[k]}</svg>`;
function nav(){
 const a=view=='pos'?'mesas':view;
 const it=[['mesas',S.seg=='varejo'?'Venda rápida':'Atendimento'],['caixa','Caixa'],['cad','Cadastros'],['cli','Clientes'],['fin','Financeiro']];
 $('#nav').innerHTML=`<div class="brand"><i>P</i>PDV Fácil</div><div class="lb">Menu</div>`+it.map(([k,l])=>`<button class="${a==k?'on':''}" onclick="go('${k}')">${ic(k)}${l}</button>`).join('')+`<div class="sp"></div><div class="usr"><b>D</b><div>Diretoria<small>Caixa aberto</small></div></div>`;
}
function head(t,extra=''){return `<div class="top"><button class="btn ic" onclick="tgl()" aria-label="Mostrar ou ocultar menu">${ic('menu')}</button><h1>${t}</h1>${extra}<button class="btn ic" onclick="tth()" aria-label="Alternar tema claro/escuro">${ic(isDark()?'sun':'moon')}</button><select onchange="S.seg=this.value;go('mesas')" aria-label="Segmento">${Object.entries(SEG).map(([k,v])=>`<option value="${k}" ${k==S.seg?'selected':''}>${v.nome}</option>`).join('')}</select></div>`}
function kp(a){return `<div class="kpis">${a.map(([l,v])=>`<div class="card kpi"><small>${l}</small><b>${v}</b></div>`).join('')}</div>`}
function vSalao(){
 const ms=Object.entries(S.mesas).filter(([,m])=>!m.ref),cs=Object.entries(S.cmds);
 const oc=ms.filter(([,m])=>m.aberta).length,iv=ms.filter(([,m])=>m.inv).length;
 const aberto=[...ms,...cs].reduce((a,[,m])=>a+tot(m),0);
 const sg=`<div class="sg"><button class="${mode=='m'?'on':''}" onclick="mode='m';render()">Mesas</button><button class="${mode=='c'?'on':''}" onclick="mode='c';render()">Comandas (${cs.length})</button></div>`;
 let b;

function caixaAdd(){const v=parseFloat($('#cv').value),t=$('#ct').value;if(!v)return toast('Informe o valor');S.mov.push({t:hm(),desc:$('#cd').value||(t=='out'?'Sangria':'Suprimento'),tipo:t,val:v,forma:'Dinheiro',cat:t=='out'?'Sangria':'Suprimento'});render()}
function vCad(){
 const body=`<div class="wrap"><table><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Código</th><th>Estoque</th><th></th></tr>${S.prods.map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(p.cat)}</td><td>${R(p.preco)}</td><td>${esc(p.cod||'—')}</td><td>${p.est==null?'—':p.est<=5?`<span class="bd ${p.est?'':'z'}">${p.est}</span>`:p.est}</td><td><button class="btn" onclick="delP(${p.id})">Excluir</button></td></tr>`).join('')}</table></div>${S.prods.length?'':`<div class="emp">Nenhum produto ainda. Cadastre abaixo ou <button class="btn" onclick="loadEx()">carregar exemplos de ${SEG[S.seg].nome}</button></div>`}`+
 frm(`<input id="pn" placeholder="Nome do produto"><input id="pc" placeholder="Categoria"><input id="pp" type="number" step="0.01" placeholder="Preço"><input id="pk" placeholder="Código de barras"><input id="pe" type="number" min="0" placeholder="Estoque">`,'addProd()','Adicionar');
 const gbody=(S.garcons.length?`<div class="wrap"><table><tr><th>Garçom</th><th>Telefone</th><th>Em atendimento</th><th>Vendas</th><th></th></tr>${S.garcons.map(g=>{const s=gStat(g.id);return `<tr><td><b>${esc(g.nome)}</b></td><td>${fone(g.tel)}</td><td>${s.ab||'—'}</td><td>${s.n?s.n+' · '+R(s.t):'<small style="color:var(--mu)">nenhuma</small>'}</td><td style="text-align:right"><button class="btn" onclick="delGar(${g.id})">Excluir</button></td></tr>`}).join('')}</table></div>`:`<div class="emp">Nenhum garçom cadastrado. Cadastre abaixo: eles aparecerão para escolha nas mesas e comandas.</div>`)+frm(`<input id="gn" placeholder="Nome do garçom" autocomplete="off"><input id="gt" inputmode="tel" placeholder="Telefone (opcional)" autocomplete="off">`,'addGar()','Adicionar');
 const tb=rst()?ctab:'prod';
 return head('Cadastros')+`<div class="chips"><button class="chip ${tb=='prod'?'on':''}" onclick="ctab='prod';render()">Produtos (${S.prods.length})</button>${rst()?`<button class="chip ${tb=='gar'?'on':''}" onclick="ctab='gar';render()">Garçons (${S.garcons.length})</button>`:''}</div><div class="card">${tb=='gar'?gbody:body}</div>`
}
const rst=()=>S.seg!='varejo';
const gn=m=>{const g=S.garcons.find(x=>x.id==m.g);return g?g.nome:''};
const gtag=m=>rst()&&m.g&&gn(m)?' · '+esc(gn(m)):'';
const gStat=id=>{const v=S.mov.filter(x=>x.gid==id);return {n:v.length,t:v.reduce((a,x)=>a+x.val,0),ab:[...Object.values(S.mesas),...Object.values(S.cmds)].filter(o=>o.g==id).length}};
function addGar(){const n=$('#gn').value.trim();if(!n)return toast('Informe o nome do garçom');S.garcons.push({id:++S.gid,nome:n,tel:$('#gt').value.trim()||'—'});toast('Garçom cadastrado');render()}
function delGar(id){if(gStat(id).ab)return toast('Garçom com atendimento em aberto');S.garcons=S.garcons.filter(g=>g.id!=id);render()}
function setG(v){G().g=+v||null}
function addProd(){const n=$('#pn').value.trim(),p=parseFloat($('#pp').value);if(!n||!p)return toast('Preencha nome e preço');S.prods.push({id:++S.pid,nome:n,cat:$('#pc').value.trim()||'Geral',preco:p,cod:$('#pk').value.trim(),est:$('#pe').value===''?null:parseInt($('#pe').value)});render()}
function delP(id){const used=[...Object.values(S.mesas),...Object.values(S.cmds),S.cart].some(o=>o.items.some(i=>i.id==id));if(used)return toast('Produto em uso em um atendimento aberto');S.prods=S.prods.filter(p=>p.id!=id);render()}
function loadEx(){SEG[S.seg].prods.forEach(p=>S.prods.push({id:++S.pid,nome:p[0],cat:p[1],preco:p[2],cod:p[3]||'',est:p[4]??null}));render()}

const compras=c=>S.mov.filter(x=>x.cat=='Vendas'&&(x.cid==c.id||(!x.cid&&x.cpf&&x.cpf==c.cpf)));
const fone=t=>t&&t!='—'?esc(t):'—';
function cliRows(){
 const t=cq.trim().toLowerCase(),td=dg(cq),l=S.clientes.filter(c=>!t||c.nome.toLowerCase().includes(t)||(c.tel||'').toLowerCase().includes(t)||(td&&(c.cpf||'').includes(td))).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
 if(!l.length)return `<div class="emp">${S.clientes.length?'Nenhum cliente encontrado.':'Nenhum cliente cadastrado ainda.'}</div>`;
 return `<div class="wrap"><table><tr><th>Nome</th><th>Telefone</th><th>CPF</th><th>Compras</th><th></th></tr>${l.map(c=>{const v=compras(c),tt=v.reduce((a,x)=>a+x.val,0);return `<tr><td><b>${esc(c.nome)}</b></td><td>${fone(c.tel)}</td><td>${c.cpf?fcpf(c.cpf):'—'}</td><td>${v.length?`${v.length} · ${R(tt)}`:'<small style="color:var(--mu)">nenhuma</small>'}</td><td style="white-space:nowrap;text-align:right"><button class="btn" onclick="cv=${c.id};render()">Ver</button> <button class="btn" onclick="cm={id:${c.id}};render()">Editar</button> <button class="btn" onclick="delCli(${c.id})">Excluir</button></td></tr>`}).join('')}</table></div>`
}
function vCli(){
 const n=S.clientes.length,comp=S.clientes.filter(c=>compras(c).length).length;
 return head('Clientes','<button class="btn p" onclick="cm={id:null};render()">+ Novo cliente</button>')+kp([['Clientes cadastrados',n],['Já compraram',comp],['Sem compras',n-comp]])+
 `<div class="card"><input id="cqi" class="srch" placeholder="Buscar por nome, CPF ou telefone" value="${esc(cq)}" oninput="cq=this.value;$('#cl').innerHTML=cliRows()"><div id="cl">${cliRows()}</div></div>`
}
function vCliForm(){
 const c=cm.id?S.clientes.find(k=>k.id==cm.id):{nome:'',tel:'',cpf:'',email:'',obs:''};
 return `<div class="mod" onclick="cm=null;render()"><div class="card" onclick="event.stopPropagation()"><h3>${cm.id?'Editar cliente':'Novo cliente'}</h3>
 <div class="frm" style="flex-direction:column;margin-top:0"><input id="kn" placeholder="Nome completo" value="${esc(c.nome)}" autocomplete="off"><input id="kc" inputmode="numeric" placeholder="CPF" value="${fcpf(c.cpf||'')}" oninput="this.value=fcpf(dg(this.value))" autocomplete="off"><input id="kt" inputmode="tel" placeholder="Telefone" value="${c.tel&&c.tel!='—'?esc(c.tel):''}"><input id="ke" type="email" placeholder="E-mail (opcional)" value="${esc(c.email||'')}"><input id="ko" placeholder="Observações (opcional)" value="${esc(c.obs||'')}"></div>
 <button class="btn p g" onclick="saveCli()">${cm.id?'Salvar alterações':'Cadastrar cliente'}</button><button class="btn g" onclick="cm=null;render()">Cancelar</button></div></div>`
}
function vCliVer(){
 const c=S.clientes.find(k=>k.id==cv);if(!c)return '';
 const v=compras(c),tt=v.reduce((a,x)=>a+x.val,0),row=(l,x)=>`<div class="row"><span style="color:var(--mu)">${l}</span><span style="text-align:right">${x}</span></div>`;
 return `<div class="mod" onclick="cv=null;render()"><div class="card" onclick="event.stopPropagation()" style="max-height:90vh;overflow:auto"><h3>${esc(c.nome)}</h3>
 ${row('CPF',c.cpf?fcpf(c.cpf):'—')}${row('Telefone',fone(c.tel))}${row('E-mail',c.email?esc(c.email):'—')}${row('Observações',c.obs?esc(c.obs):'—')}
 <h3 style="margin-top:14px">Compras · ${v.length} · ${R(tt)}</h3>
 ${v.length?`<div class="wrap"><table><tr><th>Hora</th><th>Forma</th><th>Valor</th></tr>${v.slice().reverse().map(x=>`<tr><td>${x.t}</td><td>${x.forma}</td><td>${R(x.val)}</td></tr>`).join('')}</table></div>`:'<p class="hint">Este cliente ainda não tem compras.</p>'}
 <button class="btn p g" onclick="cm={id:${c.id}};cv=null;render()">Editar</button><button class="btn g" onclick="cv=null;render()">Fechar</button></div></div>`
}
function saveCli(){
 const n=$('#kn').value.trim(),c=dg($('#kc').value);
 if(!n)return toast('Informe o nome');
 if(!c)return toast('Informe o CPF');
 if(!okCpf(c))return toast('CPF inválido');
 if(S.clientes.some(k=>k.cpf==c&&k.id!=cm.id))return toast('CPF já cadastrado');
 const d={nome:n,cpf:c,tel:$('#kt').value.trim()||'—',email:$('#ke').value.trim(),obs:$('#ko').value.trim()};
 if(cm.id)Object.assign(S.clientes.find(k=>k.id==cm.id),d);else S.clientes.push({id:++S.kid,...d});
 toast(cm.id?'Cliente atualizado':'Cliente cadastrado');cm=null;render()
}
function delCli(id){
 const c=S.clientes.find(k=>k.id==id);if(!c||!confirm('Excluir "'+c.nome+'"? O histórico de compras continua no caixa.'))return;
 S.clientes=S.clientes.filter(k=>k.id!=id);toast('Cliente excluído');render()
}
function vFin(){
 const rec=sum(x=>x.cat=='Vendas'),des=sum(x=>x.tipo=='out'&&x.cat!='Sangria');
 const fm=['Pix','Cartão','Dinheiro','Vale'].map(f=>[f,sum(x=>x.cat=='Vendas'&&x.forma==f)]),mx=Math.max(1,...fm.map(x=>x[1]));
 return head('Financeiro')+kp([['Receitas',R(rec)],['Despesas',R(des)],['Resultado',R(rec-des)]])+
 `<div class="pos" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><h3>Vendas por forma de pagamento</h3>${fm.map(([f,v])=>`<div style="margin-bottom:10px"><div class="row"><span>${f}</span><b>${R(v)}</b></div><div class="bar" style="width:${v/mx*100}%"></div></div>`).join('')}</div>
 <div class="card"><h3>Lançar despesa</h3><div class="frm"><input id="fd" placeholder="Descrição"><input id="fv" type="number" step="0.01" placeholder="Valor"><select id="fc2"><option>Insumos</option><option>Pessoal</option><option>Aluguel</option><option>Contas</option><option>Outros</option></select><button class="btn p" onclick="addDes()">Lançar</button></div></div></div>
 <div class="card" style="margin-top:14px"><h3>Lançamentos</h3>${tbl(S.mov.slice().reverse())}</div>`
}
function addDes(){const v=parseFloat($('#fv').value);if(!v)return toast('Informe o valor');S.mov.push({t:hm(),desc:$('#fd').value||'Despesa',tipo:'out',val:v,forma:'Banco',cat:$('#fc2').value});render()}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const t=localStorage.getItem('th');if(t)document.documentElement.dataset.theme=t}catch(e){}
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t=='dark':matchMedia('(prefers-color-scheme:dark)').matches};
function tth(){const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}render()}
const dsc=s=>Math.min(s,S.dt=='%'?s*S.dsc/100:S.dsc);
const pgrid=()=>{const t=q.toLowerCase(),ps=S.prods.filter(p=>(cat=='Todos'||p.cat==cat)&&(!t||p.nome.toLowerCase().includes(t)||(p.cod||'').includes(t)));
 return ps.length?ps.map(p=>{const z=p.est===0;return `<button class="prod ${z?'z':''}" onclick="vAdd(${p.id})"><b>${esc(p.nome)}</b><span>${R(p.preco)}</span>${p.est==null?'':`<br><span class="bd ${z?'z':p.est<=5?'':'n'}">${z?'Sem estoque':p.est+' un.'}</span>`}</button>`}).join(''):'<div class="emp">Nenhum produto encontrado.</div>'};
function vVenda(){
 const c=S.cart,sub=tot(c),d=dsc(sub),qtd=c.items.reduce((a,i)=>a+i.q,0),cats=['Todos',...new Set(S.prods.map(p=>p.cat))];
 const vs=S.mov.filter(x=>x.cat=='Vendas'),fat=vs.reduce((a,x)=>a+x.val,0),low=S.prods.filter(p=>p.est!=null&&p.est<=5).length;
 const left=S.prods.length?`<input id="bq" class="srch" placeholder="Buscar produto ou bipar código de barras (F2)" value="${esc(q)}" oninput="q=this.value;$('#pg').innerHTML=pgrid()" onkeydown="if(event.key=='Enter')bar()"><div class="chips">${cats.map(x=>`<button class="chip ${x==cat?'on':''}" onclick="cat='${x}';render()">${x}</button>`).join('')}</div><div class="grid" id="pg">${pgrid()}</div>`:`<div class="card emp">Nenhum produto cadastrado ainda.<br><br><button class="btn p" onclick="loadEx()">Carregar exemplos de ${SEG[S.seg].nome}</button> <button class="btn" onclick="go('cad')">Ir para Cadastros</button></div>`;
 return head('Venda rápida')+kp([['Vendas hoje',vs.length],['Faturamento',R(fat)],['Ticket médio',R(fat/Math.max(1,vs.length))],['Estoque baixo',low]])+
 `<p class="hint">F2 buscar · F3 CPF · F4 finalizar · F6 desconto · F9 limpar · F1 todos os atalhos</p><div class="pos"><div>${left}</div><div class="card" style="align-self:start"><h3>Carrinho · ${qtd} ${qtd==1?'item':'itens'}</h3>${c.items.length?c.items.map(i=>{const p=P(i.id);return `<div class="it"><div><b>${esc(p.nome)}</b><br><small style="color:var(--mu)">${R(p.preco)}</small></div><div class="q"><button onclick="vChg(${i.id},-1)" aria-label="Diminuir">−</button>${i.q}<button onclick="vChg(${i.id},1)" aria-label="Aumentar">+</button></div><b>${R(p.preco*i.q)}</b></div>`}).join(''):'<p style="color:var(--mu)">Bipe o código ou toque nos produtos.</p>'}
 <div style="margin-top:12px"><input id="cpf" style="width:100%" inputmode="numeric" autocomplete="off" placeholder="CPF do cliente (F3)" value="${fcpf(S.cpf)}" oninput="cpfIn(this)"><div id="cs" style="margin-top:6px"></div></div>
 <div class="frm"><input id="dv" type="number" min="0" step="0.01" placeholder="Desconto (F6)" value="${S.dsc||''}" onchange="S.dsc=Math.max(0,+this.value||0);render()"><select onchange="S.dt=this.value;render()"><option value="%" ${S.dt=='%'?'selected':''}>%</option><option value="R" ${S.dt=='R'?'selected':''}>R$</option></select></div>
 <div class="row" style="margin-top:10px"><span>Subtotal</span><span>${R(sub)}</span></div><div class="row"><span>Desconto</span><span>− ${R(d)}</span></div><div class="row tot"><span>Total</span><span>${R(sub-d)}</span></div>
 <button class="btn p g" ${c.items.length?'':'disabled'} onclick="pay='Pix';render()">Finalizar venda (F4)</button><button class="btn g" ${c.items.length?'':'disabled'} onclick="limpa()">Limpar carrinho (F9)</button></div></div>`
}
function bar(){const t=q.trim(),r=S.prods.filter(x=>x.cod&&x.cod==t),l=r.length?r:S.prods.filter(x=>x.nome.toLowerCase().includes(t.toLowerCase()));if(l.length!=1)return toast('Produto não encontrado');q='';vAdd(l[0].id)}
function vAdd(id){const p=P(id),i=S.cart.items.find(x=>x.id==id),n=(i?i.q:0)+1;if(p.est!=null&&n>p.est)return toast(p.est?'Estoque insuficiente':'Produto sem estoque');i?i.q++:S.cart.items.push({id,q:1});render()}
function vChg(id,d){const i=S.cart.items.find(x=>x.id==id),p=P(id);if(d>0&&p.est!=null&&i.q+1>p.est)return toast('Estoque insuficiente');i.q+=d;if(i.q<1)S.cart.items=S.cart.items.filter(x=>x!=i);render()}

function fecharV(){const s=tot(S.cart),v=s-dsc(s);if(S.cpf&&!okCpf(S.cpf))return toast('CPF inválido. Corrija ou apague');if(pay=='Dinheiro'&&(+(($('#rc')||{}).value)||0)<v-.001)return toast('Valor recebido menor que o total');
 S.cart.items.forEach(i=>{const p=P(i.id);if(p.est!=null)p.est-=i.q});
 const c=cl();S.mov.push({t:hm(),desc:'Venda'+(c?' · '+c.nome:''),tipo:'in',val:v,forma:pay,cat:'Vendas',cpf:S.cpf,cid:c?c.id:null});
 S.cart={items:[]};S.dsc=0;S.cpf='';pay=null;toast('Venda registrada');render()}
const dg=s=>String(s).replace(/\D/g,'').slice(0,11);
const fcpf=d=>d.replace(/(\d{3})(\d{0,3})(\d{0,3})(\d{0,2})/,(m,a,b,c,e)=>a+(b?'.'+b:'')+(c?'.'+c:'')+(e?'-'+e:''));
function okCpf(c){if(c.length!=11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);if((s*10%11)%10!=c[t])return false}return true}
const cl=()=>S.cpf.length==11?S.clientes.find(k=>k.cpf==S.cpf):null;
function cpfIn(e){const d=dg(e.value);e.value=fcpf(d);S.cpf=d;if(view=='pos'&&cur)G().cpf=d;cpfSt()}
function cpfSt(){const e=$('#cs');if(!e)return;const d=S.cpf,c=cl();
 e.innerHTML=!d?'<small style="color:var(--mu)">Opcional. Digite o CPF para puxar o cliente do cadastro.</small>':d.length<11?'':!okCpf(d)?'<small style="color:var(--ba)">CPF inválido</small>':c?`<div style="background:var(--okb);border-radius:8px;padding:8px 10px"><small style="color:var(--ok)">✓ Cliente cadastrado</small><br><b>${esc(c.nome)}</b>${c.tel&&c.tel!='—'?`<br><small style="color:var(--mu)">${esc(c.tel)}</small>`:''}</div>`:`<small style="color:var(--wa)">CPF não cadastrado. Cadastre agora:</small><div class="frm" style="margin:6px 0 0"><input id="cn2" placeholder="Nome" autocomplete="off"><input id="ct2" inputmode="tel" placeholder="Telefone (opcional)" autocomplete="off"><button class="btn" onclick="cpfCad()">Cadastrar</button></div>`}
function cpfCad(){const n=$('#cn2').value.trim();if(!n)return toast('Informe o nome');S.clientes.push({id:++S.kid,nome:n,tel:$('#ct2').value.trim()||'—',cpf:S.cpf,email:'',obs:''});toast('Cliente cadastrado');cpfSt()}
function limpa(){S.cart={items:[]};S.dsc=0;S.cpf='';render()}
function vHelp(){const L=[['F1','Mostrar ou fechar atalhos'],['F2','Buscar produto ou bipar código'],['F3','CPF do cliente'],['F4','Finalizar venda'],['F6','Desconto'],['F9','Limpar carrinho'],['1 a 4','Forma de pagamento'],['Enter','Confirmar pagamento'],['Esc','Fechar janela ou voltar'],['Alt + 1 a 5','Venda, Caixa, Cadastros, Clientes, Financeiro']];
 return `<div class="mod" onclick="help=false;render()"><div class="card" onclick="event.stopPropagation()"><h3>Atalhos do teclado</h3>${L.map(([a,b])=>`<div class="row"><span>${b}</span><span class="kb">${a}</span></div>`).join('')}<button class="btn g" onclick="help=false;render()">Fechar</button></div></div>`}
document.addEventListener('keydown',e=>{
 const k=e.key,t=e.target,typing=/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName),rv=view=='mesas'&&S.seg=='varejo',f=id=>{e.preventDefault();const x=$(id);x&&x.focus()};
 if(k=='F1'){e.preventDefault();help=!help;return render()}
 if(k=='Escape'){if(jn)jn=null;else if(help)help=false;else if(pay)pay=null;else if(cm)cm=null;else if(cv)cv=null;else if(view=='pos')return go('mesas');else return;return render()}
 if(e.altKey&&['Digit1','Digit2','Digit3','Digit4','Digit5'].includes(e.code)){e.preventDefault();return go(['mesas','caixa','cad','cli','fin'][+e.code.slice(5)-1])}
 if(jn){if(k=='Enter'){e.preventDefault();confirmJoin()}return}
 if(help)return;
 if(pay){
  if(k=='Enter'&&t.tagName!='BUTTON'){e.preventDefault();return rv?fecharV():fechar()}
  const fm=rv?['Pix','Débito','Crédito','Dinheiro']:['Pix','Cartão','Dinheiro','Vale'];
  if(!typing&&'1234'.includes(k)&&k.length==1){pay=fm[+k-1];render()}
  return}
 if(rv){
  if(k=='F2')f('#bq');else if(k=='F3')f('#cpf');else if(k=='F6')f('#dv');
  else if(k=='F4'&&S.cart.items.length){e.preventDefault();pay='Pix';render()}
  else if(k=='F9'){e.preventDefault();limpa()}
 }else if(view=='pos'&&k=='F3')f('#cpf');
 else if(view=='pos'&&k=='F4'&&G().items.length){e.preventDefault();pay='Pix';render()}
});
function render(){
 nav();
 const rv=view=='mesas'&&S.seg=='varejo';
 $('#main').innerHTML=(rv?vVenda()+(pay?vPayV():''):({mesas:vSalao,pos:vPos,caixa:vCaixa,cad:vCad,cli:vCli,fin:vFin})[view]()+(pay&&cur?vPay():''))+(cm?vCliForm():'')+(cv?vCliVer():'')+(help?vHelp():'')+(jn?vJoin():'');
 if(rv||view=='pos')cpfSt();
 if(cm)setTimeout(()=>{const e=$('#kn');e&&e.focus()});
 if(rv&&pay=='Dinheiro')setTimeout(()=>{const e=$('#rc');e&&e.focus()});
 if(rv&&!pay&&!help&&!matchMedia('(pointer:coarse)').matches)setTimeout(()=>{const e=$('#bq');e&&e.focus()});
}
render();
</script>
</body>
</html>
