.retail-options summary{cursor:pointer;font-size:12px;font-weight:750;display:flex;justify-content:space-between;align-items:center;gap:10px}

.retail-option-body{padding-top:10px}
.retail-option-body label,.retail-discount label{display:block;font-size:11px;font-weight:700;color:var(--mu);margin-bottom:4px}
.retail-option-body input{width:100%}
.retail-discount{display:grid;grid-template-columns:1fr minmax(70px,100px) 70px;align-items:end;gap:7px;margin-top:10px}

.retail-pay span{font:700 11px ui-monospace,monospace;opacity:.8;margin-left:auto}

.retail-pay:disabled{opacity:.4;cursor:not-allowed}
.retail-clear{width:100%;margin-top:6px;border:0;background:transparent;color:var(--mu);font:inherit;font-size:12px;padding:9px;cursor:pointer}

<body>
<div class="app"><nav id="nav"></nav><main id="main"><div id="localPreviewBanner" class="local-preview-banner"><strong>Prévia local das Configurações</strong> — esta cópia serve para visualizar a interface. As alterações ficam neste navegador e não são enviadas ao Supabase.</div></main></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const SEG={rest:{nome:'Restaurante'},bar:{nome:'Bar'},lanch:{nome:'Lanchonete'},varejo:{nome:'Varejo / Loja'}};
const mk=()=>({items:[],aberta:false,inv:false,hora:'',nome:'',cpf:'',g:null});
const S={seg:'rest',taxa:true,prods:[],pid:0,nm:12,mesas:{},cmds:{},cn:0,garcons:[],gid:0,mov:[],clientes:[],kid:0,cart:{items:[]},dsc:0,dt:'%',cpf:'',coz:[]};
for(let i=1;i<=S.nm;i++)S.mesas[i]=mk();

/* ===== Supabase: login, leitura e gravação ===== */
const SB={url:'https://vgivsogjhduyxqyibbxj.supabase.co',key:'sb_publishable_hZDgAKKicAV8vBjFn2UT4A_4mjr5Ge3',sdk:'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js',login:'index.html'};
let sb=null,USER='';
window.addEventListener('error',e=>{console.error(e.error||e.message);toast('Erro na tela: '+e.message)});
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);toast('Erro: '+((e.reason&&e.reason.message)||e.reason))});
const docLbl=d=>d=='nfce'?'NFC-e':d=='comprovante'?'Comprovante de Venda':'';
const nfceOk=()=>{const c=cfgGet(),e=c.empresa,f=c.fiscal;return f.emissao=='sim'&&cnpjOk(String(e.cnpj||'').replace(/\D/g,''))&&!!e.ie&&!!e.cscId&&!!e.cscToken};
const nfceFalta=()=>{const c=cfgGet(),e=c.empresa,f=c.fiscal,l=[];if(f.emissao!='sim')return['ligar a NFC-e em Configurações › Fiscal'];if(!cnpjOk(String(e.cnpj||'').replace(/\D/g,'')))l.push('CNPJ');if(!e.ie)l.push('Inscrição Estadual');if(!e.cscId||!e.cscToken)l.push('CSC');return l};
/* Ponto de integração: aqui entra a chamada ao backend fiscal (SEFAZ). Hoje devolve pendente. */
async function emitirNFCe(mov,itens){return {ok:false,pendente:true}}
function docStart(fn){docAsk={fn,sel:'comprovante'};render()}
function docSel(t){if(t=='nfce'&&!nfceOk())return toast('NFC-e indisponível: '+nfceFalta().join(', '));docAsk.sel=t;render()}
function docGo(){if(!docAsk)return;const f=docAsk.fn;docTipo=docAsk.sel;docAsk=null;Promise.resolve(f=='fechar'?fechar(true):fecharV(true)).finally(()=>{docTipo=null})}
function vDoc(){const ok=nfceOk(),sel=docAsk.sel,fl=nfceFalta(),cp=S.cpf&&S.cpf.length==11?fcpf(S.cpf):'';
 const o=(id,k,t,sg,sub,dis)=>`<button class="pm-o dc ${sel==id?'on':''} ${dis?'off':''}" onclick="docSel('${id}')" ${dis?'aria-disabled="true"':''}><span class="ib">${sv(id=='nfce'?'rec':'ok',22)}</span><span class="dc-t"><b>${t}</b><small>${sg}</small><small>${sub}</small></span><span class="k">${k}</span><span class="ck">${sv('ok',11)}</span></button>`;
 return `<div class="mod" onclick="docAsk=null;render()"><div class="card pm" onclick="event.stopPropagation()" role="dialog" aria-label="Documento da venda">
 <div class="pm-h"><span class="bd">${sv('rec',22)}</span><div><h3>Documento da venda</h3><small>Escolha o que será emitido para esta venda</small></div><button class="pm-x" onclick="docAsk=null;render()" aria-label="Fechar">${sv('x',18)}</button></div>
 <div class="pm-sec">Tipo de documento</div>
 <div class="dc-list">${o('nfce','1','NFC-e','Nota Fiscal de Consumidor Eletrônica',ok?'Documento fiscal'+(cp?' · CPF na nota: '+cp:''):'Indisponível: falta '+fl.join(', '),!ok)}${o('comprovante','2','Comprovante de Venda','Documento sem valor fiscal','Registra a venda e baixa a mesa',false)}</div>
 <div class="pm-f"><button class="btn" onclick="docAsk=null;render()">Voltar</button><button class="btn p" onclick="docGo()">${sv('ok',18)}Confirmar · ${docLbl(sel)}</button></div></div></div>`}
const once=fn=>async(...a)=>{if(once.b)return;once.b=1;try{return await fn(...a)}finally{once.b=0}};
async function DBX(p){const {data,error}=await p;if(error)throw error;return data}
const dbErr=e=>toast('Não foi possível salvar: '+((e&&e.message)||e));
const cfg=patch=>DBX(sb.from('empresas').update(patch).eq('id',S.empId)).catch(dbErr);
const loadSdk=()=>new Promise((ok,no)=>{if(window.supabase)return ok();const t=document.createElement('script');t.src=SB.sdk;t.onload=ok;t.onerror=()=>no(new Error('Não foi possível carregar o Supabase'));document.head.appendChild(t)});
const dataHora=d=>{const x=new Date(d),h=x.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});return x.toDateString()==new Date().toDateString()?h:x.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+h};
const isHoje=x=>new Date(x.at).toDateString()==new Date().toDateString();
const mP=r=>({id:r.id,nome:r.nome,cat:r.categoria,preco:+r.preco,cod:r.codigo,est:r.estoque});
const mC=r=>({id:r.id,nome:r.nome,cpf:r.cpf,tel:r.telefone||'—',email:r.email,obs:r.obs});
const mG=r=>({id:r.id,nome:r.nome,tel:r.telefone||'—'});
const mM=r=>({id:r.id,t:dataHora(r.criado_em),at:r.criado_em,desc:r.descricao,tipo:r.tipo,val:+r.valor,forma:r.forma,cat:r.categoria,cpf:r.cpf,cid:r.cliente_id,gid:r.garcom_id,doc:r.documento||''});
const addMov=async m=>{const row={descricao:m.desc,tipo:m.tipo,valor:m.val,forma:m.forma,categoria:m.cat,cpf:m.cpf||'',cliente_id:m.cid||null,garcom_id:m.gid||null};
 if(m.doc){try{const r=await DBX(sb.from('movimentos').insert({...row,documento:m.doc}).select().single());docCol=true;return mM(r)}
  catch(e){if(!/documento|column|schema/i.test(String(e&&(e.message||e.details||''))))throw e;docCol=false;row.descricao+=' · '+docLbl(m.doc)}}
 return mM(await DBX(sb.from('movimentos').insert(row).select().single()))};
async function carregar(){
 const desde=new Date(Date.now()-90*864e5).toISOString();
 const [emp,pr,cl,ga,mv]=await Promise.all([
  DBX(sb.from('empresas').select('*').limit(1).maybeSingle()),
  DBX(sb.from('produtos').select('*').order('nome')),
  DBX(sb.from('clientes').select('*').order('nome')),
  DBX(sb.from('garcons').select('*').order('nome')),
  DBX(sb.from('movimentos').select('*').gte('criado_em',desde).order('criado_em',{ascending:false}).limit(1000))
 ]);
 if(!emp)throw new Error('Usuário sem empresa vinculada');
 S.empId=emp.id;S.seg=SEG[emp.segmento]?emp.segmento:'rest';S.taxa=emp.taxa_servico;S.nm=emp.qtd_mesas;
 S.mesas={};for(let i=1;i<=S.nm;i++)S.mesas[i]=mk();
 S.prods=pr.map(mP);S.clientes=cl.map(mC);S.garcons=ga.map(mG);S.mov=mv.reverse().map(mM);
}

/* ===== Mesas, comandas e carrinho em aberto: guardados no Supabase + cópia no navegador ===== */
let estUlt='',estTimer=null,estAt=0;
const estKey=()=>'pdvfacil.estado.'+S.empId;
const estSnap=()=>({mesas:S.mesas,cmds:S.cmds,cn:S.cn,cart:S.cart,dsc:S.dsc,dt:S.dt});
function estApply(d){
 const itens=it=>(Array.isArray(it)?it:[]).filter(i=>S.prods.some(p=>p.id==i.id)&&i.q>0);
 const mesas={};
 for(let i=1;i<=S.nm;i++){const sv=d.mesas&&d.mesas[i];mesas[i]=sv?Object.assign(mk(),sv,{items:itens(sv.items)}):mk()}
 S.mesas=mesas;S.cmds={};
 Object.keys(d.cmds||{}).forEach(k=>{const c=d.cmds[k];S.cmds[k]=Object.assign({items:[],aberta:true,inv:false,hora:'',nome:'',cpf:'',g:null},c,{items:itens(c.items)})});
 S.cn=Math.max(+d.cn||0,0,...Object.keys(S.cmds).map(Number));
 S.cart={items:itens(d.cart&&d.cart.items)};S.dsc=+d.dsc||0;S.dt=d.dt=='R'?'R':'%';
}
async function carregarEstado(){
 let remoto=null,local=null;
 try{const r=await DBX(sb.from('estado_pdv').select('dados').maybeSingle());remoto=r&&r.dados}catch(e){console.warn('estado_pdv:',e)}
 try{local=JSON.parse(localStorage.getItem(estKey())||'null')}catch(e){}
 const d=[remoto,local].filter(x=>x&&x.snap).sort((a,b)=>(b.at||0)-(a.at||0))[0];
 if(d){try{estApply(d.snap);estAt=d.at||0}catch(e){console.warn('estado ignorado:',e)}}
 estUlt=JSON.stringify(estSnap());
 if(d&&d===local&&(!remoto||(remoto.at||0)<(local.at||0)))estPush();
}
function estSalvar(){
 if(!S.empId)return;
 const j=JSON.stringify(estSnap());if(j==estUlt)return;
 estUlt=j;estAt=Date.now();
 try{localStorage.setItem(estKey(),'{"at":'+estAt+',"snap":'+j+'}')}catch(e){}
 clearTimeout(estTimer);estTimer=setTimeout(estPush,600);
}
async function estPush(){
 estTimer=null;
 try{await DBX(sb.from('estado_pdv').upsert({empresa_id:S.empId,dados:{at:estAt,snap:estSnap()},atualizado_em:new Date().toISOString()},{onConflict:'empresa_id'}))}
 catch(e){console.warn('estado_pdv:',e);if(!estPush.w){estPush.w=1;toast('Mesas salvas só neste computador. Falta rodar o SQL do estado.')}}
}

/* ===== Configurações · certificado digital A1 ===== */
let cert=null,certPrev=null,certSub=false,certOk=true;
const FORGE='https://cdn.jsdelivr.net/npm/node-forge@1.3.1/dist/forge.min.js';
const loadForge=()=>new Promise((ok,no)=>{if(window.forge)return ok();const t=document.createElement('script');t.src=FORGE;t.onload=ok;t.onerror=()=>no(new Error('Não foi possível carregar o leitor de certificados'));document.head.appendChild(t)});
async function carregarCert(){
 try{const r=await DBX(sb.from('certificados_info').select('*').maybeSingle());certOk=true;
  cert=r?{titular:r.titular,cnpj:r.cnpj,emissor:r.emissor,de:new Date(r.valido_de),ate:new Date(r.valido_ate),nome:r.arquivo_nome}:null}
 catch(e){cert=null;certOk=false;console.warn('certificados_info:',e)}
}
async function lerPfx(file,senha){
 await loadForge();
 const buf=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('Não foi possível ler o arquivo'));r.readAsArrayBuffer(file)});
 const u=new Uint8Array(buf);let bin='';for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
 const O=forge.pki.oids;let p12;
 try{p12=forge.pkcs12.pkcs12FromAsn1(forge.asn1.fromDer(bin),false,senha)}
 catch(e){throw new Error(/mac|password|senha|decrypt/i.test(e.message||'')?'Senha incorreta. Confira e tente de novo.':'Não foi possível abrir o arquivo. Ele é um certificado .pfx ou .p12?')}
 const bags=t=>p12.getBags({bagType:t})[t]||[];
 const certs=bags(O.certBag).map(b=>b.cert).filter(Boolean),keys=[...bags(O.pkcs8ShroudedKeyBag),...bags(O.keyBag)].map(b=>b.key).filter(Boolean);
 if(!certs.length)throw new Error('O arquivo não contém nenhum certificado.');
 if(!keys.length)throw new Error('O arquivo não tem a chave privada. Exporte de novo marcando "Sim, exportar a chave privada".');
 const par=c=>keys.some(k=>{try{return k.n&&c.publicKey.n&&k.n.compareTo(c.publicKey.n)==0}catch(e){return false}});
 const c=certs.find(par)||certs[0];
 const cn=(c.subject.getField('CN')||{}).value||'',m=cn.match(/(\d{14})/);
 const sha=forge.md.sha1.create();sha.update(forge.asn1.toDer(forge.pki.certificateToAsn1(c)).getBytes());
 return{titular:cn.replace(/:?\d{14}$/,'').trim()||cn||'(sem nome)',cnpj:m?m[1]:null,emissor:(c.issuer.getField('CN')||c.issuer.getField('O')||{}).value||'',de:c.validity.notBefore,ate:c.validity.notAfter,impressao:sha.digest().toHex(),pfx64:btoa(bin),nome:file.name};
}
const certVerificar=once(async function(){
 const f=$('#certf')&&$('#certf').files[0],sn=$('#certs')&&$('#certs').value;
 if(!f)return toast('Escolha o arquivo do certificado (.pfx ou .p12)');
 if(!sn)return toast('Digite a senha do certificado');
 if(f.size>200000)return toast('Esse arquivo é grande demais para ser um certificado');
 try{certPrev=Object.assign(await lerPfx(f,sn),{senha:sn});render()}catch(e){toast(e.message)}
});
const certSalvar=once(async function(){
 const p=certPrev;if(!p)return;if(p.ate<new Date())return toast('Certificado vencido');
 try{
  await DBX(sb.rpc('salvar_certificado',{p_pfx_base64:p.pfx64,p_senha:p.senha,p_arquivo_nome:p.nome,p_titular:p.titular,p_cnpj:p.cnpj,p_emissor:p.emissor,p_valido_de:p.de.toISOString(),p_valido_ate:p.ate.toISOString(),p_impressao:p.impressao}));
  await carregarCert();certPrev=null;certSub=false;toast('Certificado salvo');render()
 }catch(e){e&&e.code=='PGRST202'?toast('Falta rodar o SQL do certificado no Supabase'):dbErr(e)}
});
const certRemover=once(async function(){
 if(!confirm('Remover o certificado desta empresa? Será preciso enviar de novo para emitir notas.'))return;
 try{await DBX(sb.rpc('remover_certificado'));cert=null;certSub=false;toast('Certificado removido');render()}catch(e){dbErr(e)}
});
let cfgTab='empresa';
const cfgKey=()=>`pdvfacil.config.${S.empId||'local'}`;
const cfgDefaults=()=>({
 empresa:{razao:'',fantasia:'',cnpj:'',ie:'',im:'',cnae:'',regime:'',cep:'',logradouro:'',numero:'',complemento:'',bairro:'',municipio:'',ibge:'',uf:'PE',telefone:'',email:'',site:'',cscId:'',cscToken:'',modelo:'65',ambiente:'homologacao',serie:'1',logoNome:''},
 impressoras:{recibo:'',cozinha:'',papel:'80',copias:'1',auto:'nao',pedidos:'sim',fechamento:'sim'},
 fiscal:{regime:'',modelo:'65',ambiente:'homologacao',uf:'PE',serie:'1',numero:'1',impostos:'',observacoes:'',emissao:'nao'},
 aparencia:{primaria:'#0f766e',secundaria:'#14b8a6'}
});
let CFG=null;
const cscKey=()=>'pdvfacil.csc.'+(S.empId||'local');
const hx=(v,f)=>/^#[0-9a-f]{6}$/i.test(v)?v:f;
function cfgMerge(x){const d=cfgDefaults();x=x&&typeof x=='object'?x:{};
 const o={...d,empresa:{...d.empresa,...x.empresa},impressoras:{...d.impressoras,...x.impressoras},fiscal:{...d.fiscal,...x.fiscal},aparencia:{...d.aparencia,...x.aparencia}};
 o.aparencia.primaria=hx(o.aparencia.primaria,d.aparencia.primaria);o.aparencia.secundaria=hx(o.aparencia.secundaria,d.aparencia.secundaria);
 delete o.empresa.cscToken;return o}
function cfgGet(){let x=CFG;if(!x){try{x=JSON.parse(localStorage.getItem(cfgKey())||'null')}catch(e){}}
 const d=cfgMerge(x);try{d.empresa.cscToken=localStorage.getItem(cscKey())||''}catch(e){d.empresa.cscToken=''}return d}
async function carregarConfig(){
 let r=null;
 try{const x=await DBX(sb.from('pdv_configuracoes').select('dados').eq('empresa_id',S.empId).maybeSingle());r=x&&x.dados}
 catch(e){console.warn('pdv_configuracoes:',e)}
 if(r){CFG=cfgMerge(r);try{localStorage.setItem(cfgKey(),JSON.stringify(CFG))}catch(e){}}
 try{localStorage.setItem('pdvfacil.aparencia',JSON.stringify({aparencia:cfgGet().aparencia}))}catch(e){}
}
async function cfgStore(d,msg='Configurações salvas neste navegador.'){
 const tk=d.empresa.cscToken||'',pub=cfgMerge(d);CFG=pub;
 try{localStorage.setItem(cfgKey(),JSON.stringify(pub));localStorage.setItem(cscKey(),tk);localStorage.setItem('pdvfacil.aparencia',JSON.stringify({aparencia:pub.aparencia}))}
 catch(e){toast('Não foi possível salvar as configurações neste navegador.')}
 if(sb&&S.empId){try{await DBX(sb.from('pdv_configuracoes').upsert({empresa_id:S.empId,dados:pub},{onConflict:'empresa_id'}));msg=msg.replace(' neste navegador','')}catch(e){dbErr(e);return}}
 toast(msg);applyAppearance();render()}
function cnpjOk(c){if(c.length!=14||/^(\d)\1+$/.test(c))return false;const f=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return f(12)==+c[12]&&f(13)==+c[13]}
function cfgVal(group,key){return esc(cfgGet()[group]?.[key]??'')}
function cfgField(label,id,placeholder='',type='text',full=false,extra=''){return `<div class="cfg-field ${full?'full':''}"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${cfgVal('empresa',id)}" placeholder="${placeholder}" ${extra}></div>`}
function cfgSaveEmpresa(){const d=cfgGet(),ids=['razao','fantasia','cnpj','ie','im','cnae','regime','cep','logradouro','numero','complemento','bairro','municipio','ibge','uf','telefone','email','site','cscId','cscToken','modelo','ambiente','serie'];ids.forEach(id=>{const e=$('#'+id);if(e)d.empresa[id]=e.value.trim()});const dg=d.empresa.cnpj.replace(/\D/g,'');if(dg&&!cnpjOk(dg))return toast('CNPJ inválido. Confira os 14 dígitos.');if(d.empresa.uf&&!/^[A-Za-z]{2}$/.test(d.empresa.uf))return toast('UF deve ter 2 letras.');d.empresa.uf=d.empresa.uf.toUpperCase();if(d.empresa.cep&&d.empresa.cep.replace(/\D/g,'').length!=8)return toast('CEP deve ter 8 dígitos.');cfgStore(d,'Dados da empresa salvos neste navegador.')}
function cfgSavePrinter(){const d=cfgGet();['recibo','cozinha','papel','copias','auto','pedidos','fechamento'].forEach(id=>{const e=$('#'+id);if(e)d.impressoras[id]=e.value});cfgStore(d,'Preferências de impressão salvas neste navegador.')}
function cfgSaveFiscal(){const d=cfgGet();['f_regime','f_modelo','f_ambiente','f_emissao','f_uf','f_serie','f_numero','f_impostos','f_observacoes'].forEach(id=>{const e=$('#'+id);if(e)d.fiscal[id.replace(/^f_/,'')]=e.value.trim()});cfgStore(d,'Preferências fiscais salvas neste navegador.')}

function applyAppearance(given){let d=given;try{if(!d)d=cfgGet()}catch(e){return}const root=document.documentElement;const dark=isDark();const primary=d.aparencia?.primaria||'#0f766e',secondary=d.aparencia?.secundaria||'#14b8a6';root.style.setProperty('--pr',dark?'#2dd4bf':primary);root.style.setProperty('--prt',dark?'#042f2a':'#ffffff');root.style.setProperty('--cfg-accent',secondary);root.style.setProperty('--user-primary',primary);root.style.setProperty('--user-secondary',secondary)}

function cfgImport(input){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);const d=x.dados||x;if(!d||typeof d!=='object')throw Error();if(!confirm('Importar as configurações deste arquivo e substituir as configurações locais atuais?'))return;const t=cfgGet().empresa.cscToken;const n=cfgMerge(d);n.empresa.cscToken=t;cfgStore(n,'Configurações importadas')}catch(e){toast('Arquivo inválido ou incompatível.')}};r.readAsText(f)}

${cfgField('Razão social','razao','Razão social', 'text',true,'autocomplete="organization"')}${cfgField('Nome fantasia','fantasia','Nome fantasia')}${cfgField('CNPJ','cnpj','00.000.000/0000-00','text',false,'inputmode="numeric"')}${cfgField('Inscrição Estadual (IE)','ie','Inscrição estadual')}${cfgField('Inscrição Municipal (IM)','im','Quando aplicável')}${cfgField('CNAE principal','cnae','Código CNAE')}

function vCfgCert(){return `<div class="card cfg"><h3>Certificado digital</h3><p>Gerencie o certificado A1 já integrado ao backend fiscal do sistema.</p>${certOk?'':'<p style="color:var(--wa)">Para guardar o certificado, falta rodar o SQL do certificado no Supabase.</p>'}${(()=>{const fmt=d=>d.toLocaleDateString('pt-BR'),cnpj=c=>c?c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'):'não identificado';const sit=a=>{const n=Math.ceil((a-Date.now())/864e5);return n<0?['r','Vencido há '+(-n)+(n==-1?' dia':' dias')]:n<=30?['w','Vence em '+n+(n==1?' dia':' dias')]:['','Válido · vence em '+n+' dias']};const info=c=>{const [k,t]=sit(c.ate);return `<div class="certbox"><div class="row"><span>Titular</span><b>${esc(c.titular)}</b></div><div class="row"><span>CNPJ</span><b>${cnpj(c.cnpj)}</b></div><div class="row"><span>Emitido por</span><b>${esc(c.emissor||'—')}</b></div><div class="row"><span>Validade</span><b>${fmt(c.de)} a ${fmt(c.ate)}</b></div><div class="row"><span>Situação</span><span class="tag ${k}">${t}</span></div></div>`};let body;if(certPrev)body=`<p>Confira os dados antes de salvar.</p>${info(certPrev)}<div class="frm"><button class="btn p" ${certPrev.ate<new Date()?'disabled':''} onclick="certSalvar()">Salvar certificado</button><button class="btn" onclick="certPrev=null;render()">Cancelar</button></div>`;else if(cert&&!certSub)body=`<p>Certificado desta empresa, pronto para a emissão de notas.</p>${info(cert)}<div class="frm"><button class="btn" onclick="certSub=true;render()">Substituir</button><button class="btn" onclick="certRemover()">Remover</button></div><p style="margin:12px 0 0;font-size:12px">O arquivo e a senha ficam guardados no servidor, criptografados, e não podem ser lidos por esta tela.</p>`;else body=`<p>Use o certificado <b>e-CNPJ modelo A1</b> (arquivo .pfx ou .p12) da empresa.</p><div class="frm cfgf"><input id="certf" type="file" accept=".pfx,.p12,application/x-pkcs12" aria-label="Arquivo do certificado"><input id="certs" type="password" autocomplete="off" placeholder="Senha do certificado" onkeydown="if(event.key=='Enter')certVerificar()"><button class="btn p" onclick="certVerificar()">Verificar</button>${certSub?'<button class="btn" onclick="certSub=false;render()">Cancelar</button>':''}</div><details class="how"><summary>Como exportar um certificado A1 no Windows</summary><ol><li>Aperte Windows + R e digite <b>certmgr.msc</b>.</li><li>Abra <b>Pessoal → Certificados</b> e localize o certificado da empresa.</li><li>Use <b>Todas as Tarefas → Exportar</b> e marque a opção de exportar a chave privada.</li><li>Escolha PFX, defina uma senha e selecione o arquivo nesta tela.</li></ol><p>Certificados A3 em token/cartão não podem ser exportados como A1.</p></details>`;return body})()}</div>`}

<div class="cfg-field full"><label for="f_impostos">Referência/observações tributárias</label><input id="f_impostos" value="${esc(d.impostos)}" placeholder="Não substitui a configuração tributária validada"></div><div class="cfg-field full"><label for="f_observacoes">Observações internas</label><input id="f_observacoes" value="${esc(d.observacoes)}" placeholder="Observações para o responsável fiscal"></div></div><div class="cfg-actions"><button class="btn p" onclick="cfgSaveFiscal()">Salvar preferências fiscais</button></div></section><section class="cfg-section"><h3>Checklist fiscal</h3><p class="hint">Antes de emitir em produção, confirme os requisitos com o responsável fiscal.</p><div class="row"><span>Dados cadastrais da empresa</span><span class="cfg-accent">Configurar em Empresa</span></div><div class="row"><span>Certificado digital</span><span>${cert?'Configurado':'Verificar'}</span></div><div class="row"><span>CSC e token da SEFAZ</span><span>Verificar</span></div><div class="row"><span>Ambiente de homologação</span><span>Testar</span></div><div class="cfg-note">Estas preferências são apenas informativas nesta versão do HTML e não alteram automaticamente o emissor fiscal. As regras e os parâmetros devem ser validados para a UF, o modelo e a legislação aplicáveis.</div></section></div>`}

async function sair(){if(estTimer){clearTimeout(estTimer);await estPush()}try{await sb.auth.signOut()}catch(e){}irLogin()}

/* ===== Login dentro do PDV (evita o vai e vem quando SB.login aponta para esta mesma página) ===== */
function irLogin(){new URL(SB.login,location.href).pathname!==location.pathname?location.replace(SB.login):location.reload()}
function telaLogin(){
 document.body.classList.add('nav-off');
 $('#main').innerHTML=`<div style="min-height:100%;display:grid;place-items:center;padding:16px"><form class="card" style="width:100%;max-width:360px;padding:22px" onsubmit="entrar(event)"><div class="brand" style="color:var(--tx);padding:0 0 16px"><i>P</i>PDV Fácil</div><h3 style="font-size:17px;margin:0 0 4px">Entrar no sistema</h3><p class="hint">Use o e-mail e a senha da sua conta.</p><div class="cfg-field" style="margin-bottom:10px"><label for="lge">E-mail</label><input id="lge" type="email" autocomplete="username" inputmode="email" required></div><div class="cfg-field"><label for="lgs">Senha</label><input id="lgs" type="password" autocomplete="current-password" required></div><div id="lgm" role="alert" style="color:var(--ba);min-height:20px;margin:10px 0 0;font-size:13px"></div><button id="lgb" class="btn p g" type="submit">Entrar</button></form></div>`;
 const e=$('#lge');e&&e.focus()}
async function entrar(ev){
 ev.preventDefault();
 const b=$('#lgb'),m=$('#lgm'),email=$('#lge').value.trim(),senha=$('#lgs').value;
 if(!email||!senha){m.textContent='Informe o e-mail e a senha.';return}
 b.disabled=true;b.textContent='Entrando…';m.textContent='';
 try{const {error}=await sb.auth.signInWithPassword({email,password:senha});if(error)throw error;location.reload()}
 catch(err){b.disabled=false;b.textContent='Entrar';const t=(err&&err.message)||String(err);
  m.textContent=/invalid login/i.test(t)?'E-mail ou senha incorretos.':/not confirmed/i.test(t)?'Confirme o e-mail antes de entrar.':'Não foi possível entrar: '+t}}
async function boot(){
 // Prévia local: permite conferir as telas de Configurações ao abrir o HTML baixado, sem exigir login/Supabase.
 if(location.protocol==='file:'){
  USER='Prévia local';
  view=location.hash=='#cozinha'?'coz':'cfg';kIniciar();
  document.title='PDV Fácil · Prévia das Configurações';
  const banner=document.getElementById('localPreviewBanner');
  if(banner)banner.style.display='block';
  render();
  return;
 }
 $('#main').innerHTML='<div class="card emp">Carregando…</div>';
 try{
  await loadSdk();
  sb=window.supabase.createClient(SB.url,SB.key);
  const {data}=await sb.auth.getSession();
  if(!data.session){if(new URL(SB.login,location.href).pathname!==location.pathname)location.replace(SB.login);else telaLogin();return}
  try{const {data:gu,error:ge}=await sb.auth.getUser();
   if((ge&&(ge.status===401||ge.status===403||ge.status===404||/does not exist|jwt|session/i.test(ge.message||'')))||(!ge&&gu&&!gu.user)){
    try{await sb.auth.signOut({scope:'local'})}catch(e){}
    irLogin();return}}catch(e){}
  USER=data.session.user.email||'';
  sb.auth.onAuthStateChange(ev=>{if(ev=='SIGNED_OUT')irLogin()});
  await carregar();
  await carregarConfig();
  await carregarEstado();
  await carregarCert();

const KSQL=`-- Cozinha: pedidos compartilhados entre o salão e a tela da cozinha
do $$
declare t text;
begin
  select format_type(a.atttypid, a.atttypmod) into t
  from pg_attribute a
  where a.attrelid = 'public.empresas'::regclass and a.attname = 'id';
  execute format(
    'create table if not exists public.cozinha_pedidos (
       id text primary key,
       empresa_id %s not null references public.empresas(id) on delete cascade,
       dados jsonb not null,
       status text not null default ''novo'',
       atualizado_em timestamptz not null default now())', t);
end $$;

create index if not exists cozinha_pedidos_emp_idx
  on public.cozinha_pedidos (empresa_id, atualizado_em desc);

alter table public.cozinha_pedidos enable row level security;
drop policy if exists cozinha_pedidos_empresa on public.cozinha_pedidos;
create policy cozinha_pedidos_empresa on public.cozinha_pedidos
  for all to authenticated
  using (empresa_id in (select id from public.empresas))
  with check (empresa_id in (select id from public.empresas));
grant select, insert, update, delete on public.cozinha_pedidos to authenticated;
notify pgrst, 'reload schema';`;

const kOk=n=>!!n&&typeof n.id=='string'&&/^k[a-z0-9]{4,40}$/.test(n.id)&&Array.isArray(n.it)&&(n.k=='m'||n.k=='c');
const kHm=ms=>new Date(ms).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const kMin=ms=>{const m=Math.floor(ms/6e4);return m<1?'agora':m+' min'};
const kDur=ms=>Math.max(1,Math.round(ms/6e4))+' min';
const kClock=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const kAge=t=>t.st=='pronto'?Date.now()-t.t2:t.st=='entregue'?(t.t3||t.u)-t.t0:Date.now()-t.t0;

const kCls=t=>t.st=='cancelado'?'s-l x':kLate(t)?'s-l':({novo:'s-n',prep:'s-p',pronto:'s-r',entregue:'s-d'}[t.st]||'');
const kGet=id=>S.coz.find(t=>t.id==id);

const kRd=(k,r)=>S.coz.some(t=>t.k==k&&+t.r==+r&&t.st=='pronto'&&!t.arq);

function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}return AC}

function bip(t){if(!K.som)return;const a=audio();if(!a)return;
 const seq=t=='pronto'?[[784,0],[988,.15],[1319,.3]]:[[660,0],[660,.22]];
 seq.forEach(([f,d])=>{const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+d;o.type='sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.35,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.22);o.start(s);o.stop(s+.25)})}

function kLocal(){try{localStorage.setItem(kKey(),JSON.stringify(S.coz))}catch(e){}}

async function kPush(t){
 if(!sb||!S.empId||K.remoto===false)return;
 try{await DBX(sb.from('cozinha_pedidos').upsert({id:t.id,empresa_id:S.empId,dados:t,status:t.st,atualizado_em:new Date(t.u).toISOString()},{onConflict:'id'}));K.off=false;if(K.remoto===null)K.remoto=true}
 catch(e){kFalhou(e)}

function kFalhou(e){
 const miss=e&&(['42P01','42501','PGRST205','PGRST204'].includes(e.code)||/does not exist|schema cache|could not find the table|row-level security/i.test(e.message||''));
 if(miss){if(K.remoto!==false){K.remoto=false;toast('Cozinha ligada só neste computador. Falta rodar o SQL da cozinha no Supabase.',6500);if(view=='coz')renderKeep()}}
 else{console.warn('cozinha_pedidos:',e);K.off=true}
 kPill()}
async function kPull(full){
 if(!sb||!S.empId||K.remoto===false)return;
 try{
  const desde=new Date(Date.now()-(full?24*36e5:5*6e4)).toISOString();
  const r=await DBX(sb.from('cozinha_pedidos').select('dados').eq('empresa_id',S.empId).gte('atualizado_em',desde).order('atualizado_em',{ascending:false}).limit(500));
  K.remoto=true;K.off=false;
  const L=(r||[]).map(x=>x.dados).filter(kOk),q0=K.quiet;K.quiet=!!full;kMerge(L,'remote');K.quiet=q0;
  if(full){const ids=new Set(L.map(t=>t.id)),lim=Date.now()-24*36e5;S.coz.filter(t=>!ids.has(t.id)&&(t.u||0)>lim).forEach(kPush)}
 }catch(e){kFalhou(e)}
 kPill()}
function kMerge(list,src){
 let mudou=false;
 list.forEach(n=>{if(!kOk(n))return;const i=S.coz.findIndex(t=>t.id==n.id),o=S.coz[i];
  if(!o){S.coz.push(n);mudou=true;kEvt(null,n)}
  else if((n.u||0)>(o.u||0)){
   // Não deixe um campo vazio apagar a observação que já existe no outro aparelho/versão.
   if(Array.isArray(n.it)&&Array.isArray(o.it)){n.it=n.it.map((ni,ix)=>{const oi=(o.it[ix]&&o.it[ix].id==ni.id&&String(o.it[ix].n||'')===String(ni.n||''))?o.it[ix]:null;if(!oi)return ni;const obsNova=[ni.o,ni.obs,ni.observacao,ni.comentario,ni.observacao_cozinha,ni.nota].find(v=>String(v??'').trim());const obsAntiga=[oi.o,oi.obs,oi.observacao,oi.comentario,oi.observacao_cozinha,oi.nota].find(v=>String(v??'').trim());const obs=String(obsNova??obsAntiga??'').trim();return {...ni,...(obs?{o:obs,obs,observacao:obs,comentario:obs,observacao_cozinha:obs}: {})}})}
   S.coz[i]=n;mudou=true;kEvt(o,n)}
  else if((n.u||0)<(o.u||0)&&src=='remote')kPush(o)});
 if(mudou){kLocal();kUi()}
 return mudou}

 kPoda();
 try{K.som=localStorage.getItem('pdvfacil.coz.som')!=='0'}catch(e){}
 window.addEventListener('storage',e=>{if(e.key!==kKey()||!e.newValue)return;try{kMerge(JSON.parse(e.newValue),'local')}catch(_){}});
 setInterval(kTick,1000);
 if(sb&&S.empId){kPull(true);let n=0;setInterval(()=>{if(document.hidden)return;n++;kPull(n%15==0)},4000)}
 document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(sb&&S.empId)kPull(true);if(view=='coz')kWake()})}
function kTick(){
 if(document.hidden)return;
 const now=Date.now();
 document.querySelectorAll('[data-since]').forEach(e=>{e.textContent=kMin(now-(+e.dataset.since))});
 if(view!='coz')return;
 const c=$('#kclock');if(c)c.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 const a=$('#kaud');if(a)a.style.display=(K.som&&(!AC||AC.state!='running'))?'':'none';
 let mudar=false;
 document.querySelectorAll('.kt[data-id]').forEach(el=>{const t=kGet(el.dataset.id);if(!t||t.st=='cancelado')return;
  const tm=el.querySelector('.kt-tm');if(tm){tm.textContent=kClock(kAge(t));tm.classList.toggle('w',kWarn(t)&&!kLate(t))}
  if(kLate(t)!=el.classList.contains('s-l'))mudar=true});
 if(mudar)renderKeep()}

/* --- ações da cozinha --- */
function kAv(id){const t=kGet(id);if(!t)return;const n=Date.now();
 if(t.st=='novo'){t.st='prep';t.t1=n}
 else if(t.st=='prep'){t.st='pronto';t.t2=n;t.it.forEach(i=>{i.ok=1})}
 else if(t.st=='pronto'){t.st='entregue';t.t3=n}
 kSave(t);renderKeep()}
function kVolta(id){const t=kGet(id);if(!t)return;
 if(t.st=='prep'){t.st='novo';t.t1=0;t.it.forEach(i=>{i.ok=0})}
 else if(t.st=='pronto'){t.st='prep';t.t2=0}
 else if(t.st=='entregue'){t.st='pronto';t.t2=t.t2||Date.now();t.t3=0}
 kSave(t);renderKeep()}
function kItem(id,x){const t=kGet(id);if(!t||!t.it[x])return;t.it[x].ok=t.it[x].ok?0:1;kSave(t);renderKeep()}
function kCiente(id){const t=kGet(id);if(!t)return;t.ack=1;kSave(t);renderKeep()}
function kFil_(f){kFil=f;renderKeep()}


/* --- trava da cozinha: só recebe pedidos depois de confirmar com o deslizador --- */
const kSt=()=>S.coz.find(t=>t.id=='kstatuscoz');
const kAberta=()=>!!(kSt()&&kSt().ab);
function kSetAberta(v){
 const t=kSt()||{id:'kstatuscoz',k:'c',r:0,lb:'Status da cozinha',g:'',ad:false,it:[],st:'config',t0:Date.now(),t1:0,t2:0,t3:0,arq:1};
 t.ab=v?1:0;K.pf=false;kSave(t);
 renderKeep();toast(v?'Cozinha aberta · recebendo pedidos':'Cozinha fechada · pedidos bloqueados',3200)}
function kPedeFechar(){K.pf=true;kLockUpdate()}
const KL_R=[220,38,38],KL_G=[22,163,74];
const klMix=p=>KL_R.map((r,i)=>Math.round(r+(KL_G[i]-r)*p)).join(',');
function kLockUpdate(){
 let el=document.getElementById('klock');
 const ab=kAberta(),show=view=='coz'&&(!ab||K.pf),key=show?(ab?'close':'open'):'';
 if(key===kLockUpdate.k&&(!key||el))return;
 kLockUpdate.k=key;
 if(!key){if(el)el.remove();return}
 if(!el){el=document.createElement('div');el.id='klock';el.className='klock';document.body.appendChild(el)}
 const abrir=key=='open';
 const arrow='<svg viewBox="0 0 24 24" style="'+(abrir?'':'transform:rotate(180deg)')+'"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
 el.innerHTML=`<div class="kl-c" role="dialog" aria-modal="true" aria-label="${abrir?'Cozinha fechada':'Cozinha aberta'}"><div class="kl-ic"><svg viewBox="0 0 24 24">${IC.cook}</svg></div><h2>${abrir?'Cozinha fechada':'Cozinha aberta'}</h2><p>${abrir?'O salão não consegue enviar pedidos enquanto a cozinha estiver fechada. Arraste o botão para a direita para confirmar que a cozinha está aberta para pedidos.':'A cozinha está recebendo pedidos do salão. Para parar de receber, arraste o botão para a esquerda.'}</p><div class="kl-sl"><span class="kl-tx">${abrir?'Arraste para abrir a cozinha':'Arraste para fechar a cozinha'}</span><div class="kl-th" role="button" tabindex="0" aria-label="${abrir?'Arrastar para abrir a cozinha. Também funciona com Enter.':'Arrastar para fechar a cozinha. Também funciona com Enter.'}">${arrow}</div></div><div class="kl-ac">${abrir?`<button class="btn" onclick="go('mesas')">${sv('back',18)} Voltar ao sistema</button>`:`<button class="btn" onclick="K.pf=false;kLockUpdate()">Manter aberta</button>`}</div></div>`;
 const sl=el.querySelector('.kl-sl'),th=el.querySelector('.kl-th'),c=el.querySelector('.kl-c'),tx=el.querySelector('.kl-tx'),h2=el.querySelector('h2'),pp=el.querySelector('p'),ico=el.querySelector('.kl-ic');
 let max=0,x=0,drag=false,sx=0,done=false;
 const paint=()=>{const p=max?(abrir?x/max:(max-x)/max):0,g=abrir?p:1-p;
  c.style.setProperty('--kc','rgb('+klMix(g)+')');th.style.transform='translateX('+x+'px)';tx.style.opacity=String(1-p*.85)};
 const setX=v=>{x=v;paint()};
 const medir=()=>{max=Math.max(0,sl.clientWidth-th.offsetWidth-12)};
 const fim=()=>{if(done)return;done=true;drag=false;th.classList.add('back');setX(abrir?max:0);
  tx.style.opacity='0';h2.textContent=abrir?'Cozinha aberta!':'Cozinha fechada';
  pp.textContent=abrir?'Pronto! Os pedidos do salão já chegam aqui.':'Os pedidos do salão ficam bloqueados.';
  setTimeout(()=>kSetAberta(abrir),600)};
 medir();setX(abrir?0:max);
 try{new ResizeObserver(()=>{if(drag||done)return;medir();setX(abrir?0:max)}).observe(sl)}catch(e){}
 th.addEventListener('pointerdown',e=>{if(done)return;medir();drag=true;sx=e.clientX-x;th.classList.remove('back');try{th.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
 th.addEventListener('pointermove',e=>{if(!drag)return;setX(Math.min(max,Math.max(0,e.clientX-sx)))});
 const solta=()=>{if(!drag)return;drag=false;const p=max?(abrir?x/max:(max-x)/max):0;
  if(p>=.92)fim();else{th.classList.add('back');setX(abrir?0:max)}};
 th.addEventListener('pointerup',solta);th.addEventListener('pointercancel',solta);
 th.addEventListener('keydown',e=>{if(e.key=='Enter'||e.key==' '||e.key==(abrir?'ArrowRight':'ArrowLeft')){e.preventDefault();fim()}});
}
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&K.pf&&kAberta()){K.pf=false;kLockUpdate()}});
/* aviso no salão quando a cozinha está fechada */
function kAvisoFechada(){
 if(document.getElementById('kaviso'))return;
 const el=document.createElement('div');el.id='kaviso';el.className='kav';
 const fecha=()=>el.remove();
 el.innerHTML=`<div class="kl-c" role="alertdialog" aria-modal="true" aria-label="Cozinha fechada"><div class="kl-ic"><svg viewBox="0 0 24 24">${IC.cook}</svg></div><h2>Cozinha fechada</h2><p>O pedido não foi enviado. A cozinha ainda não foi aberta para receber pedidos. Avise o responsável para abrir a cozinha e tente novamente.</p><div class="kl-ac"><button class="btn p" id="kav-ok">Entendi</button><button class="btn" id="kav-go">Ir para a cozinha</button></div></div>`;
 el.addEventListener('click',e=>{if(e.target===el)fecha()});
 document.body.appendChild(el);
 el.querySelector('#kav-ok').onclick=fecha;
 el.querySelector('#kav-go').onclick=()=>{fecha();go('coz')};
 el.querySelector('#kav-ok').focus()}

/* --- ações do salão --- */
function enviarCozinha(){
 if(ob&&$('#obt'))obSave();
 if(!kAberta()){kAvisoFechada();return}
 const m=G();if(!m||!cur)return;
 const novos=m.items.map(i=>{const obs=String([i.obs,i.o,i.observacao,i.comentario,i.observacao_cozinha,i.nota].find(v=>String(v??'').trim())??'').trim();return {id:i.id,n:P(i.id).nome,q:Math.max(0,(Number(i.q)||0)-(Number(i.env)||0)),ok:0,o:obs,obs,observacao:obs,comentario:obs,observacao_cozinha:obs}}).filter(x=>x.q>0);
 if(!novos.length)return toast('Tudo já foi enviado à cozinha');
 if(!m.aberta){m.aberta=true;m.hora=hm()}
 const n=Date.now(),t={id:'k'+n.toString(36)+Math.random().toString(36).slice(2,6),k:cur.k,r:+cur.id,lb:lbl(),g:gn(m)||'',ad:(m.ns||0)>0,it:novos,st:'novo',t0:n,t1:0,t2:0,t3:0,u:n};
 m.items.forEach(i=>{i.env=i.q});m.ns=(m.ns||0)+1;
 kSave(t);toast('Pedido enviado à cozinha · '+t.lb);render()}
function kEntrega(k,r){
 S.coz.filter(t=>t.k==k&&+t.r==+r&&t.st=='pronto'&&!t.arq).forEach(t=>{t.st='entregue';t.t3=Date.now();kSave(t)});
 toast('Entrega registrada');renderKeep()}
function kFree(k,id,cancel){
 const ids=k=='m'?((S.mesas[id]&&S.mesas[id].j)||[id]).map(Number):[+id];
 S.coz.filter(t=>t.k==k&&ids.includes(+t.r)&&!t.arq).forEach(t=>{if(cancel&&kAtivo(t))t.st='cancelado';t.arq=1;kSave(t)})}
function kRebind(all,b){
 const lb='Mesas '+all.join(' + ');
 S.coz.filter(t=>t.k=='m'&&!t.arq&&all.includes(+t.r)).forEach(t=>{t.r=b;t.lb=lb;kSave(t)})}

/* --- selos no salão e andamento na comanda --- */
function kChips(k,r){
 const L=S.coz.filter(t=>t.k==k&&+t.r==+r&&!t.arq&&kAtivo(t));if(!L.length)return'';
 const n=L.filter(t=>t.st=='novo'),p=L.filter(t=>t.st=='prep'),d=L.filter(t=>t.st=='pronto');
 let h='';
 if(d.length)h+=`<span class="kst s-r">${sv('ok',12)}${d.length>1?d.length+' pedidos prontos':'Pedido pronto'} · retirar</span>`;
 if(p.length){const s=Math.min(...p.map(t=>t.t1||t.t0));h+=`<span class="kst s-p">${sv('flame',12)}Em preparo · <span data-since="${s}">${kMin(Date.now()-s)}</span></span>`}
 if(n.length)h+=`<span class="kst s-n">Na fila da cozinha</span>`;
 return `<div class="kst-w">${h}</div>`+(d.length?`<button class="btn ent" onclick="event.stopPropagation();kEntrega('${k}',${+r})">Entregue</button>`:'')}
function kStrip(){
 if(!cur)return'';
 const L=S.coz.filter(t=>t.k==cur.k&&+t.r==+cur.id&&!t.arq&&t.st!='cancelado').sort((a,b)=>a.t0-b.t0);if(!L.length)return'';
 const nm={novo:['s-n','Na fila'],prep:['s-p','Em preparo'],pronto:['s-r','Pronto'],entregue:['s-d','Entregue']};
 return `<div class="kp"><h3>Cozinha</h3>${L.map(t=>{const s=nm[t.st]||nm.novo;return `<div class="kp-r ${s[0]}"><div><b>${t.ad?'Adicional':'Pedido'} · ${kHm(t.t0)}</b><small>${t.it.map(i=>i.q+'× '+esc(i.n)+(([i.o,i.obs,i.observacao,i.comentario,i.observacao_cozinha,i.nota].find(v=>String(v??'').trim()))?' ('+esc([i.o,i.obs,i.observacao,i.comentario,i.observacao_cozinha,i.nota].find(v=>String(v??'').trim()))+')':'')).join(', ')}</small></div><span class="kst ${s[0]}">${s[1]}</span>${t.st=='pronto'?`<button class="btn" onclick="kEntrega('${cur.k}',${+cur.id})">Entregue</button>`:''}</div>`}).join('')}</div>`}

/* --- tela da cozinha --- */
function kCard(t){
 const n=t.it.reduce((a,i)=>a+i.q,0),cx=t.st=='cancelado',cls=kCls(t);
 const tag=cx?'Cancelado':kLate(t)?'Atrasado':({novo:'Novo',prep:'Em preparo',pronto:'Pronto'}[t.st]||'');
 const bt={novo:['Iniciar preparo','var(--wa)','flame'],prep:['Marcar pronto','var(--ok)','ok'],pronto:['Entregue ao garçom','var(--tx)','ok']}[t.st]||['Ok','var(--tx)','ok'];
 const li=t.it.map((i,x)=>{
  const observacao=String([i.o,i.obs,i.observacao,i.comentario,i.observacao_cozinha,i.nota].find(v=>String(v??'').trim())??'').trim();
  const mk=t.st=='prep'?`<button class="kt-ck ${i.ok?'on':''}" onclick="kItem('${t.id}',${x})" aria-pressed="${!!i.ok}" aria-label="Marcar ${esc(i.n)} como feito">${sv('ok',18)}</button>`:`<span class="kt-dot"><i></i></span>`;
  return `<li class="${i.ok&&t.st=='prep'?'ok':''}">${mk}<b>${i.q}×</b><div class="kt-n"><span class="kt-nm">${esc(i.n)}</span>${observacao?`<em class="kt-o">⚠ ${esc(observacao)}</em>`:''}</div></li>`}).join('');
 const f=cx?`<button class="btn kt-b" style="--bc:var(--ba)" onclick="kCiente('${t.id}')">${sv('ok',20)}Ciente, não preparar</button>`
  :`<button class="btn kt-b" style="--bc:${bt[1]}" onclick="kAv('${t.id}')">${sv(bt[2],20)}${bt[0]}</button>${t.st!='novo'?`<button class="btn kt-u" onclick="kVolta('${t.id}')" aria-label="Voltar uma etapa" title="Voltar uma etapa">${sv('back',20)}</button>`:''}`;
 const meta=cx?'A mesa foi liberada. Pode descartar o pedido.':`${t.g?'Garçom '+esc(t.g)+' · ':''}enviado às ${kHm(t.t0)} · ${n} ${n==1?'item':'itens'}${t.st=='pronto'?' · esperando retirada':''}${t.ad?' <span class="kt-ad">Adicional</span>':''}`;
 return `<article class="kt ${cls}" data-id="${t.id}"><div class="kt-h"><b class="kt-t">${esc(t.lb)}</b><span class="tag">${tag}</span>${cx?'':`<span class="kt-tm ${kWarn(t)&&!kLate(t)?'w':''}">${kClock(kAge(t))}</span>`}</div><div class="kt-m">${meta}</div><ul class="kt-i">${li}</ul><div class="kt-f">${f}</div></article>`}
function vCoz(){
 const hoje=ms=>new Date(ms).toDateString()==new Date().toDateString();
 const nv=S.coz.filter(t=>t.st=='novo'||(t.st=='cancelado'&&!t.ack)).sort((a,b)=>a.t0-b.t0),
  pp=S.coz.filter(t=>t.st=='prep').sort((a,b)=>a.t0-b.t0),
  pr=S.coz.filter(t=>t.st=='pronto').sort((a,b)=>a.t2-b.t2),
  en=S.coz.filter(t=>t.st=='entregue'&&hoje(t.t3||t.u)).sort((a,b)=>(b.t3||b.u)-(a.t3||a.u)).slice(0,40),
  fe=S.coz.filter(t=>(t.st=='pronto'||t.st=='entregue')&&t.t2&&hoje(t.t2)),
  med=fe.length?fe.reduce((a,t)=>a+(t.t2-t.t0),0)/fe.length:0,
  nn=nv.filter(t=>t.st=='novo').length;
 const col=(c,h,l,v)=>`<section class="kcol ${c}" aria-label="${h}"><h2 class="kcol-h"><span class="kcol-dot"></span>${h}<b>${l.length}</b></h2><div class="kcol-b">${l.length?l.map(kCard).join(''):`<div class="emp card" style="grid-column:1/-1">${v}</div>`}</div></section>`;
 const all=kFil=='todos';
 const body=kFil=='entregue'
  ?`<div class="khis">${en.length?en.map(t=>`<div class="khr"><div><b>${esc(t.lb)}</b><small>${t.it.map(i=>i.q+'× '+esc(i.n)+(([i.o,i.obs,i.observacao,i.comentario,i.observacao_cozinha,i.nota].find(v=>String(v??'').trim()))?' ('+esc([i.o,i.obs,i.observacao,i.comentario,i.observacao_cozinha,i.nota].find(v=>String(v??'').trim()))+')':'')).join(' · ')}</small><small>Ficou pronto em ${kDur((t.t2||t.t3)-t.t0)} · entregue às ${kHm(t.t3||t.u)}</small></div><button class="btn" onclick="kVolta('${t.id}')">Reabrir</button></div>`).join(''):'<div class="emp card">Nenhuma entrega registrada hoje.</div>'}</div>`
  :`<div class="kcols ${all?'':'one'}">${all||kFil=='novo'?col('s-n','Novos',nv,'Nenhum pedido novo.'):''}${all||kFil=='prep'?col('s-p','Em preparo',pp,'Nada no fogo agora.'):''}${all||kFil=='pronto'?col('s-r','Prontos para retirar',pr,'Nenhum prato esperando o garçom.'):''}</div>`;
 const fl=[['todos','Todos',null],['novo','Novos',nn],['prep','Em preparo',pp.length],['pronto','Prontos',pr.length],['entregue','Entregues',en.length]];
 const sy=kSync(),aud=K.som&&(!AC||AC.state!='running');
 const foot=`<details class="how kfoot"><summary>Usar a cozinha em outro aparelho</summary><ol><li>No aparelho da cozinha, abra o PDV e entre com a mesma conta.</li><li>Toque no ícone do chapéu de cozinheiro no topo, ou abra o endereço terminando em <code>#cozinha</code>.</li><li>${K.remoto===true?'A sincronização já está ativa: o que o salão enviar aparece aqui em poucos segundos.':'Para sincronizar entre aparelhos, rode o SQL abaixo uma vez no SQL Editor do Supabase.'}</li></ol>${K.remoto===true?'':`<pre>${esc(KSQL)}</pre><button class="btn" onclick="kCopySql()">${sv('copy',16)} Copiar SQL</button>`}</details>`;
 return `<div class="kd"><header class="kh"><div class="kh-r1"><div class="kh-brand"><i>${ic('cook')}</i><h1>Cozinha <small style="opacity:.6;font-size:11px;font-weight:600">v8</small></h1></div><span class="ksy ${sy[0]}" id="ksy"><i></i>${sy[1]}</span>${kAberta()?`<button class="kop on" onclick="kPedeFechar()" title="Clique para fechar a cozinha"><i></i>Cozinha aberta</button>`:`<span class="kop off"><i></i>Cozinha fechada</span>`}<span class="kaud" id="kaud" style="display:${aud?'':'none'}">Toque na tela para ativar o som</span><span class="sp"></span><span class="kclock" id="kclock">${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span><button class="kbn" onclick="kSom()" aria-pressed="${K.som}" title="${K.som?'Desligar':'Ligar'} o som dos avisos">${sv(K.som?'spk':'spkx',20)}<span class="kbl">Som</span></button><button class="kbn" onclick="kFull()" title="Tela cheia">${sv('full',20)}<span class="kbl">Tela cheia</span></button><button class="kbn" onclick="go('mesas')">${sv('back',20)}<span>Voltar ao sistema</span></button></div><div class="kh-r2"><div class="kcs"><div class="kc s-n"><b>${nn}</b><small>novos</small></div><div class="kc s-p"><b>${pp.length}</b><small>em preparo</small></div><div class="kc s-r"><b>${pr.length}</b><small>prontos</small></div><div class="kc s-t"><b>${med?kDur(med):'—'}</b><small>tempo médio hoje</small></div></div><div class="kfs" role="group" aria-label="Filtrar pedidos">${fl.map(([k,l,c])=>`<button class="kfi ${kFil==k?'on':''}" aria-pressed="${kFil==k}" onclick="kFil_('${k}')">${l}${c!=null?' · '+c:''}</button>`).join('')}</div></div></header>${body}${foot}</div>`}

/* --- tema (agora em Configurações > Aparência) --- */
function setTema(t){const r=document.documentElement;
 if(t=='auto'){delete r.dataset.theme;try{localStorage.removeItem('th')}catch(e){}}
 else{r.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}}
 applyAppearance();render()}
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(!document.documentElement.dataset.theme){applyAppearance();render()}})}catch(e){}

function render(){
 nav();document.body.classList.toggle('kds',view=='coz');if(view=='coz')kWake();else kWakeOff();
 const rv=view=='mesas'&&S.seg=='varejo';
 const localBanner=location.protocol==='file:'&&view!='coz'?document.getElementById('localPreviewBanner'):null;
 const localBannerHtml=localBanner?localBanner.outerHTML.replace('style="display: block;"','style="display:block"'):'';
 $('#main').innerHTML=localBannerHtml+(rv?vVenda()+(pay?vPayV():''):({mesas:vSalao,pos:vPos,caixa:vCaixa,cad:vCad,cli:vCli,fin:vFin,cfg:vCfg,coz:vCoz})[view]()+(pay&&cur?vPay():''))+(cm?vCliForm():'')+(cv?vCliVer():'')+(help?vHelp():'')+(jn?vJoin():'')+(ob?vObs():'')+(docAsk?vDoc():'');
 if(rv||view=='pos'){cpfSt();hintQ()}
 if(cm)setTimeout(()=>{const e=$('#kn');e&&e.focus()});
 if(rv&&pay=='Dinheiro')setTimeout(()=>{const e=$('#rc');e&&e.focus()});
 if(ob&&!matchMedia('(pointer:coarse)').matches)setTimeout(()=>{const e=$('#obt');e&&e.focus()});
 if((rv||view=='pos')&&!pay&&!help&&!cm&&!cv&&!jn&&!ob&&!matchMedia('(pointer:coarse)').matches)setTimeout(()=>{const e=$('#bq');e&&e.focus()});
 estSalvar();
 kLockUpdate();
}
