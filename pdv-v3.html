let estUlt='',estTimer=null,estAt=0;
const estKey=()=>'pdvfacil.estado.'+S.empId;
const estSnap=()=>({mesas:S.mesas,cmds:S.cmds,cn:S.cn,cart:S.cart,dsc:S.dsc,dt:S.dt});
function estApply(d){
 const itens=it=>(Array.isArray(it)?it:[]).filter(i=>S.prods.some(p=>p.id==i.id)&&i.q>0);
 const mesas={};
 for(let i=1;i<=S.nm;i++){const sv=d.mesas&&d.mesas[i];mesas[i]=sv?Object.assign(mk(),sv,{items:itens(sv.items)}):mk()}
 S.mesas=mesas;S.cmds={};
 Object.keys(d.cmds||{}).forEach(k=>{const c=d.cmds[k];S.cmds[k]=Object.assign({items:[],aberta:true,inv:false,hora:'',nome:'',cpf:'',g:null},c,{items:itens(c.items)})});
 S.cn=Math.max(+d.cn||0,0,...Object.keys(S.cmds).map(Number));
 S.cart={items:itens(d.cart&&d.cart.items)};S.dsc=+d.dsc||0;S.dt=d.dt=='R'?'R':'%';
}
async function carregarEstado(){
 let remoto=null,local=null;
 try{const r=await DBX(sb.from('estado_pdv').select('dados').maybeSingle());remoto=r&&r.dados}catch(e){console.warn('estado_pdv:',e)}
 try{local=JSON.parse(localStorage.getItem(estKey())||'null')}catch(e){}
 const d=[remoto,local].filter(x=>x&&x.snap).sort((a,b)=>(b.at||0)-(a.at||0))[0];
 if(d){try{estApply(d.snap);estAt=d.at||0}catch(e){console.warn('estado ignorado:',e)}}
 estUlt=JSON.stringify(estSnap());
 if(d&&d===local&&(!remoto||(remoto.at||0)<(local.at||0)))estPush();
}
function estSalvar(){
 if(!S.empId)return;
 const j=JSON.stringify(estSnap());if(j==estUlt)return;
 estUlt=j;estAt=Date.now();
 try{localStorage.setItem(estKey(),'{"at":'+estAt+',"snap":'+j+'}')}catch(e){}
 clearTimeout(estTimer);estTimer=setTimeout(estPush,600);
}
async function estPush(){
 estTimer=null;
 try{await DBX(sb.from('estado_pdv').upsert({empresa_id:S.empId,dados:{at:estAt,snap:estSnap()},atualizado_em:new Date().toISOString()},{onConflict:'empresa_id'}))}
 catch(e){console.warn('estado_pdv:',e);if(!estPush.w){estPush.w=1;toast('Mesas salvas só neste computador. Falta rodar o SQL do estado.')}}
}

let cert=null,certPrev=null,certSub=false,certOk=true;
const FORGE='https://cdn.jsdelivr.net/npm/node-forge@1.3.1/dist/forge.min.js';
const loadForge=()=>new Promise((ok,no)=>{if(window.forge)return ok();const t=document.createElement('script');t.src=FORGE;t.onload=ok;t.onerror=()=>no(new Error('Não foi possível carregar o leitor de certificados'));document.head.appendChild(t)});
async function carregarCert(){
 try{const r=await DBX(sb.from('certificados_info').select('*').maybeSingle());certOk=true;
  cert=r?{titular:r.titular,cnpj:r.cnpj,emissor:r.emissor,de:new Date(r.valido_de),ate:new Date(r.valido_ate),nome:r.arquivo_nome}:null}
 catch(e){cert=null;certOk=false;console.warn('certificados_info:',e)}
}
async function lerPfx(file,senha){
 await loadForge();
 const buf=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('Não foi possível ler o arquivo'));r.readAsArrayBuffer(file)});
 const u=new Uint8Array(buf);let bin='';for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
 const O=forge.pki.oids;let p12;
 try{p12=forge.pkcs12.pkcs12FromAsn1(forge.asn1.fromDer(bin),false,senha)}
 catch(e){throw new Error(/mac|password|senha|decrypt/i.test(e.message||'')?'Senha incorreta. Confira e tente de novo.':'Não foi possível abrir o arquivo. Ele é um certificado .pfx ou .p12?')}
 const bags=t=>p12.getBags({bagType:t})[t]||[];
 const certs=bags(O.certBag).map(b=>b.cert).filter(Boolean),keys=[...bags(O.pkcs8ShroudedKeyBag),...bags(O.keyBag)].map(b=>b.key).filter(Boolean);
 if(!certs.length)throw new Error('O arquivo não contém nenhum certificado.');
 if(!keys.length)throw new Error('O arquivo não tem a chave privada. Exporte de novo marcando "Sim, exportar a chave privada".');
 const par=c=>keys.some(k=>{try{return k.n&&c.publicKey.n&&k.n.compareTo(c.publicKey.n)==0}catch(e){return false}});
 const c=certs.find(par)||certs[0];
 const cn=(c.subject.getField('CN')||{}).value||'',m=cn.match(/(\d{14})/);
 const sha=forge.md.sha1.create();sha.update(forge.asn1.toDer(forge.pki.certificateToAsn1(c)).getBytes());
 return{titular:cn.replace(/:?\d{14}$/,'').trim()||cn||'(sem nome)',cnpj:m?m[1]:null,emissor:(c.issuer.getField('CN')||c.issuer.getField('O')||{}).value||'',de:c.validity.notBefore,ate:c.validity.notAfter,impressao:sha.digest().toHex(),pfx64:btoa(bin),nome:file.name};
}

pe="password" autocomplete="off" placeholder="Senha do certificado" onkeydown="if(event.key=='Enter')certVerificar()"><button class="btn p" onclick="certVerificar()">Verificar</button>${certSub?'<button class="btn" onclick="certSub=false;render()">Cancelar</button>':''}</div><details class="how"><summary>Como exportar um certificado A1 no Windows</summary><ol><li>Aperte Windows + R e digite <b>certmgr.msc</b>.</li><li>Abra <b>Pessoal → Certificados</b> e localize o certificado da empresa.</li><li>Use <b>Todas as Tarefas → Exportar</b> e marque a opção de exportar a chave privada.</li><li>Escolha PFX, defina uma senha e selecione o arquivo nesta tela.</li></ol><p>Certificados A3 em token/cartão não podem ser exportados como A1.</p></details>`;return body})()}</div>`}

async function sair(){if(estTimer){clearTimeout(estTimer);await estPush()}try{await sb.auth.signOut()}catch(e){}location.replace(SB.login)}
async function boot(){
 // Prévia local: permite conferir as telas de Configurações ao abrir o HTML baixado, sem exigir login/Supabase.
 if(location.protocol==='file:'){
  USER='Prévia local';
  view='cfg';
  document.title='PDV Fácil · Prévia das Configurações';
  const banner=document.getElementById('localPreviewBanner');
  if(banner)banner.style.display='block';
  render();
  return;
 }
 $('#main').innerHTML='<div class="card emp">Carregando…</div>';
 try{
  await loadSdk();
  sb=window.supabase.createClient(SB.url,SB.key);
  const {data}=await sb.auth.getSession();
  if(!data.session){location.replace(SB.login);return}
  USER=data.session.user.email||'';
  sb.auth.onAuthStateChange(ev=>{if(ev=='SIGNED_OUT')location.replace(SB.login)});
  await carregar();
  await carregarConfig();
  await carregarEstado();
  await carregarCert();
  applyAppearance();
 }catch(e){
  $('#main').innerHTML='<div class="card emp">Não foi possível carregar os dados.<br><small>'+esc((e&&e.message)||e)+'</small><br><br><button class="btn p" onclick="location.reload()">Tentar de novo</button></div>';
  return;
 }
 render();
}

 frm(`<input id="pk" autocomplete="off" placeholder="Código (sugestão: ${proxCod()})"><input id="pn" placeholder="Nome do produto"><input id="pc" placeholder="Categoria"><input id="pp" type="number" step="0.01" placeholder="Preço"><input id="pe" type="number" min="0" placeholder="Estoque">`,'addProd()','Adicionar');
 const gbody=(S.garcons.length?`<div class="wrap"><table><tr><th>Garçom</th><th>Telefone</th><th>Em atendimento</th><th>Vendas</th><th></th></tr>${S.garcons.map(g=>{const s=gStat(g.id);return `<tr><td><b>${esc(g.nome)}</b></td><td>${fone(g.tel)}</td><td>${s.ab||'—'}</td><td>${s.n?s.n+' · '+R(s.t):'<small style="color:var(--mu)">nenhuma</small>'}</td><td style="text-align:right"><button class="btn" onclick="delGar(${g.id})">Excluir</button></td></tr>`}).join('')}</table></div>`:`<div class="emp">Nenhum garçom cadastrado. Cadastre abaixo: eles aparecerão para escolha nas mesas e comandas.</div>`)+frm(`<input id="gn" placeholder="Nome do garçom" autocomplete="off"><input id="gt" inputmode="tel" placeholder="Telefone (opcional)" autocomplete="off">`,'addGar()','Adicionar');
 const tb=rst()?ctab:'prod';
 return head('Cadastros')+`<div class="chips"><button class="chip ${tb=='prod'?'on':''}" onclick="ctab='prod';render()">Produtos (${S.prods.length})</button>${rst()?`<button class="chip ${tb=='gar'?'on':''}" onclick="ctab='gar';render()">Garçons (${S.garcons.length})</button>`:''}</div><div class="card">${tb=='gar'?gbody:body}</div>`
}
const rst=()=>S.seg!='varejo';
const gn=m=>{const g=S.garcons.find(x=>x.id==m.g);return g?g.nome:''};
const gtag=m=>rst()&&m.g&&gn(m)?' · '+esc(gn(m)):'';
const gStat=id=>{const v=S.mov.filter(x=>x.gid==id);return {n:v.length,t:v.reduce((a,x)=>a+x.val,0),ab:[...Object.values(S.mesas),...Object.values(S.cmds)].filter(o=>o.g==id).length}};
const addGar=once(async function(){const n=$('#gn').value.trim();if(!n)return toast('Informe o nome do garçom');
 try{const r=await DBX(sb.from('garcons').insert({nome:n,telefone:$('#gt').value.trim()}).select().single());S.garcons.push(mG(r));toast('Garçom cadastrado');render()}catch(e){dbErr(e)}});
const delGar=once(async function(id){if(gStat(id).ab)return toast('Garçom com atendimento em aberto');
 try{await DBX(sb.from('garcons').delete().eq('id',id));S.garcons=S.garcons.filter(g=>g.id!=id);render()}catch(e){dbErr(e)}});
function setG(v){G().g=+v||null;estSalvar()}
const addProd=once(async function(){const k=$('#pk').value.trim(),n=$('#pn').value.trim(),p=parseFloat($('#pp').value);
 if(!k)return toast('Informe o código do produto');if(!n||!p)return toast('Preencha nome e preço');if(codUsado(k))return toast('Código já usado em outro produto');
 try{const r=await DBX(sb.from('produtos').insert({nome:n,categoria:$('#pc').value.trim()||'Geral',preco:p,codigo:k,estoque:$('#pe').value===''?null:parseInt($('#pe').value)}).select().single());S.prods.push(mP(r));toast('Produto cadastrado');render();setTimeout(()=>{const e=$('#pk');e&&e.focus()})}catch(e){e&&e.code=='23505'?toast('Código já usado em outro produto'):dbErr(e)}});
const setCod=once(async function(id,el){const v=el.value.trim(),p=P(id);if(v==(p.cod||''))return;
 if(!v){el.value=p.cod||'';return toast('O código não pode ficar vazio')}
 if(codUsado(v,id)){el.value=p.cod||'';return toast('Código já usado em outro produto')}
 try{await DBX(sb.from('produtos').update({codigo:v}).eq('id',id));p.cod=v;el.value=v;toast('Código atualizado')}catch(e){el.value=p.cod||'';e&&e.code=='23505'?toast('Código já usado em outro produto'):dbErr(e)}});
const delP=once(async function(id){const used=[...Object.values(S.mesas),...Object.values(S.cmds),S.cart].some(o=>o.items.some(i=>i.id==id));if(used)return toast('Produto em uso em um atendimento aberto');
 try{await DBX(sb.from('produtos').delete().eq('id',id));S.prods=S.prods.filter(p=>p.id!=id);render()}catch(e){dbErr(e)}});

const compras=c=>S.mov.filter(x=>x.cat=='Vendas'&&(x.cid==c.id||(!x.cid&&x.cpf&&x.cpf==c.cpf)));
const fone=t=>t&&t!='—'?esc(t):'—';
function cliRows(){
 const t=cq.trim().toLowerCase(),td=dg(cq),l=S.clientes.filter(c=>!t||c.nome.toLowerCase().includes(t)||(c.tel||'').toLowerCase().includes(t)||(td&&(c.cpf||'').includes(td))).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
 if(!l.length)return `<div class="emp">${S.clientes.length?'Nenhum cliente encontrado.':'Nenhum cliente cadastrado ainda.'}</div>`;
 return `<div class="wrap"><table><tr><th>Nome</th><th>Telefone</th><th>CPF</th><th>Compras</th><th></th></tr>${l.map(c=>{const v=compras(c),tt=v.reduce((a,x)=>a+x.val,0);return `<tr><td><b>${esc(c.nome)}</b></td><td>${fone(c.tel)}</td><td>${c.cpf?fcpf(c.cpf):'—'}</td><td>${v.length?`${v.length} · ${R(tt)}`:'<small style="color:var(--mu)">nenhuma</small>'}</td><td style="white-space:nowrap;text-align:right"><button class="btn" onclick="cv=${c.id};render()">Ver</button> <button class="btn" onclick="cm={id:${c.id}};render()">Editar</button> <button class="btn" onclick="delCli(${c.id})">Excluir</button></td></tr>`}).join('')}</table></div>`
}
function vCli(){
 const n=S.clientes.length,comp=S.clientes.filter(c=>compras(c).length).length;
 return head('Clientes','<button class="btn p" onclick="cm={id:null};render()">+ Novo cliente</button>')+kp([['Clientes cadastrados',n],['Já compraram',comp],['Sem compras',n-comp]])+
 `<div class="card"><input id="cqi" class="srch" placeholder="Buscar por nome, CPF ou telefone" value="${esc(cq)}" oninput="cq=this.value;$('#cl').innerHTML=cliRows()"><div id="cl">${cliRows()}</div></div>`
}
function vCliForm(){
 const c=cm.id?S.clientes.find(k=>k.id==cm.id):{nome:'',tel:'',cpf:'',email:'',obs:''};
 return `<div class="mod" onclick="cm=null;render()"><div class="card" onclick="event.stopPropagation()"><h3>${cm.id?'Editar cliente':'Novo cliente'}</h3>
 <div class="frm" style="flex-direction:column;margin-top:0"><input id="kn" placeholder="Nome completo" value="${esc(c.nome)}" autocomplete="off"><input id="kc" inputmode="numeric" placeholder="CPF" value="${fcpf(c.cpf||'')}" oninput="this.value=fcpf(dg(this.value))" autocomplete="off"><input id="kt" inputmode="tel" placeholder="Telefone" value="${c.tel&&c.tel!='—'?esc(c.tel):''}"><input id="ke" type="email" placeholder="E-mail (opcional)" value="${esc(c.email||'')}"><input id="ko" placeholder="Observações (opcional)" value="${esc(c.obs||'')}"></div>
 <button class="btn p g" onclick="saveCli()">${cm.id?'Salvar alterações':'Cadastrar cliente'}</button><button class="btn g" onclick="cm=null;render()">Cancelar</button></div></div>`
}
function vCliVer(){
 const c=S.clientes.find(k=>k.id==cv);if(!c)return '';
 const v=compras(c),tt=v.reduce((a,x)=>a+x.val,0),row=(l,x)=>`<div class="row"><span style="color:var(--mu)">${l}</span><span style="text-align:right">${x}</span></div>`;
 return `<div class="mod" onclick="cv=null;render()"><div class="card" onclick="event.stopPropagation()" style="max-height:90vh;overflow:auto"><h3>${esc(c.nome)}</h3>
 ${row('CPF',c.cpf?fcpf(c.cpf):'—')}${row('Telefone',fone(c.tel))}${row('E-mail',c.email?esc(c.email):'—')}${row('Observações',c.obs?esc(c.obs):'—')}
 <h3 style="margin-top:14px">Compras · ${v.length} · ${R(tt)}</h3>
 ${v.length?`<div class="wrap"><table><tr><th>Hora</th><th>Forma</th><th>Valor</th></tr>${v.slice().reverse().map(x=>`<tr><td>${x.t}</td><td>${x.forma}</td><td>${R(x.val)}</td></tr>`).join('')}</table></div>`:'<p class="hint">Este cliente ainda não tem compras.</p>'}
 <button class="btn p g" onclick="cm={id:${c.id}};cv=null;render()">Editar</button><button class="btn g" onclick="cv=null;render()">Fechar</button></div></div>`
}
const saveCli=once(async function(){
 const n=$('#kn').value.trim(),c=dg($('#kc').value);
 if(!n)return toast('Informe o nome');
 if(!c)return toast('Informe o CPF');
 if(!okCpf(c))return toast('CPF inválido');
 if(S.clientes.some(k=>k.cpf==c&&k.id!=cm.id))return toast('CPF já cadastrado');
 const d={nome:n,cpf:c,telefone:$('#kt').value.trim(),email:$('#ke').value.trim(),obs:$('#ko').value.trim()};
 try{
  if(cm.id){const r=await DBX(sb.from('clientes').update(d).eq('id',cm.id).select().single());Object.assign(S.clientes.find(k=>k.id==cm.id),mC(r))}
  else{const r=await DBX(sb.from('clientes').insert(d).select().single());S.clientes.push(mC(r))}
  toast(cm.id?'Cliente atualizado':'Cliente cadastrado');cm=null;render()
 }catch(e){e&&e.code=='23505'?toast('CPF já cadastrado'):dbErr(e)}
});
const delCli=once(async function(id){
 const c=S.clientes.find(k=>k.id==id);if(!c||!confirm('Excluir "'+c.nome+'"? O histórico de compras continua no caixa.'))return;
 try{await DBX(sb.from('clientes').delete().eq('id',id));S.clientes=S.clientes.filter(k=>k.id!=id);toast('Cliente excluído');render()}catch(e){dbErr(e)}
});
function vFin(){
 const rec=sum(x=>x.cat=='Vendas'),des=sum(x=>x.tipo=='out'&&x.cat!='Sangria');
 const fm=['Pix','Cartão','Dinheiro','Vale'].map(f=>[f,sum(x=>x.cat=='Vendas'&&x.forma==f)]),mx=Math.max(1,...fm.map(x=>x[1]));
 return head('Financeiro')+kp([['Receitas · 90 dias',R(rec)],['Despesas · 90 dias',R(des)],['Resultado · 90 dias',R(rec-des)]])+
 `<div class="pos" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><h3>Vendas por forma de pagamento</h3>${fm.map(([f,v])=>`<div style="margin-bottom:10px"><div class="row"><span>${f}</span><b>${R(v)}</b></div><div class="bar" style="width:${v/mx*100}%"></div></div>`).join('')}</div>
 <div class="card"><h3>Lançar despesa</h3><div class="frm"><input id="fd" placeholder="Descrição"><input id="fv" type="number" step="0.01" placeholder="Valor"><select id="fc2"><option>Insumos</option><option>Pessoal</option><option>Aluguel</option><option>Contas</option><option>Outros</option></select><button class="btn p" onclick="addDes()">Lançar</button></div></div></div>
 <div class="card" style="margin-top:14px"><h3>Lançamentos</h3>${tbl(S.mov.slice().reverse())}</div>`
}
const addDes=once(async function(){const v=parseFloat($('#fv').value);if(!v||v<=0)return toast('Informe o valor');
 try{S.mov.push(await addMov({desc:$('#fd').value||'Despesa',tipo:'out',val:v,forma:'Banco',cat:$('#fc2').value}));render()}catch(e){dbErr(e)}});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const t=localStorage.getItem('th');if(t)document.documentElement.dataset.theme=t}catch(e){}
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t=='dark':matchMedia('(prefers-color-scheme:dark)').matches};
try{const a=localStorage.getItem('pdvfacil.aparencia');if(a){const z=JSON.parse(a);if(z.aparencia){document.documentElement.style.setProperty('--pr',isDark()?'#2dd4bf':z.aparencia.primaria||'#0f766e');document.documentElement.style.setProperty('--cfg-accent',z.aparencia.secundaria||'#14b8a6')}}}catch(e){}
function tth(){const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}applyAppearance();render()}
const dsc=s=>Math.min(s,S.dt=='%'?s*S.dsc/100:S.dsc);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const codUsado=(k,id)=>S.prods.some(p=>p.id!=id&&p.cod&&norm(p.cod)==norm(k));
const proxCod=()=>Math.max(100,...S.prods.map(p=>/^\d+$/.test(p.cod||'')?+p.cod:0))+1;
const parseQ=raw=>{const t=raw.trim(),full=S.prods.some(p=>p.cod&&norm(p.cod)==norm(t)),m=!full&&t.match(/^(\d+)\s*\*\s*(.*)$/);return m?{n:Math.min(+m[1]||1,999),t:m[2].trim()}:{n:1,t}};
function achar(t){const k=norm(t);if(!k)return[];const sc=p=>{const c=norm(p.cod),n=norm(p.nome);return c==k?0:c&&c.startsWith(k)?1:n.startsWith(k)?2:n.includes(k)?3:c&&c.includes(k)?4:9};return S.prods.map(p=>[sc(p),p]).filter(a=>a[0]<9).sort((a,b)=>a[0]-b[0]||a[1].nome.localeCompare(b[1].nome)).map(a=>a[1])}
const pgrid=(fn='vAdd')=>{const t=parseQ(q).t,ps=t?achar(t):S.prods.filter(p=>cat=='Todos'||p.cat==cat);
 return ps.length?ps.map(p=>{const z=fn=='vAdd'&&p.est===0;return `<button class="prod ${z?'z':''}" onclick="${fn}(${p.id})">${p.cod?`<small class="cd">${esc(p.cod)}</small>`:''}<b>${esc(p.nome)}</b><span>${R(p.preco)}</span>${fn=='vAdd'&&p.est!=null?`<br><span class="bd ${z?'z':p.est<=5?'':'n'}">${z?'Sem estoque':p.est+' un.'}</span>`:''}</button>`}).join(''):'<div class="emp">Nenhum produto encontrado.</div>'};
function hintQ(){const e=$('#qh');if(!e)return;const {n,t}=parseQ(q);if(!t){e.innerHTML='Digite o código e tecle <b>Enter</b> · <b>3*101</b> lança 3 unidades';return}const r=achar(t),ex=r.filter(p=>p.cod&&norm(p.cod)==norm(t)),p=ex.length==1?ex[0]:r.length==1?r[0]:null;e.innerHTML=p?`<b>Enter</b> adiciona ${n>1?n+' × ':''}<b>${esc(p.nome)}</b> · ${R(p.preco)}`:r.length?`${r.length} produtos · digite o código completo`:'Nenhum produto com esse código ou nome'}
function bqIn(fn){q=$('#bq').value;$('#pg').innerHTML=pgrid(fn);hintQ()}
function vVenda(){
 const c=S.cart,sub=tot(c),d=dsc(sub),qtd=c.items.reduce((a,i)=>a+i.q,0),cats=['Todos',...new Set(S.prods.map(p=>p.cat))];
 const vs=S.mov.filter(x=>x.cat=='Vendas'),fat=vs.reduce((a,x)=>a+x.val,0),low=S.prods.filter(p=>p.est!=null&&p.est<=5).length;
 const left=S.prods.length?`<input id="bq" class="srch" autocomplete="off" placeholder="Código ou nome do produto (F2)" value="${esc(q)}" oninput="bqIn('vAdd')" onkeydown="if(event.key=='Enter')bar()"><div class="qh" id="qh"></div><div class="chips">${cats.map(x=>`<button class="chip ${x==cat?'on':''}" onclick="cat='${x}';render()">${x}</button>`).join('')}</div><div class="grid" id="pg">${pgrid()}</div>`:`<div class="card emp">Nenhum produto cadastrado ainda.<br><br><button class="btn p" onclick="go('cad')">Ir para Cadastros</button></div>`;
 return head('Venda rápida')+kp([['Vendas hoje',vs.length],['Faturamento',R(fat)],['Ticket médio',R(fat/Math.max(1,vs.length))],['Estoque baixo',low]])+
 `<p class="hint">F2 buscar · F3 CPF · F4 finalizar · F6 desconto · F9 limpar · F1 todos os atalhos</p><div class="pos"><div>${left}</div><div class="card" style="align-self:start"><h3>Carrinho · ${qtd} ${qtd==1?'item':'itens'}</h3>${c.items.length?c.items.map(i=>{const p=P(i.id);return `<div class="it"><div><b>${esc(p.nome)}</b><br><small style="color:var(--mu)">${R(p.preco)}</small></div><div class="q"><button onclick="vChg(${i.id},-1)" aria-label="Diminuir">−</button>${i.q}<button onclick="vChg(${i.id},1)" aria-label="Aumentar">+</button></div><b>${R(p.preco*i.q)}</b></div>`}).join(''):'<p style="color:var(--mu)">Digite o código ou toque nos produtos.</p>'}
 <div style="margin-top:12px"><input id="cpf" style="width:100%" inputmode="numeric" autocomplete="off" placeholder="CPF do cliente (F3)" value="${fcpf(S.cpf)}" oninput="cpfIn(this)"><div id="cs" style="margin-top:6px"></div></div>
 <div class="frm"><input id="dv" type="number" min="0" step="0.01" placeholder="Desconto (F6)" value="${S.dsc||''}" onchange="S.dsc=Math.max(0,+this.value||0);render()"><select onchange="S.dt=this.value;render()"><option value="%" ${S.dt=='%'?'selected':''}>%</option><option value="R" ${S.dt=='R'?'selected':''}>R$</option></select></div>
 <div class="row" style="margin-top:10px"><span>Subtotal</span><span>${R(sub)}</span></div><div class="row"><span>Desconto</span><span>− ${R(d)}</span></div><div class="row tot"><span>Total</span><span>${R(sub-d)}</span></div>
 <button class="btn p g" ${c.items.length?'':'disabled'} onclick="pay='Pix';render()">Finalizar venda (F4)</button><button class="btn g" ${c.items.length?'':'disabled'} onclick="limpa()">Limpar carrinho (F9)</button></div></div>`
}
function bar(){const mesa=view=='pos',{n,t}=parseQ(q);if(!t)return;const r=achar(t),ex=r.filter(p=>p.cod&&norm(p.cod)==norm(t)),p=ex.length==1?ex[0]:r.length==1?r[0]:null;
 if(!p)return toast(r.length?'Vários produtos: digite o código completo':'Código ou produto não encontrado');
 q='';(mesa?add:vAdd)(p.id,n);const x=$('#bq');x&&x.focus()}
function vAdd(id,n=1){const p=P(id),i=S.cart.items.find(x=>x.id==id),k=(i?i.q:0)+n;if(p.est!=null&&k>p.est)return toast(p.est?'Estoque insuficiente':'Produto sem estoque');i?i.q=k:S.cart.items.push({id,q:n});render()}
function vChg(id,d){const i=S.cart.items.find(x=>x.id==id),p=P(id);if(d>0&&p.est!=null&&i.q+1>p.est)return toast('Estoque insuficiente');i.q+=d;if(i.q<1)S.cart.items=S.cart.items.filter(x=>x!=i);render()}

const fecharV=once(async function(){const s=tot(S.cart),v=s-dsc(s);if(S.cpf&&!okCpf(S.cpf))return toast('CPF inválido. Corrija ou apague');if(pay=='Dinheiro'&&(+(($('#rc')||{}).value)||0)<v-.001)return toast('Valor recebido menor que o total');
 const c=cl();
 try{S.mov.push(await addMov({desc:'Venda'+(c?' · '+c.nome:''),tipo:'in',val:v,forma:pay,cat:'Vendas',cpf:S.cpf,cid:c?c.id:null}))}catch(e){return dbErr(e)}
 const bx=[];S.cart.items.forEach(i=>{const p=P(i.id);if(p.est!=null){p.est-=i.q;bx.push(DBX(sb.from('produtos').update({estoque:p.est}).eq('id',p.id)))}});
 try{await Promise.all(bx)}catch(e){dbErr(e)}
 S.cart={items:[]};S.dsc=0;S.cpf='';pay=null;toast('Venda registrada');render()})
const dg=s=>String(s).replace(/\D/g,'').slice(0,11);
const fcpf=d=>d.replace(/(\d{3})(\d{0,3})(\d{0,3})(\d{0,2})/,(m,a,b,c,e)=>a+(b?'.'+b:'')+(c?'.'+c:'')+(e?'-'+e:''));
function okCpf(c){if(c.length!=11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);if((s*10%11)%10!=c[t])return false}return true}
const cl=()=>S.cpf.length==11?S.clientes.find(k=>k.cpf==S.cpf):null;
function cpfIn(e){const d=dg(e.value);e.value=fcpf(d);S.cpf=d;if(view=='pos'&&cur)G().cpf=d;cpfSt();estSalvar()}
function cpfSt(){const e=$('#cs');if(!e)return;const d=S.cpf,c=cl();
 e.innerHTML=!d?'<small style="color:var(--mu)">Opcional. Digite o CPF para puxar o cliente do cadastro.</small>':d.length<11?'':!okCpf(d)?'<small style="color:var(--ba)">CPF inválido</small>':c?`<div style="background:var(--okb);border-radius:8px;padding:8px 10px"><small style="color:var(--ok)">✓ Cliente cadastrado</small><br><b>${esc(c.nome)}</b>${c.tel&&c.tel!='—'?`<br><small style="color:var(--mu)">${esc(c.tel)}</small>`:''}</div>`:`<small style="color:var(--wa)">CPF não cadastrado. Cadastre agora:</small><div class="frm" style="margin:6px 0 0"><input id="cn2" placeholder="Nome" autocomplete="off"><input id="ct2" inputmode="tel" placeholder="Telefone (opcional)" autocomplete="off"><button class="btn" onclick="cpfCad()">Cadastrar</button></div>`}
function cpfCad(){const n=$('#cn2').value.trim();if(!n)return toast('Informe o nome');S.clientes.push({id:++S.kid,nome:n,tel:$('#ct2').value.trim()||'—',cpf:S.cpf,email:'',obs:''});toast('Cliente cadastrado');cpfSt()}
function limpa(){S.cart={items:[]};S.dsc=0;S.cpf='';render()}
function vHelp(){const L=[['F1','Mostrar ou fechar atalhos'],['F2','Buscar produto ou digitar o código'],['F3','CPF do cliente'],['F4','Finalizar venda'],['F6','Desconto'],['F9','Limpar carrinho'],['1 a 4','Forma de pagamento'],['Enter','Confirmar pagamento'],['Esc','Fechar janela ou voltar'],['Alt + 1 a 6','Venda, Caixa, Cadastros, Clientes, Financeiro, Configurações']];
 return `<div class="mod" onclick="help=false;render()"><div class="card" onclick="event.stopPropagation()"><h3>Atalhos do teclado</h3>${L.map(([a,b])=>`<div class="row"><span>${b}</span><span class="kb">${a}</span></div>`).join('')}<button class="btn g" onclick="help=false;render()">Fechar</button></div></div>`}
document.addEventListener('keydown',e=>{
 const k=e.key,t=e.target,typing=/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName),rv=view=='mesas'&&S.seg=='varejo',f=id=>{e.preventDefault();const x=$(id);x&&x.focus()};
 if(k=='F1'){e.preventDefault();help=!help;return render()}
 if(k=='Escape'){if(jn)jn=null;else if(help)help=false;else if(pay)pay=null;else if(cm)cm=null;else if(cv)cv=null;else if(view=='pos')return go('mesas');else return;return render()}
 if(e.altKey&&['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6'].includes(e.code)){e.preventDefault();return go(['mesas','caixa','cad','cli','fin','cfg'][+e.code.slice(5)-1])}
 if(jn){if(k=='Enter'){e.preventDefault();confirmJoin()}return}
 if(help)return;
 if(pay){
  if(k=='Enter'&&t.tagName!='BUTTON'){e.preventDefault();return rv?fecharV():fechar()}
  const fm=rv?['Pix','Débito','Crédito','Dinheiro']:['Pix','Cartão','Dinheiro','Vale'];
  if(!typing&&'1234'.includes(k)&&k.length==1){pay=fm[+k-1];render()}
  return}
 if(rv){
  if(k=='F2')f('#bq');else if(k=='F3')f('#cpf');else if(k=='F6')f('#dv');
  else if(k=='F4'&&S.cart.items.length){e.preventDefault();pay='Pix';render()}
  else if(k=='F9'){e.preventDefault();limpa()}
 }else if(view=='pos'&&k=='F3')f('#cpf');else if(view=='pos'&&k=='F2')f('#bq');
 else if(view=='pos'&&k=='F4'&&G().items.length){e.preventDefault();pay='Pix';render()}
});
function render(){
 nav();
 const rv=view=='mesas'&&S.seg=='varejo';
 const localBanner=location.protocol==='file:'?document.getElementById('localPreviewBanner'):null;
 const localBannerHtml=localBanner?localBanner.outerHTML.replace('style="display: block;"','style="display:block"'):'';
 $('#main').innerHTML=localBannerHtml+(rv?vVenda()+(pay?vPayV():''):({mesas:vSalao,pos:vPos,caixa:vCaixa,cad:vCad,cli:vCli,fin:vFin,cfg:vCfg})[view]()+(pay&&cur?vPay():''))+(cm?vCliForm():'')+(cv?vCliVer():'')+(help?vHelp():'')+(jn?vJoin():'');
 if(rv||view=='pos'){cpfSt();hintQ()}
 if(cm)setTimeout(()=>{const e=$('#kn');e&&e.focus()});
 if(rv&&pay=='Dinheiro')setTimeout(()=>{const e=$('#rc');e&&e.focus()});
 if((rv||view=='pos')&&!pay&&!help&&!cm&&!cv&&!jn&&!matchMedia('(pointer:coarse)').matches)setTimeout(()=>{const e=$('#bq');e&&e.focus()});
 estSalvar();
}
boot();
</script>
</body>
</html>
