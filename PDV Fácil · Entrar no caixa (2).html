<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDV Fácil · Entrar no caixa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Ctext x='16' y='23.5' font-family='Arial,Helvetica,sans-serif' font-size='21' font-weight='700' text-anchor='middle' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e3eaee;--slot:#1c2736;--paper:#0d3b38;--ink:#d5f3ee;--mute:#86b5ae;--line:rgba(213,243,238,.28);--pr:#2dd4bf;--prt:#042f2a;--err:#fca5a5;--errb:rgba(220,38,38,.2);--okb:rgba(45,212,191,.16);
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--slot:#02050a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--slot:#02050a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);display:grid;place-items:center;overflow-x:hidden;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.stage{width:min(100% - 24px,400px);padding:24px 0}
.slot{height:14px;border-radius:7px;background:var(--slot);position:relative;z-index:2;margin-bottom:-6px;box-shadow:inset 0 -2px 0 rgba(255,255,255,.08)}
.wrap{margin:0 14px;filter:drop-shadow(0 14px 16px rgba(0,0,0,.28))}
.ticket{position:relative;background:var(--paper);color:var(--ink);padding:30px 24px 26px;font:13px/1.5 "IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;clip-path:inset(0 -12px -14px -12px)}
.ticket::after{content:"";position:absolute;left:0;right:0;top:100%;height:8px;background:var(--paper);-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%}
.ticket.print{animation:print 1.1s steps(16,end) both}
@keyframes print{from{clip-path:inset(0 -12px 100% -12px)}to{clip-path:inset(0 -12px -14px -12px)}}
.ticket.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){.ticket.print,.ticket.shake{animation:none}}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px}
.brand i{width:44px;height:44px;border-radius:12px;background:var(--pr);color:var(--prt);display:grid;place-items:center;font:700 26px Arial,Helvetica,sans-serif;font-style:normal}
.brand b{font:700 20px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.01em}
.cut{border:0;border-top:1.5px dashed var(--line);margin:20px 0 4px}
h1{font:700 18px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0 0 14px;text-align:center}
.f{margin-top:16px;position:relative}
label{display:block;font-size:12px;color:var(--mute)}
input{width:100%;font:500 15px "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:8px 0;outline:none}
input:focus-visible{border-bottom-color:var(--pr);box-shadow:0 1.5px 0 var(--pr)}
input:-webkit-autofill{-webkit-text-fill-color:var(--ink);box-shadow:0 0 0 40px var(--paper) inset}
.pw input{padding-right:70px}
.eye{position:absolute;right:0;bottom:6px;font:inherit;font-size:12px;color:var(--pr);background:none;border:0;cursor:pointer;padding:4px 2px;font-weight:600}
.msg{margin-top:14px;font-size:12.5px;font-weight:500;border-radius:6px}
.msg:empty{display:none}
.msg.err{color:var(--err);background:var(--errb);padding:8px 10px}
.msg.ok{color:var(--pr);background:var(--okb);padding:8px 10px}
.btn{width:100%;font:600 14px "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;padding:13px;border-radius:6px;border:0;background:var(--pr);color:var(--prt);cursor:pointer;margin-top:22px}
.btn:disabled{opacity:.6;cursor:wait}
.btn:focus-visible,.eye:focus-visible,.lnk:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.links{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.lnk{font:inherit;font-size:12px;background:none;border:0;color:var(--mute);cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--ink)}
.row{display:flex;align-items:baseline;gap:6px;margin:4px 0 0}
.row i{flex:1;border-bottom:1.5px dotted var(--line);transform:translateY(-3px)}
.row b{font-weight:600;overflow-wrap:anywhere;text-align:right}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="stage">
  <div class="slot" aria-hidden="true"></div>
  <div class="wrap">
    <div class="ticket" id="ticket">
      <div class="brand"><i aria-hidden="true">P</i><b>PDV Fácil</b></div>
      <hr class="cut">

      <section id="vLogin" hidden>
        <form id="form" novalidate>
          <div class="f">
            <label for="email">E-mail</label>
            <input id="email" type="email" inputmode="email" autocomplete="username" autofocus>
          </div>
          <div class="f pw">
            <label for="pass">Senha</label>
            <input id="pass" type="password" autocomplete="current-password">
            <button type="button" class="eye" id="eye" aria-pressed="false">Mostrar</button>
          </div>
          <div class="msg" id="msg" role="status" aria-live="polite"></div>
          <button class="btn" id="go" type="submit">Abrir caixa</button>
        </form>
        <div class="links">
          <button type="button" class="lnk" id="forgot">Esqueci a senha</button>
          <button type="button" class="lnk" id="fill" hidden>Usar conta de teste</button>
        </div>
      </section>

      <section id="vOk" hidden>
        <h1>Caixa aberto</h1>
        <div class="row">Operador<i></i><b id="oUser"></b></div>
        <button class="btn" id="enter" type="button">Ir para o PDV</button>
        <div class="links" style="justify-content:center"><button class="lnk" id="out" type="button">Sair</button></div>
      </section>
    </div>
  </div>
</main>

<script>
/* ============================================================
   CONFIGURAÇÃO — é aqui que o Supabase entra no futuro.
   1) Preencha SUPABASE_URL e SUPABASE_ANON_KEY
   2) Troque MODE de 'demo' para 'supabase'
   A interface não precisa mudar.
   ============================================================ */
const CONFIG = {
  MODE: 'supabase',                   // 'demo' | 'supabase'
  SUPABASE_URL: 'https://vgivsogjhduyxqyibbxj.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_hZDgAKKicAV8vBjFn2UT4A_4mjr5Ge3', // chave pública (publishable)
  SUPABASE_SDK: 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js',
  REDIRECT_URL: 'pdv-v3.html',        // para onde ir após entrar
  DEMO_USER: { email: 'teste@pdvfacil.com', password: 'pdv@2026' }
};

/* ---------- Autenticação (mesma interface nos dois modos) ---------- */
const SKEY = 'pdvfacil.session';
let memSession = null;
const wait = ms => new Promise(r => setTimeout(r, ms));
function store(fn){ for (const n of ['sessionStorage','localStorage']) { try { fn(window[n]); } catch(e){} } }

const demoProvider = {
  // Somente demonstração: conferir senha no navegador NÃO é seguro.
  async signIn(email, password){
    await wait(700);
    const u = CONFIG.DEMO_USER;
    if (email !== u.email || password !== u.password) return { error: 'E-mail ou senha incorretos.' };
    const session = { user: { id: 'demo-user', email: u.email } };
    memSession = session;
    store(s => s.setItem(SKEY, JSON.stringify(session)));
    return { session };
  },
  async getSession(){
    let found = memSession;
    store(s => { if (!found) { const v = s.getItem(SKEY); if (v) found = JSON.parse(v); } });
    return found;
  },
  async signOut(){ memSession = null; store(s => s.removeItem(SKEY)); },
  async resetPassword(){ await wait(500); return {}; }
};

let sbClient = null;
const supabaseProvider = {
  async client(){
    if (sbClient) return sbClient;
    if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY) throw new Error('Configure SUPABASE_URL e SUPABASE_ANON_KEY.');
    if (!window.supabase) await new Promise((ok, fail) => {
      const s = document.createElement('script'); s.src = CONFIG.SUPABASE_SDK; s.onload = ok;
      s.onerror = () => fail(new Error('Não foi possível carregar o Supabase.')); document.head.appendChild(s);
    });
    sbClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    return sbClient;
  },
  async signIn(email, password){
    const c = await this.client();
    const { data, error } = await c.auth.signInWithPassword({ email, password });
    if (error) return { error: /invalid login/i.test(error.message) ? 'E-mail ou senha incorretos.' : error.message };
    return { session: { user: data.user } };
  },
  async getSession(){
    const c = await this.client();
    const { data } = await c.auth.getSession();
    return data.session ? { user: data.session.user } : null;
  },
  async signOut(){ const c = await this.client(); await c.auth.signOut(); },
  async resetPassword(email){
    const c = await this.client();
    const { error } = await c.auth.resetPasswordForEmail(email, { redirectTo: location.href });
    return error ? { error: error.message } : {};
  }
};

const Auth = CONFIG.MODE === 'supabase' ? supabaseProvider : demoProvider;
window.PDVAuth = Auth; // o PDV pode chamar PDVAuth.getSession() para proteger a página

/* ---------- Interface ---------- */
const $ = id => document.getElementById(id);
const ticket = $('ticket'), msg = $('msg'), go = $('go');
const validEmail = v => /^\S+@\S+\.\S+$/.test(v);

function setMsg(text, kind){ msg.textContent = text || ''; msg.className = 'msg' + (kind ? ' ' + kind : ''); }
function show(view){
  $('vLogin').hidden = view !== 'login';
  $('vOk').hidden = view !== 'ok';
  ticket.classList.remove('print', 'shake'); void ticket.offsetWidth; ticket.classList.add('print');
  if (view === 'login') $('email').focus({ preventScroll: true });
}
const showOk = s => { $('oUser').textContent = s.user.email; show('ok'); };

$('eye').addEventListener('click', e => {
  const p = $('pass'), on = p.type === 'password';
  p.type = on ? 'text' : 'password';
  e.currentTarget.textContent = on ? 'Ocultar' : 'Mostrar';
  e.currentTarget.setAttribute('aria-pressed', String(on));
});

$('fill').addEventListener('click', () => {
  $('email').value = CONFIG.DEMO_USER.email; $('pass').value = CONFIG.DEMO_USER.password;
  setMsg(''); go.focus();
});

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('email').value.trim().toLowerCase(), pass = $('pass').value;
  const fail = t => { setMsg(t, 'err'); ticket.classList.remove('shake'); void ticket.offsetWidth; ticket.classList.add('shake'); };
  if (!validEmail(email)) { fail('Digite um e-mail válido.'); $('email').focus(); return; }
  if (!pass) { fail('Digite sua senha.'); $('pass').focus(); return; }
  go.disabled = true; go.textContent = 'Abrindo…'; setMsg('');
  try {
    const r = await Auth.signIn(email, pass);
    if (r.error) { fail(r.error); $('pass').select(); }
    else { $('pass').value = ''; showOk(r.session); }
  } catch (err) { fail(err.message || 'Não foi possível entrar. Tente de novo.'); }
  go.disabled = false; go.textContent = 'Abrir caixa';
});

$('forgot').addEventListener('click', async () => {
  const email = $('email').value.trim().toLowerCase();
  if (!validEmail(email)) { setMsg('Digite seu e-mail acima primeiro.', 'err'); $('email').focus(); return; }
  try {
    const r = await Auth.resetPassword(email);
    setMsg(r.error || 'Enviamos o link de nova senha, se o e-mail estiver cadastrado.', r.error ? 'err' : 'ok');
  } catch (err) { setMsg(err.message, 'err'); }
});

$('enter').addEventListener('click', () => { if (CONFIG.REDIRECT_URL) location.href = CONFIG.REDIRECT_URL; });
$('out').addEventListener('click', async () => {
  try { await Auth.signOut(); } catch (e) {}
  show('login'); setMsg('Você saiu do caixa.', 'ok');
});

/* ---------- Início ---------- */
if (CONFIG.MODE === 'demo') $('fill').hidden = false;
(async () => {
  let s = null;
  try { s = await Auth.getSession(); } catch (e) {}
  if (s) showOk(s); else show('login');
})();
</script>
</body>
</html>
